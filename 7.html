<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🎂 Make a Wish!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Pacifico&family=Quicksand:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink-50:#fff6fa; --pink-100:#ffe6f1; --pink-150:#ffdcec; --pink-200:#ffc7e3;
  --pink-300:#ffa9d4; --pink-400:#ff87c2; --pink-500:#ff66af; --pink-600:#f0479c; --pink-700:#d6318a;
  --mint-200:#d3f8ec; --mint-300:#aef0dc; --mint-400:#7fe3c4; --mint-600:#2f9c7c;
  --lav-200:#ede1ff; --lav-400:#cbaeff;
  --peach-200:#ffe3cf; --butter-200:#fff2bf; --sky-200:#d7ecff; --blush-300:#ffcfe1;
  --ink:#6b2f4c; --white:#ffffff;
  --accent-1:#7fe3c4; --accent-2:#cbaeff;
  --font-display:'Luckiest Guy', cursive, sans-serif;
  --font-script:'Pacifico', cursive, sans-serif;
  --font-body:'Quicksand', sans-serif;
  --font-cartoon-display:'Baloo 2', cursive, sans-serif;
  --font-cartoon-body:'Fredoka', sans-serif;
}
*,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  min-height:100vh; min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg,var(--pink-50),var(--pink-100) 55%,var(--pink-200));
  font-family:var(--font-body); font-weight:500; color:var(--ink);
  padding:18px; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button{ font-family:inherit; touch-action:manipulation; }
button:focus-visible{ outline:3px solid var(--pink-600); outline-offset:2px; }

/* ===== STAGE ===== */
.stage{
  position:relative;
  width:min(92vw, 420px, calc((100vh - 36px) * 5 / 7));
  width:min(92vw, 420px, calc((100dvh - 36px) * 5 / 7));
  aspect-ratio:5/7;
  border-radius:32px;
  overflow:hidden;
  background:linear-gradient(160deg,var(--pink-50),var(--pink-200));
  box-shadow:0 26px 60px -14px rgba(240,71,156,.45), 0 6px 18px rgba(240,71,156,.22);
  touch-action:pan-y;
}
@media (max-width:380px){ .stage{ border-radius:24px; } }
.viewport{ position:absolute; inset:0; overflow:hidden; border-radius:inherit; }
.ambient-canvas{ position:absolute; inset:0; z-index:3; pointer-events:none; }

.page{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:7% 8%; text-align:center;
  opacity:0; pointer-events:none; z-index:1;
  transition:opacity .55s ease;
}
.page.active{ opacity:1; pointer-events:auto; z-index:2; }

.bg-pastel{ position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.bg-pastel::before,.bg-pastel::after{ content:''; position:absolute; border-radius:50%; filter:blur(20px); pointer-events:none; }
.bg-pastel::before{ width:48%; height:48%; top:-10%; left:-12%; }
.bg-pastel::after{ width:40%; height:40%; bottom:-9%; right:-10%; }
.bg-pink-glow{ background:radial-gradient(90% 70% at 50% 28%, #fff, var(--pink-150) 60%, var(--pink-200) 100%); }
.bg-pink-glow::before{ background:var(--mint-300); opacity:.3; }
.bg-pink-glow::after{ background:var(--peach-200); opacity:.4; }

.content{ position:relative; z-index:2; }

/* ===== PAGE 7 : CLOSING CARD ===== */
.page7{ overflow-y:auto; -webkit-overflow-scrolling:touch; }
.finale-canvas{ position:absolute; inset:0; z-index:1; width:100%; height:100%; display:block; pointer-events:none; }
.cake-wrap{ width:36%; max-width:150px; margin-bottom:1%; opacity:1; cursor:pointer; border-radius:16px; }
.flame{ transform-origin:center bottom; animation:flicker 1.1s ease-in-out infinite; transition:opacity .4s ease, transform .4s ease; }
.flame.out{ opacity:0; transform:scaleY(.2); animation:none; }
.smoke{ position:absolute; width:14px; height:20px; border-radius:50%; background:rgba(180,180,190,.5); filter:blur(3px); pointer-events:none; z-index:3; }
.smoke.rise{ animation:smokeRise 1.6s ease-out forwards; }
.smoke-heart{
  position:absolute; width:15px; height:15px; color:rgba(200,200,210,.75);
  transform:translate(-50%,-90%) scale(.35); opacity:0; filter:blur(1.6px);
  pointer-events:none; z-index:3;
}
.smoke-heart.curl{ animation:smokeHeartCurl 2.3s ease-out forwards; }
.blow-hint{ font-weight:700; font-size:clamp(11.5px,3.2vw,12.5px); color:var(--pink-700); background:#fff; padding:6px 14px; border-radius:999px; box-shadow:0 6px 14px rgba(240,71,156,.2); margin:3% 0 0; }
.wish-msg{ position:absolute; left:50%; top:16%; transform:translateX(-50%); font-family:var(--font-script); color:var(--pink-700); font-size:clamp(14px,4vw,18px); background:#fff; padding:6px 14px; border-radius:999px; box-shadow:0 8px 18px rgba(240,71,156,.25); opacity:0; z-index:4; white-space:nowrap; }
.wish-msg.show{ animation:fadeInUp .5s ease forwards; }
.closing-line,.closing-sub-line{ opacity:1; margin:0; }
.page7.active .closing-line{ animation:headlineGlow 2.8s ease-in-out 1.4s infinite; }
.closing-sub-line{ margin-top:.5em; }
.mic-hint{ position:relative; z-index:2; margin-top:3%; border:none; background:#fff; color:var(--pink-700); font-weight:700; font-size:clamp(11.5px,3.2vw,12.5px); border-radius:999px; padding:8px 16px; box-shadow:0 4px 10px rgba(240,71,156,.2); cursor:pointer; transition:transform .15s ease, opacity .4s ease; }
.mic-hint:active{ transform:scale(.94); }
.replay-btn{ position:relative; z-index:2; margin-top:3%; border:none; padding:10px 22px; border-radius:999px; background:var(--pink-500); color:#fff; font-weight:700; font-size:14px; box-shadow:0 8px 18px rgba(240,71,156,.35); cursor:pointer; }
.replay-btn:active{ transform:scale(.94) !important; }
.lantern-wish{ margin-top:3%; width:88%; max-width:270px; opacity:0; pointer-events:none; transform:translateY(6px); transition:opacity .4s ease, transform .4s ease; }
.lantern-wish.show{ opacity:1; pointer-events:auto; transform:translateY(0); }
.lantern-label{ margin:0 0 6px; font-family:var(--font-script); font-size:clamp(12px,3.6vw,14.5px); color:var(--pink-700); }
.lantern-row{ display:flex; gap:8px; }
.lantern-input{
  flex:1; min-width:0; border:none; border-radius:999px; padding:10px 14px;
  font-family:var(--font-body); font-weight:600; font-size:16px; color:var(--ink);
  background:#fff; box-shadow:0 4px 10px rgba(240,71,156,.18); outline:none;
}
.lantern-input::placeholder{ color:var(--pink-300); font-weight:600; }
.lantern-send{
  flex-shrink:0; border:none; width:42px; height:42px; border-radius:50%;
  background:var(--pink-500); color:#fff; font-size:18px; box-shadow:0 6px 14px rgba(240,71,156,.32);
  cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .15s ease;
}
.lantern-send:active{ transform:scale(.9); }
.lantern-fly{
  position:absolute; left:50%; z-index:8; transform:translate(-50%,0);
  font-family:var(--font-script); font-size:clamp(12.5px,3.8vw,15px); color:var(--pink-700);
  background:#fff; padding:7px 16px; border-radius:999px; box-shadow:0 8px 18px rgba(240,71,156,.32);
  white-space:nowrap; max-width:74%; overflow:hidden; text-overflow:ellipsis;
  pointer-events:none; animation:lanternRise 2.6s ease-in forwards;
}
.lantern-archive{ position:absolute; inset:0; z-index:1; overflow:hidden; pointer-events:none; }
.lantern-archive-item{
  position:absolute; white-space:nowrap; max-width:70%; overflow:hidden; text-overflow:ellipsis;
  font-family:var(--font-script); color:var(--pink-700); font-size:clamp(11px,3vw,13px);
  opacity:0; animation:archiveFadeIn .9s ease forwards, archiveDrift 15s ease-in-out .9s infinite;
}

/* ===== CONTROLS ===== */
.controls{ position:absolute; left:0; right:0; bottom:3%; z-index:5; display:flex; flex-direction:column; align-items:center; gap:8px; }
.dots{ display:flex; gap:2px; }
.dot{ width:26px; height:26px; padding:0; border:none; background:transparent; cursor:pointer; position:relative; display:inline-block; }
.dot::after{ content:''; position:absolute; inset:9px; border-radius:50%; background:rgba(214,49,138,.32); transition:background .2s, transform .2s; }
.dot.active::after{ background:var(--pink-600); transform:scale(1.15); }
.control-buttons{ display:flex; gap:10px; }
.control-buttons button{ width:42px; height:42px; border-radius:50%; border:none; background:rgba(255,255,255,.85); box-shadow:0 4px 10px rgba(240,71,156,.25); cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; }

.nav-arrow{ position:absolute; top:50%; transform:translateY(-50%); width:40px; height:40px; border-radius:50%; border:none; background:rgba(255,255,255,.85); box-shadow:0 6px 14px rgba(240,71,156,.28); color:var(--pink-600); cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:6; }
.nav-arrow.prev{ left:3%; }
.nav-arrow.next{ right:3%; }
.nav-arrow:active{ transform:translateY(-50%) scale(.9); }

/* keyframes */
@keyframes flicker{ 0%,100%{ transform:scaleY(1) scaleX(1); } 50%{ transform:scaleY(1.12) scaleX(.9); } }
@keyframes smokeRise{ 0%{ opacity:.55; transform:translateY(0) scale(1); } 100%{ opacity:0; transform:translateY(-46px) scale(2.2); } }
@keyframes smokeHeartCurl{
  0%{ opacity:0; transform:translate(-50%,-90%) scale(.35) rotate(-6deg); }
  20%{ opacity:.6; transform:translate(-50%,-130%) scale(.85) rotate(4deg); }
  50%{ opacity:.62; transform:translate(-48%,-158%) scale(1) rotate(-3deg); }
  100%{ opacity:0; transform:translate(-46%,-210%) scale(1.4) rotate(6deg); }
}
@keyframes fadeInUp{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
@keyframes headlineGlow{ 0%,100%{ text-shadow:0 6px 14px rgba(240,71,156,.3); } 50%{ text-shadow:0 6px 22px rgba(240,71,156,.55), 0 0 26px rgba(255,193,223,.7); } }
@keyframes lanternRise{
  0%{ transform:translate(-50%,0) scale(.7); opacity:0; }
  15%{ transform:translate(-50%,-14%) scale(1); opacity:1; }
  85%{ transform:translate(-50%,-230%) scale(1); opacity:1; }
  100%{ transform:translate(-50%,-260%) scale(.85); opacity:0; }
}
@keyframes archiveFadeIn{ from{ opacity:0; } to{ opacity:.24; } }
@keyframes archiveDrift{ 0%,100%{ transform:translate(0,0) rotate(0deg); } 50%{ transform:translate(6px,-14px) rotate(1.2deg); } }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="viewport">
    <canvas class="ambient-canvas" id="ambientCanvas"></canvas>

    <!-- PAGE 7 : CLOSING CARD -->
    <section class="page page7 active">
      <div class="bg-pastel bg-pink-glow"></div>
      <canvas class="finale-canvas" id="finaleCanvas"></canvas>
      <div class="lantern-archive" id="lanternArchive" aria-hidden="true"></div>

      <div class="cake-wrap content" id="cakeWrap" role="button" tabindex="0" aria-label="Tap to blow out the candle and make a wish">
        <svg viewBox="0 0 200 170">
          <ellipse cx="100" cy="152" rx="76" ry="10" fill="#ffd0e6"/>
          <rect x="35" y="112" width="130" height="36" rx="10" style="fill:var(--pink-300)"/>
          <rect x="55" y="82" width="90" height="34" rx="10" style="fill:var(--pink-400)"/>
          <rect x="45" y="124" width="8" height="8" rx="2" style="fill:#fff2bf; animation:sprinkleTwinkle 1.8s ease-in-out .05s infinite"/>
          <rect x="70" y="130" width="8" height="8" rx="2" style="fill:#aef0dc; animation:sprinkleTwinkle 1.8s ease-in-out .3s infinite"/>
          <rect x="95" y="122" width="8" height="8" rx="2" style="fill:#cbaeff; animation:sprinkleTwinkle 1.8s ease-in-out .55s infinite"/>
          <rect x="120" y="130" width="8" height="8" rx="2" style="fill:#fff2bf; animation:sprinkleTwinkle 1.8s ease-in-out .8s infinite"/>
          <rect x="145" y="124" width="8" height="8" rx="2" style="fill:#aef0dc; animation:sprinkleTwinkle 1.8s ease-in-out 1.05s infinite"/>
          <path d="M55 82 Q65 68 75 82 Q85 68 95 82 Q105 68 115 82 Q125 68 135 82 Q145 68 145 82 L145 92 L55 92Z" fill="#fff"/>
          <rect x="94" y="48" width="12" height="36" rx="4" fill="#fff2bf"/>
          <path class="flame" d="M100 16 C90 28 90 40 100 46 C110 40 110 28 100 16Z" fill="#ffb648"/>
          <path d="M100 22 C95 30 95 37 100 41 C105 37 105 30 100 22Z" fill="#fff2bf"/>
        </svg>
      </div>

      <p class="blow-hint content" id="blowHint">🎂 tap the cake to make a wish</p>
      <p class="wish-msg" id="wishMsg">Make a wish! ✨</p>

      <p class="headline-display closing-line content">Happy Birthday!</p>
      <p class="headline-script closing-sub-line content"><span id="nameSlot">Friend</span>, thinking of you today, and every day ✨</p>

      <button type="button" class="mic-hint content" id="micHintBtn">🎤 or blow into your mic</button>

      <div class="lantern-wish content" id="lanternWish">
        <p class="lantern-label">write a secret wish &amp; send it up ✨</p>
        <div class="lantern-row">
          <input type="text" id="lanternInput" class="lantern-input" maxlength="46" placeholder="my wish is..." autocomplete="off">
          <button type="button" id="lanternSendBtn" class="lantern-send" aria-label="Send your wish up like a lantern">🏮</button>
        </div>
      </div>

      <button type="button" class="replay-btn" id="replayBtn">↻ Watch Again</button>
    </section>
  </div>

  <button type="button" class="nav-arrow prev" id="prevBtn" aria-label="Previous page">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div class="controls">
    <div class="control-buttons">
      <button type="button" id="muteBtn" aria-label="Mute or unmute music">🔊</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.9.9/Tone.js"></script>
<script>
(function(){
  /* ================================================================
     ✏️  EDIT YOUR CARD HERE
     ================================================================ */
  var CONFIG = {
    name: "Najiba"
  };

  /* ---- utils ---- */
  var REDUCED_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var COLORS = ['#ff87c2','#ffb4d8','#aef0dc','#cbaeff','#ffe3cf','#fff2bf','#ffffff'];
  function rand(a,b){ return Math.random()*(b-a)+a; }
  function pick(arr){ return arr[(Math.random()*arr.length)|0]; }

  /* ---- canvas particle drawing ---- */
  function drawHeartPath(ctx,s){
    ctx.beginPath();
    ctx.moveTo(0, s*0.35);
    ctx.bezierCurveTo(-s*0.1, s*0.05, -s*0.5, s*0.05, -s*0.5, -s*0.25);
    ctx.bezierCurveTo(-s*0.5, -s*0.55, -s*0.15, -s*0.6, 0, -s*0.3);
    ctx.bezierCurveTo(s*0.15, -s*0.6, s*0.5, -s*0.55, s*0.5, -s*0.25);
    ctx.bezierCurveTo(s*0.5, s*0.05, s*0.1, s*0.05, 0, s*0.35);
    ctx.closePath();
  }
  function drawStarPath(ctx,s){
    var spikes=5, outerR=s/2, innerR=outerR*0.42, rot=-Math.PI/2, step=Math.PI/spikes;
    ctx.beginPath();
    ctx.moveTo(0,-outerR);
    for(var i=0;i<spikes;i++){
      rot += step; ctx.lineTo(Math.cos(rot)*innerR, Math.sin(rot)*innerR);
      rot += step; ctx.lineTo(Math.cos(rot)*outerR, Math.sin(rot)*outerR);
    }
    ctx.closePath();
  }
  function drawParticle(ctx,p){
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life)) * (p.fade!==undefined ? p.fade : 1);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    if(p.kind === 'confetti'){
      ctx.fillRect(-p.size/2, -p.size*0.18, p.size, p.size*0.36);
    } else if(p.kind === 'heart'){
      drawHeartPath(ctx,p.size); ctx.fill();
    } else if(p.kind === 'star'){
      var tw = 0.55 + 0.45*Math.sin(p.twinklePhase||0);
      ctx.globalAlpha *= tw;
      drawStarPath(ctx,p.size); ctx.fill();
    } else if(p.kind === 'dot'){
      ctx.beginPath(); ctx.arc(0,0,p.size/2,0,6.2832); ctx.fill();
    } else if(p.kind === 'petal'){
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size*0.55, p.size*0.32, 0, 0, 6.2832);
      ctx.fill();
    }
    ctx.restore();
  }

  function makeField(canvas, opts){
    var ctx = canvas.getContext('2d');
    var dpr = Math.max(1, window.devicePixelRatio || 1);
    var fadeMul = (opts && opts.fade) || 1;
    var W=0, H=0, particles=[], running=false, rafId=null, lastT=null;

    function resize(){
      var r = canvas.getBoundingClientRect();
      W = r.width; H = r.height;
      canvas.width = Math.max(1, Math.round(W*dpr));
      canvas.height = Math.max(1, Math.round(H*dpr));
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    resize();

    function spawnAmbient(kind){
      var p = { kind:kind, color:pick(COLORS), rot:rand(0,6.28), rotSpeed:rand(-2,2),
        wobble:rand(6,16), wobbleSpeed:rand(0.8,2.2), wobblePhase:rand(0,6.28), life:1, decay:0, fade:fadeMul };
      if(kind==='confetti'){
        p.size=rand(7,14); p.x=rand(0,W); p.y=rand(-H*0.4,0); p.vx=rand(-10,10); p.vy=rand(28,50); p.gravity=rand(14,22); p.drag=0.35;
      } else if(kind==='heart'){
        p.size=rand(10,17); p.x=rand(0,W); p.y=H+rand(0,H*0.3); p.vx=rand(-6,6); p.vy=-rand(16,26); p.gravity=-rand(1,4); p.drag=0.2;
      } else if(kind==='star'){
        p.size=rand(6,11); p.x=rand(0,W); p.y=rand(0,H); p.vx=0; p.vy=0; p.gravity=0; p.drag=0; p.twinklePhase=rand(0,6.28); p.twinkleSpeed=rand(1.2,2.4);
      } else if(kind==='petal'){
        p.size=rand(9,15); p.x=rand(0,W); p.y=rand(-H*0.3,0); p.vx=rand(-5,5); p.vy=rand(10,20); p.gravity=rand(3,7); p.drag=0.25;
      }
      return p;
    }
    function seedAmbient(kinds, countEach){
      particles = [];
      kinds.forEach(function(k){ for(var i=0;i<countEach;i++) particles.push(spawnAmbient(k)); });
    }
    function burst(x,y,count){
      for(var i=0;i<count;i++){
        var isHeart = i % 4 === 0;
        var angle = rand(0,6.28), speed = rand(70,230);
        particles.push({
          kind: isHeart ? 'heart' : (i % 2 ? 'confetti' : 'dot'),
          color: pick(COLORS), size: isHeart ? rand(10,15) : rand(6,12),
          x:x, y:y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed-70,
          gravity:170, drag:0.4, rot:rand(0,6.28), rotSpeed:rand(-7,7),
          wobble:0, wobbleSpeed:0, wobblePhase:0, life:1, decay:rand(0.5,0.85), fade:1
        });
      }
    }

    function update(p,dt){
      p.vy += p.gravity*dt;
      if(p.drag){ p.vx -= p.vx*p.drag*dt; p.vy -= (p.vy*p.drag*0.3)*dt; }
      var wob = p.wobble ? Math.sin((p.wobblePhase||0)+performance.now()*0.001*(p.wobbleSpeed||1))*p.wobble*dt : 0;
      p.x += (p.vx||0)*dt + wob;
      p.y += (p.vy||0)*dt;
      p.rot += (p.rotSpeed||0)*dt;
      if(p.kind==='star') p.twinklePhase = (p.twinklePhase||0) + (p.twinkleSpeed||1.5)*dt;
      if(p.decay) p.life -= p.decay*dt;
    }
    function loop(t){
      if(!running) return;
      if(lastT===null) lastT=t;
      var dt = Math.min(0.05,(t-lastT)/1000);
      lastT = t;
      ctx.clearRect(0,0,W,H);
      for(var i=particles.length-1;i>=0;i--){
        var p = particles[i];
        update(p,dt);
        if(p.decay && p.life<=0){ particles.splice(i,1); continue; }
        var offBottom = p.y > H+40 && (p.vy||0) > 0;
        var offTop = p.y < -40 && (p.vy||0) < 0;
        if(!p.decay && (offBottom||offTop)){ particles[i] = spawnAmbient(p.kind); continue; }
        drawParticle(ctx,p);
      }
      rafId = requestAnimationFrame(loop);
    }
    return {
      start: function(){ if(running) return; running=true; lastT=null; rafId=requestAnimationFrame(loop); },
      stop: function(){ running=false; if(rafId) cancelAnimationFrame(rafId); ctx.clearRect(0,0,W,H); },
      seedAmbient: seedAmbient,
      burst: burst,
      resize: resize,
      getDimensions: function(){ return {W:W, H:H}; }
    };
  }

  /* ---- DOM refs ---- */
  var stage = document.getElementById('stage');
  var ambientCanvas = document.getElementById('ambientCanvas');
  var finaleCanvas = document.getElementById('finaleCanvas');

  var ambientField = makeField(ambientCanvas, { fade:0.28 });
  var finaleField = makeField(finaleCanvas);

  if(!REDUCED_MOTION){
    ambientField.seedAmbient(['star','dot'], 6);
    ambientField.start();
    finaleField.seedAmbient(['star','petal'], 4);
    finaleField.start();
  }

  /* ---- name ---- */
  document.getElementById('nameSlot').textContent = CONFIG.name || 'Friend';
  document.title = (CONFIG.name || 'Friend') + "'s Wish 🎂";

  /* ---- candle blow ---- */
  var candleBlown = false;
  function getFlameOrigin(){
    var flame = document.querySelector('.page7 .flame');
    var canvasRect = finaleCanvas.getBoundingClientRect();
    if(!flame) return { x:canvasRect.width/2, y:canvasRect.height*0.35 };
    var fr = flame.getBoundingClientRect();
    return { x: fr.left + fr.width/2 - canvasRect.left, y: fr.top + fr.height/2 - canvasRect.top };
  }
  function spawnSmoke(origin){
    var s = document.createElement('div');
    s.className = 'smoke rise';
    s.style.left = origin.x + 'px';
    s.style.top = origin.y + 'px';
    document.querySelector('.page7').appendChild(s);
    setTimeout(function(){ s.remove(); }, 1700);
  }
  function spawnSmokeHeart(origin){
    var el = document.createElement('div');
    el.className = 'smoke-heart';
    el.style.left = origin.x + 'px';
    el.style.top = (origin.y - 6) + 'px';
    el.innerHTML = '<svg viewBox="-30 -30 60 60" width="100%" height="100%" aria-hidden="true"><path d="M0 17 C-5 12 -25 2 -25 -13 C-25 -27 -7 -30 0 -15 C7 -30 25 -27 25 -13 C25 2 5 12 0 17Z" fill="currentColor"/></svg>';
    document.querySelector('.page7').appendChild(el);
    requestAnimationFrame(function(){ el.classList.add('curl'); });
    setTimeout(function(){ el.remove(); }, 2700);
  }
  function blowOutCandle(){
    if(candleBlown) return;
    candleBlown = true;
    var flame = document.querySelector('.page7 .flame');
    if(flame) flame.classList.add('out');
    var origin = getFlameOrigin();
    spawnSmoke(origin);
    setTimeout(function(){ spawnSmokeHeart(origin); }, 320);
    finaleField.burst(origin.x, origin.y, 26);
    var wish = document.getElementById('wishMsg');
    if(wish) wish.classList.add('show');
    var hint = document.getElementById('blowHint');
    if(hint) hint.style.opacity = '0';
    playChime();

    if(!REDUCED_MOTION){
      var rect = finaleCanvas.getBoundingClientRect();
      [320, 620].forEach(function(delay){
        setTimeout(function(){
          finaleField.burst(rand(rect.width*0.2, rect.width*0.8), rand(rect.height*0.2, rect.height*0.55), 18);
          playChime();
        }, delay);
      });
      setTimeout(function(){ finaleField.seedAmbient(['confetti','star'], 5); }, 900);
    }

    var micBtn = document.getElementById('micHintBtn');
    if(micBtn) micBtn.style.opacity = '0';
    setTimeout(function(){
      var lantern = document.getElementById('lanternWish');
      if(lantern) lantern.classList.add('show');
    }, 700);
  }
  function resetCandle(){
    candleBlown = false;
    var flame = document.querySelector('.page7 .flame');
    if(flame) flame.classList.remove('out');
    var wish = document.getElementById('wishMsg');
    if(wish) wish.classList.remove('show');
    var hint = document.getElementById('blowHint');
    if(hint) hint.style.opacity = '';
    var micBtn = document.getElementById('micHintBtn');
    if(micBtn) micBtn.style.opacity = '';
    var lantern = document.getElementById('lanternWish');
    if(lantern) lantern.classList.remove('show');
    var lanternInput = document.getElementById('lanternInput');
    if(lanternInput) lanternInput.value = '';
  }
  var cakeWrap = document.getElementById('cakeWrap');
  cakeWrap.addEventListener('click', function(){ blowOutCandle(); });
  cakeWrap.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); blowOutCandle(); }
  });

  /* ---- mic blow ---- */
  var micListening = false;
  document.getElementById('micHintBtn').addEventListener('click', function(){
    var btn = this;
    if(micListening || candleBlown) return;
    if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      btn.textContent = '🎤 mic needs https — tap the cake instead!';
      return;
    }
    btn.textContent = '🎤 requesting mic…';
    navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
      btn.textContent = '🎤 listening… blow now!';
      micListening = true;
      startBlowDetection(stream, function(){
        btn.textContent = '🎤 nice blow! 🎉';
        micListening = false;
      }, function(){
        btn.textContent = '🎤 or blow into your mic';
        micListening = false;
      });
    }).catch(function(){
      btn.textContent = '🎤 mic access denied — tap the cake instead!';
    });
  });
  function startBlowDetection(stream, onBlow, onTimeout){
    try{
      var Actx = window.AudioContext || window.webkitAudioContext;
      var actx = new Actx();
      var source = actx.createMediaStreamSource(stream);
      var analyser = actx.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.6;
      source.connect(analyser);
      var data = new Uint8Array(analyser.frequencyBinCount);
      var loud = 0, start = performance.now(), stopped = false;
      function stopTracks(){ stream.getTracks().forEach(function(t){ t.stop(); }); }
      function poll(){
        if(stopped) return;
        analyser.getByteFrequencyData(data);
        var sum=0; for(var i=0;i<data.length;i++) sum += data[i];
        var avg = sum/data.length;
        if(avg > 42){ loud++; } else { loud = Math.max(0, loud-1); }
        if(loud > 10){ stopped=true; stopTracks(); blowOutCandle(); onBlow(); return; }
        if(performance.now() - start > 9000){ stopped=true; stopTracks(); onTimeout(); return; }
        requestAnimationFrame(poll);
      }
      poll();
    }catch(e){ console.warn('blow detection failed', e); onTimeout(); }
  }

  /* ---- lantern wishes ---- */
  var lanternInputEl = document.getElementById('lanternInput');
  var lanternSendBtn = document.getElementById('lanternSendBtn');
  var lanternArchiveEl = document.getElementById('lanternArchive');
  var LANTERN_ARCHIVE_MAX = 3;
  var lanternArchiveList = [];
  var LANTERN_ARCHIVE_SPOTS = [
    { top:'9%',  left:'10%' },
    { top:'18%', left:'60%' },
    { top:'64%', left:'16%' },
    { top:'74%', left:'56%' },
    { top:'42%', left:'6%' },
    { top:'50%', left:'72%' }
  ];
  function renderLanternArchive(){
    if(!lanternArchiveEl) return;
    lanternArchiveEl.innerHTML = '';
    lanternArchiveList.forEach(function(text, i){
      var span = document.createElement('span');
      span.className = 'lantern-archive-item';
      span.textContent = '🏮 ' + text;
      var spot = LANTERN_ARCHIVE_SPOTS[i % LANTERN_ARCHIVE_SPOTS.length];
      span.style.top = spot.top;
      span.style.left = spot.left;
      span.style.animationDuration = '.9s, ' + (13 + i*2.6) + 's';
      span.style.animationDelay = '0s, ' + (-(i*3.4)) + 's';
      lanternArchiveEl.appendChild(span);
    });
  }
  function addToLanternArchive(text){
    lanternArchiveList.push(text);
    if(lanternArchiveList.length > LANTERN_ARCHIVE_MAX) lanternArchiveList.shift();
    renderLanternArchive();
  }
  function releaseLantern(){
    var text = lanternInputEl.value.trim();
    if(!text){ lanternInputEl.focus(); return; }
    var stageRect = stage.getBoundingClientRect();
    var inputRect = lanternInputEl.getBoundingClientRect();
    var originX = inputRect.left + inputRect.width/2 - stageRect.left;
    var originY = inputRect.top - stageRect.top;
    var fly = document.createElement('div');
    fly.className = 'lantern-fly';
    fly.textContent = '🏮 ' + text;
    fly.style.top = originY + 'px';
    document.querySelector('.viewport').appendChild(fly);
    setTimeout(function(){ fly.remove(); }, 2700);
    finaleField.burst(originX, originY, 16);
    playChime();
    addToLanternArchive(text);
    lanternInputEl.value = '';
    lanternInputEl.blur();
  }
  lanternSendBtn.addEventListener('click', releaseLantern);
  lanternInputEl.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); releaseLantern(); }
  });

  /* ---- audio chime ---- */
  var chimeSynth = null;
  var muted = false;
  function initAudio(){
    if(!window.Tone) return Promise.resolve();
    return Tone.start().then(function(){
      if(Tone.context.state !== 'running') return Tone.context.resume();
    }).then(function(){
      if(!chimeSynth){
        chimeSynth = new Tone.Synth({ oscillator:{type:'sine'}, envelope:{attack:0.005,decay:0.25,sustain:0,release:0.25} }).toDestination();
        chimeSynth.volume.value = -14;
      }
    }).catch(function(){});
  }
  function playChime(){
    if(muted || !chimeSynth) return;
    try{
      chimeSynth.triggerAttackRelease('C6','16n');
      setTimeout(function(){ try{ chimeSynth.triggerAttackRelease('E6','16n'); }catch(e){} }, 100);
    }catch(e){}
  }

  document.getElementById('muteBtn').addEventListener('click', function(){
    muted = !muted;
    this.textContent = muted ? '🔇' : '🔊';
    if(chimeSynth) chimeSynth.volume.value = muted ? -100 : -14;
  });

  /* initialize audio on first user interaction */
  document.body.addEventListener('click', function initAudioOnce(){
    initAudio();
    document.body.removeEventListener('click', initAudioOnce);
  }, { once: true });

  /* ---- navigation ---- */
  function goTo(url){ window.location.href = url; }
  document.getElementById('prevBtn').addEventListener('click', function(){ goTo('6.html'); });
  document.getElementById('replayBtn').addEventListener('click', function(){ goTo('1.html'); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowLeft') goTo('6.html');
  });

  /* swipe navigation */
  var touchStartX=0, touchStartY=0, touchActive=false;
  stage.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchActive = true;
  }, { passive:true });
  stage.addEventListener('touchend', function(e){
    if(!touchActive) return;
    touchActive = false;
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy) * 1.4){
      if(dx > 0) goTo('6.html');
    }
  }, { passive:true });

  /* resize handler */
  window.addEventListener('resize', function(){
    ambientField.resize();
    finaleField.resize();
  });

  /* initial burst on load */
  setTimeout(function(){
    var origin = getFlameOrigin();
    finaleField.burst(origin.x, origin.y, 24);
  }, 300);

})();
</script>
</body>
</html>
