<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>✨ Exhibit IV — Portrait of You ✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Pacifico&family=Quicksand:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-50: #fff6fa;
            --pink-100: #ffe6f1;
            --pink-150: #ffdcec;
            --pink-200: #ffc7e3;
            --pink-300: #ffa9d4;
            --pink-400: #ff87c2;
            --pink-500: #ff66af;
            --pink-600: #f0479c;
            --pink-700: #d6318a;
            --mint-200: #d3f8ec;
            --mint-300: #aef0dc;
            --mint-400: #7fe3c4;
            --mint-600: #2f9c7c;
            --lav-200: #ede1ff;
            --lav-400: #cbaeff;
            --peach-200: #ffe3cf;
            --butter-200: #fff2bf;
            --sky-200: #d7ecff;
            --blush-300: #ffcfe1;
            /* --- gallery / exhibit accents, tied to the actual gilt frame in the photo --- */
            --gold: #c9974f;
            --gold-light: #e9c98a;
            --gold-deep: #8c6a2f;
            --charcoal: #2c2420;
            --plaque-cream: #fbf3e6;
            --ink: #6b2f4c;
            --white: #ffffff;
            --accent-1: #7fe3c4;
            --accent-2: #cbaeff;
            --font-display: 'Luckiest Guy', cursive, sans-serif;
            --font-script: 'Pacifico', cursive, sans-serif;
            --font-body: 'Quicksand', sans-serif;
            --font-cartoon-display: 'Baloo 2', cursive, sans-serif;
            --font-cartoon-body: 'Fredoka', sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, var(--pink-50), var(--pink-100) 55%, var(--pink-200));
            font-family: var(--font-body);
            font-weight: 500;
            color: var(--ink);
            padding: 18px;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        button {
            font-family: inherit;
            touch-action: manipulation;
        }

        button:focus-visible {
            outline: 3px solid var(--pink-600);
            outline-offset: 2px;
        }

        /* ===== STAGE ===== */
        .stage {
            position: relative;
            width: min(92vw, 420px, calc((100vh - 36px) * 5 / 7));
            width: min(92vw, 420px, calc((100dvh - 36px) * 5 / 7));
            aspect-ratio: 5/7;
            border-radius: 32px;
            overflow: hidden;
            background: linear-gradient(160deg, var(--pink-50), var(--pink-200));
            box-shadow: 0 26px 60px -14px rgba(240, 71, 156, .45), 0 6px 18px rgba(240, 71, 156, .22);
            touch-action: pan-y;
        }

        @media (max-width:380px) {
            .stage {
                border-radius: 24px;
            }
        }

        .viewport {
            position: absolute;
            inset: 0;
            overflow: hidden;
            border-radius: inherit;
        }

        .ambient-canvas {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }

        .page {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6.5% 8%;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            z-index: 1;
            transition: opacity .55s ease;
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 2;
        }

        .bg-pastel {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-pastel::before,
        .bg-pastel::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(20px);
            pointer-events: none;
        }

        .bg-pastel::before {
            width: 48%;
            height: 48%;
            top: -10%;
            left: -12%;
            animation: bgDriftA 10s ease-in-out infinite;
        }

        .bg-pastel::after {
            width: 40%;
            height: 40%;
            bottom: -9%;
            right: -10%;
            animation: bgDriftB 12.5s ease-in-out infinite;
        }

        .bg-pink-soft {
            background: radial-gradient(100% 100% at 50% 35%, #fff, var(--pink-150) 60%, var(--mint-200) 100%);
        }

        .bg-pink-soft::before {
            background: var(--lav-400);
            opacity: .25;
        }

        .bg-pink-soft::after {
            background: var(--peach-200);
            opacity: .35;
        }

        .content {
            position: relative;
            z-index: 2;
        }

        /* ===================================================== */
        /* ============  EXHIBIT IV — PAGE CONTENT  ============ */
        /* ===================================================== */

        .gallery-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(10px, 3vw, 16px);
        }

        /* --- eyebrow: exhibit number, doubles as page progress cue --- */
        .gallery-eyebrow {
            display: flex;
            align-items: center;
            gap: 9px;
            animation: fadeDown .6s ease .05s both;
        }

        .eyebrow-line {
            width: 22px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-deep));
        }

        .eyebrow-line.right {
            background: linear-gradient(90deg, var(--gold-deep), transparent);
        }

        .eyebrow-text {
            font-family: var(--font-body);
            font-weight: 700;
            font-size: clamp(10px, 2.8vw, 11.5px);
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--pink-700);
            white-space: nowrap;
        }

        /* --- the framed photograph --- */
        .frame-wrap {
            position: relative;
            width: 60%;
            max-width: 225px;
            max-height: 42dvh;
            padding: 8px;
            background: linear-gradient(160deg, #fffdf8, var(--plaque-cream));
            border-radius: 22px;
            box-shadow:
                0 0 0 1.5px rgba(201, 151, 79, .55),
                0 16px 32px -12px rgba(44, 36, 32, .38),
                0 4px 10px rgba(44, 36, 32, .16);
            animation: framePop .7s cubic-bezier(.34, 1.56, .64, 1) .25s both;
        }

        .frame-corner {
            position: absolute;
            width: 8px;
            height: 8px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            border-radius: 2px;
            transform: rotate(45deg);
            box-shadow: 0 1px 3px rgba(44, 36, 32, .4);
        }

        .frame-corner.tl { top: -4px; left: -4px; }
        .frame-corner.br { bottom: -4px; right: -4px; }

        .frame-inner {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            border-radius: 16px;
            overflow: hidden;
            background: #ece3d3;
        }

        .art-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transition: opacity .7s ease;
        }

        .art-photo.loaded {
            opacity: 1;
        }

        .shine-sweep {
            position: absolute;
            top: 0;
            left: -60%;
            width: 35%;
            height: 140%;
            background: linear-gradient(75deg, transparent, rgba(255, 255, 255, .55), transparent);
            transform: rotate(8deg);
            animation: shineSweep 1.3s ease 1.1s 1 both;
            pointer-events: none;
        }

        /* --- the placard: a museum wall label for the photo --- */
        .placard {
            width: 84%;
            max-width: 265px;
            background: linear-gradient(160deg, #fffdf8, var(--plaque-cream));
            border: 1px solid rgba(201, 151, 79, .35);
            border-radius: 14px;
            padding: 10px 16px 12px;
            box-shadow: 0 10px 20px -10px rgba(44, 36, 32, .28);
            animation: slideUp .6s ease .8s both;
        }

        .placard-title {
            font-family: var(--font-cartoon-display);
            font-weight: 700;
            font-size: clamp(15px, 4.6vw, 19px);
            color: var(--charcoal);
            margin: 0 0 3px;
            letter-spacing: .2px;
        }

        .placard-meta {
            font-family: var(--font-body);
            font-weight: 700;
            font-size: clamp(9px, 2.5vw, 10.5px);
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--gold-deep);
            margin: 0 0 8px;
        }

        .placard-divider {
            width: 32px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 0 auto 8px;
            border-radius: 2px;
        }

        .placard-desc {
            font-family: var(--font-script);
            font-size: clamp(13px, 3.6vw, 15px);
            line-height: 1.45;
            color: var(--charcoal);
            margin: 0;
            opacity: .92;
        }

        /* --- audio guide button (this page's "play song" control) --- */
        .audio-guide {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 9px 17px 9px 11px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #3a2f27, var(--charcoal));
            box-shadow: 0 10px 20px -9px rgba(44, 36, 32, .55), inset 0 0 0 1px rgba(233, 201, 138, .28);
            cursor: pointer;
            animation: fadeIn .5s ease 1.1s both;
        }

        .audio-guide:active {
            transform: scale(.96);
        }

        .ag-icon {
            width: 21px;
            height: 21px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(233, 201, 138, .16);
            border-radius: 50%;
            flex-shrink: 0;
            color: var(--gold-light);
        }

        .ag-icon svg { display: none; }
        .ag-icon svg.icon-play { display: block; }
        .audio-guide.is-playing .ag-icon svg.icon-play { display: none; }
        .audio-guide.is-playing .ag-icon svg.icon-pause { display: block; }

        .ag-text {
            font-family: var(--font-body);
            font-weight: 600;
            font-size: clamp(11px, 3vw, 12.5px);
            color: var(--gold-light);
            white-space: nowrap;
        }

        .ag-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
        }

        .ag-bars i {
            width: 2.4px;
            background: var(--gold-light);
            border-radius: 1px;
            height: 4px;
            display: block;
            animation: eqBar .9s ease-in-out infinite;
            animation-play-state: paused;
        }

        .ag-bars i:nth-child(2) { animation-delay: .15s; }
        .ag-bars i:nth-child(3) { animation-delay: .3s; }
        .audio-guide.is-playing .ag-bars i { animation-play-state: running; }

        /* ===== CONTROLS ===== */
        .controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 3%;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .dots {
            display: flex;
            gap: 2px;
        }

        .dot {
            width: 26px;
            height: 26px;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            position: relative;
            display: inline-block;
        }

        .dot::after {
            content: '';
            position: absolute;
            inset: 9px;
            border-radius: 50%;
            background: rgba(214, 49, 138, .32);
            transition: background .2s, transform .2s;
        }

        .dot.active::after {
            background: var(--pink-600);
            transform: scale(1.15);
        }

        .control-buttons {
            display: flex;
            gap: 10px;
        }

        .control-buttons button {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, .85);
            box-shadow: 0 4px 10px rgba(240, 71, 156, .25);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, .85);
            box-shadow: 0 6px 14px rgba(240, 71, 156, .28);
            color: var(--pink-600);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 6;
        }

        .nav-arrow.prev {
            left: 3%;
        }

        .nav-arrow.next {
            right: 3%;
        }

        .nav-arrow:active {
            transform: translateY(-50%) scale(.9);
        }

        /* keyframes */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes framePop {
            0% { opacity: 0; transform: scale(.85) translateY(14px); }
            60% { opacity: 1; transform: scale(1.03) translateY(-2px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes shineSweep {
            0% { left: -60%; opacity: 0; }
            15% { opacity: .9; }
            100% { left: 130%; opacity: 0; }
        }

        @keyframes eqBar {
            0%, 100% { height: 4px; }
            50% { height: 12px; }
        }

        @keyframes bgDriftA {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(6%, 8%) scale(1.15);
            }
        }

        @keyframes bgDriftB {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(-7%, -6%) scale(1.1);
            }
        }

        @media (prefers-reduced-motion:reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="viewport">
            <canvas class="ambient-canvas" id="ambientCanvas"></canvas>

            <!-- PAGE 4 : EXHIBIT IV — PORTRAIT OF YOU -->
            <section class="page page4 active">
                <div class="bg-pastel bg-pink-soft"></div>

                <div class="content gallery-content">

                    <div class="gallery-eyebrow">
                        <span class="eyebrow-line"></span>
                        <span class="eyebrow-text">Exhibit IV</span>
                        <span class="eyebrow-line right"></span>
                    </div>

                    <div class="frame-wrap">
                        <span class="frame-corner tl"></span>
                        <span class="frame-corner br"></span>
                        <div class="frame-inner">
                            <!-- your photo — already saved at images/art.jpg -->
                            <img src="images/art.png" alt="Sitting in a gallery, looking at your portrait" class="art-photo" id="artPhoto">
                            <span class="shine-sweep" aria-hidden="true"></span>
                        </div>
                    </div>

                    <div class="placard">
                        <p class="placard-title">Portrait of You</p>
                        <p class="placard-meta">Oil, Gold Leaf &amp; One Long Look</p>
                        <div class="placard-divider"></div>
                        <p class="placard-desc">Everyone else came for the art.<br>I came for you.</p>
                    </div>

                    <button type="button" class="audio-guide" id="audioGuideBtn" aria-label="Play our song">
                        <span class="ag-icon">
                            <svg class="icon-play" viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                            <svg class="icon-pause" viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
                        </span>
                        <span class="ag-text">Press Play — Audio Guide</span>
                        <span class="ag-bars" aria-hidden="true"><i></i><i></i><i></i></span>
                    </button>

                </div>
            </section>
        </div>

        <button type="button" class="nav-arrow prev" id="prevBtn" aria-label="Previous page">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <button type="button" class="nav-arrow next" id="nextBtn" aria-label="Next page">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 5 L16 12 L9 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>

        <div class="controls">
            <div class="control-buttons">
                <button type="button" id="muteBtn" aria-label="Mute or unmute music">🔊</button>
            </div>
        </div>

        <!-- 🎵 Swap the src below for your actual song file -->
        <audio id="bgAudio" loop preload="none">
            <source src="audio/our-song.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.9.9/Tone.js"></script>
    <script>
        (function() {
            /* ---- utils ---- */
            var REDUCED_MOTION = !!(window.matchMedia && window.matchMedia(
                '(prefers-reduced-motion: reduce)').matches);
            var COLORS = ['#ff87c2', '#ffb4d8', '#aef0dc', '#cbaeff', '#ffe3cf', '#fff2bf', '#ffffff'];

            function rand(a, b) { return Math.random() * (b - a) + a; }

            function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

            /* ---- canvas particle drawing ---- */
            function drawHeartPath(ctx, s) {
                ctx.beginPath();
                ctx.moveTo(0, s * 0.35);
                ctx.bezierCurveTo(-s * 0.1, s * 0.05, -s * 0.5, s * 0.05, -s * 0.5, -s * 0.25);
                ctx.bezierCurveTo(-s * 0.5, -s * 0.55, -s * 0.15, -s * 0.6, 0, -s * 0.3);
                ctx.bezierCurveTo(s * 0.15, -s * 0.6, s * 0.5, -s * 0.55, s * 0.5, -s * 0.25);
                ctx.bezierCurveTo(s * 0.5, s * 0.05, s * 0.1, s * 0.05, 0, s * 0.35);
                ctx.closePath();
            }

            function drawStarPath(ctx, s) {
                var spikes = 5,
                    outerR = s / 2,
                    innerR = outerR * 0.42,
                    rot = -Math.PI / 2,
                    step = Math.PI / spikes;
                ctx.beginPath();
                ctx.moveTo(0, -outerR);
                for (var i = 0; i < spikes; i++) {
                    rot += step;
                    ctx.lineTo(Math.cos(rot) * innerR, Math.sin(rot) * innerR);
                    rot += step;
                    ctx.lineTo(Math.cos(rot) * outerR, Math.sin(rot) * outerR);
                }
                ctx.closePath();
            }

            function drawParticle(ctx, p) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, Math.min(1, p.life)) * (p.fade !== undefined ? p.fade : 1);
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.fillStyle = p.color;
                if (p.kind === 'confetti') {
                    ctx.fillRect(-p.size / 2, -p.size * 0.18, p.size, p.size * 0.36);
                } else if (p.kind === 'heart') {
                    drawHeartPath(ctx, p.size);
                    ctx.fill();
                } else if (p.kind === 'star') {
                    var tw = 0.55 + 0.45 * Math.sin(p.twinklePhase || 0);
                    ctx.globalAlpha *= tw;
                    drawStarPath(ctx, p.size);
                    ctx.fill();
                } else if (p.kind === 'ribbon') {
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = p.size * 0.22;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(-p.size * 0.6, 0);
                    ctx.quadraticCurveTo(0, -p.size * 0.55, p.size * 0.6, 0);
                    ctx.stroke();
                } else if (p.kind === 'dot') {
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size / 2, 0, 6.2832);
                    ctx.fill();
                }
                ctx.restore();
            }

            function makeField(canvas, opts) {
                var ctx = canvas.getContext('2d');
                var dpr = Math.max(1, window.devicePixelRatio || 1);
                var fadeMul = (opts && opts.fade) || 1;
                var W = 0,
                    H = 0,
                    particles = [],
                    running = false,
                    rafId = null,
                    lastT = null;

                function resize() {
                    var r = canvas.getBoundingClientRect();
                    W = r.width;
                    H = r.height;
                    canvas.width = Math.max(1, Math.round(W * dpr));
                    canvas.height = Math.max(1, Math.round(H * dpr));
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                }
                resize();

                function spawnAmbient(kind) {
                    var p = {
                        kind: kind,
                        color: pick(COLORS),
                        rot: rand(0, 6.28),
                        rotSpeed: rand(-2, 2),
                        wobble: rand(6, 16),
                        wobbleSpeed: rand(0.8, 2.2),
                        wobblePhase: rand(0, 6.28),
                        life: 1,
                        decay: 0,
                        fade: fadeMul
                    };
                    if (kind === 'confetti') {
                        p.size = rand(7, 14);
                        p.x = rand(0, W);
                        p.y = rand(-H * 0.4, 0);
                        p.vx = rand(-10, 10);
                        p.vy = rand(28, 50);
                        p.gravity = rand(14, 22);
                        p.drag = 0.35;
                    } else if (kind === 'heart') {
                        p.size = rand(10, 17);
                        p.x = rand(0, W);
                        p.y = H + rand(0, H * 0.3);
                        p.vx = rand(-6, 6);
                        p.vy = -rand(16, 26);
                        p.gravity = -rand(1, 4);
                        p.drag = 0.2;
                    } else if (kind === 'star') {
                        p.size = rand(6, 11);
                        p.x = rand(0, W);
                        p.y = rand(0, H);
                        p.vx = 0;
                        p.vy = 0;
                        p.gravity = 0;
                        p.drag = 0;
                        p.twinklePhase = rand(0, 6.28);
                        p.twinkleSpeed = rand(1.2, 2.4);
                    } else if (kind === 'ribbon') {
                        p.size = rand(20, 32);
                        p.x = rand(0, W);
                        p.y = rand(-H * 0.3, H * 0.5);
                        p.vx = rand(-4, 4);
                        p.vy = rand(6, 14);
                        p.gravity = rand(2, 6);
                        p.drag = 0.3;
                    }
                    return p;
                }

                function seedAmbient(kinds, countEach) {
                    particles = [];
                    kinds.forEach(function(k) { for (var i = 0; i < countEach; i++) particles.push(
                            spawnAmbient(k)); });
                }

                function update(p, dt) {
                    p.vy += p.gravity * dt;
                    if (p.drag) { p.vx -= p.vx * p.drag * dt;
                        p.vy -= (p.vy * p.drag * 0.3) * dt; }
                    var wob = p.wobble ? Math.sin((p.wobblePhase || 0) + performance.now() * 0.001 * (p
                        .wobbleSpeed || 1)) * p.wobble * dt : 0;
                    p.x += (p.vx || 0) * dt + wob;
                    p.y += (p.vy || 0) * dt;
                    p.rot += (p.rotSpeed || 0) * dt;
                    if (p.kind === 'star') p.twinklePhase = (p.twinklePhase || 0) + (p.twinkleSpeed || 1.5) *
                        dt;
                    if (p.decay) p.life -= p.decay * dt;
                }

                function loop(t) {
                    if (!running) return;
                    if (lastT === null) lastT = t;
                    var dt = Math.min(0.05, (t - lastT) / 1000);
                    lastT = t;
                    ctx.clearRect(0, 0, W, H);
                    for (var i = particles.length - 1; i >= 0; i--) {
                        var p = particles[i];
                        update(p, dt);
                        if (p.decay && p.life <= 0) { particles.splice(i, 1); continue; }
                        var offBottom = p.y > H + 40 && (p.vy || 0) > 0;
                        var offTop = p.y < -40 && (p.vy || 0) < 0;
                        if (!p.decay && (offBottom || offTop)) { particles[i] = spawnAmbient(p.kind); continue; }
                        drawParticle(ctx, p);
                    }
                    rafId = requestAnimationFrame(loop);
                }
                return {
                    start: function() {
                        if (running) return;
                        running = true;
                        lastT = null;
                        rafId = requestAnimationFrame(loop);
                    },
                    stop: function() {
                        running = false;
                        if (rafId) cancelAnimationFrame(rafId);
                        ctx.clearRect(0, 0, W, H);
                    },
                    seedAmbient: seedAmbient,
                    resize: resize,
                    getDimensions: function() { return { W: W, H: H }; }
                };
            }

            /* ---- DOM refs ---- */
            var stage = document.getElementById('stage');
            var ambientCanvas = document.getElementById('ambientCanvas');

            /* ---- ambient field ---- */
            var ambientField = makeField(ambientCanvas, { fade: 0.28 });

            if (!REDUCED_MOTION) {
                ambientField.seedAmbient(['star', 'dot'], 6);
                ambientField.start();
            }

            /* ---- audio chime (tiny sonic accent, reused site-wide) ---- */
            var chimeSynth = null;
            var muted = false;

            function initAudio() {
                if (!window.Tone) return Promise.resolve();
                return Tone.start().then(function() {
                    if (Tone.context.state !== 'running') return Tone.context.resume();
                }).then(function() {
                    if (!chimeSynth) {
                        chimeSynth = new Tone.Synth({ oscillator: { type: 'sine' },
                            envelope: { attack: 0.005, decay: 0.25, sustain: 0, release: 0.25 } })
                            .toDestination();
                        chimeSynth.volume.value = -14;
                    }
                }).catch(function() {});
            }

            function playChime() {
                if (muted || !chimeSynth) return;
                try {
                    chimeSynth.triggerAttackRelease('C6', '16n');
                    setTimeout(function() { try { chimeSynth.triggerAttackRelease('E6', '16n'); } catch (
                        e) {} }, 100);
                } catch (e) {}
            }

            document.getElementById('muteBtn').addEventListener('click', function() {
                muted = !muted;
                this.textContent = muted ? '🔇' : '🔊';
                if (chimeSynth) chimeSynth.volume.value = muted ? -100 : -14;
                if (bgAudio) bgAudio.muted = muted;
            });

            /* initialize audio on first user interaction */
            document.body.addEventListener('click', function initAudioOnce() {
                initAudio();
                document.body.removeEventListener('click', initAudioOnce);
            }, { once: true });

            /* ---- photo reveal ---- */
            var artPhoto = document.getElementById('artPhoto');
            function revealPhoto() { artPhoto.classList.add('loaded'); }
            if (artPhoto) {
                if (artPhoto.complete && artPhoto.naturalWidth) revealPhoto();
                else artPhoto.addEventListener('load', revealPhoto);
                artPhoto.addEventListener('error', revealPhoto);
            }

            /* ---- audio guide button (plays the song) ---- */
            var bgAudio = document.getElementById('bgAudio');
            var audioGuideBtn = document.getElementById('audioGuideBtn');
            var agTextEl = audioGuideBtn ? audioGuideBtn.querySelector('.ag-text') : null;
            var isPlaying = false;

            if (audioGuideBtn) {
                audioGuideBtn.addEventListener('click', function() {
                    initAudio();
                    if (!isPlaying) {
                        playChime();
                        var playPromise = bgAudio.play();
                        if (playPromise && playPromise.catch) playPromise.catch(function() {});
                        isPlaying = true;
                    } else {
                        bgAudio.pause();
                        isPlaying = false;
                    }
                    audioGuideBtn.classList.toggle('is-playing', isPlaying);
                    if (agTextEl) agTextEl.textContent = isPlaying ?
                        'Now Playing — Our Song' : 'Press Play — Audio Guide';
                });
            }

            /* ---- navigation ---- */
            function goTo(url) { window.location.href = url; }
            document.getElementById('prevBtn').addEventListener('click', function() { goTo('3.html'); });
            document.getElementById('nextBtn').addEventListener('click', function() { goTo('4.html'); });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowLeft') goTo('3.html');
                if (e.key === 'ArrowRight') goTo('4.html');
            });

            /* swipe navigation */
            var touchStartX = 0,
                touchStartY = 0,
                touchActive = false;
            stage.addEventListener('touchstart', function(e) {
                if (e.touches.length !== 1) return;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchActive = true;
            }, { passive: true });
            stage.addEventListener('touchend', function(e) {
                if (!touchActive) return;
                touchActive = false;
                var dx = e.changedTouches[0].clientX - touchStartX;
                var dy = e.changedTouches[0].clientY - touchStartY;
                if (Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy) * 1.4) {
                    if (dx < 0) goTo('4.html');
                    else goTo('3.html');
                }
            }, { passive: true });

            /* resize handler */
            window.addEventListener('resize', function() {
                ambientField.resize();
            });

        })();
    </script>
</body>
</html>
