<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>✨ New Page 4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Pacifico&family=Quicksand:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-50: #fff6fa;
            --pink-100: #ffe6f1;
            --pink-150: #ffdcec;
            --pink-200: #ffc7e3;
            --pink-300: #ffa9d4;
            --pink-400: #ff87c2;
            --pink-500: #ff66af;
            --pink-600: #f0479c;
            --pink-700: #d6318a;
            --mint-200: #d3f8ec;
            --mint-300: #aef0dc;
            --mint-400: #7fe3c4;
            --mint-600: #2f9c7c;
            --lav-200: #ede1ff;
            --lav-400: #cbaeff;
            --peach-200: #ffe3cf;
            --butter-200: #fff2bf;
            --sky-200: #d7ecff;
            --blush-300: #ffcfe1;
            --ink: #6b2f4c;
            --white: #ffffff;
            --accent-1: #7fe3c4;
            --accent-2: #cbaeff;
            --font-display: 'Luckiest Guy', cursive, sans-serif;
            --font-script: 'Pacifico', cursive, sans-serif;
            --font-body: 'Quicksand', sans-serif;
            --font-cartoon-display: 'Baloo 2', cursive, sans-serif;
            --font-cartoon-body: 'Fredoka', sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, var(--pink-50), var(--pink-100) 55%, var(--pink-200));
            font-family: var(--font-body);
            font-weight: 500;
            color: var(--ink);
            padding: 18px;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        button {
            font-family: inherit;
            touch-action: manipulation;
        }

        button:focus-visible {
            outline: 3px solid var(--pink-600);
            outline-offset: 2px;
        }

        /* ===== STAGE ===== */
        .stage {
            position: relative;
            width: min(92vw, 420px, calc((100vh - 36px) * 5 / 7));
            width: min(92vw, 420px, calc((100dvh - 36px) * 5 / 7));
            aspect-ratio: 5/7;
            border-radius: 32px;
            overflow: hidden;
            background: linear-gradient(160deg, var(--pink-50), var(--pink-200));
            box-shadow: 0 26px 60px -14px rgba(240, 71, 156, .45), 0 6px 18px rgba(240, 71, 156, .22);
            touch-action: pan-y;
        }

        @media (max-width:380px) {
            .stage {
                border-radius: 24px;
            }
        }

        .viewport {
            position: absolute;
            inset: 0;
            overflow: hidden;
            border-radius: inherit;
        }

        .ambient-canvas {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }

        .page {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 7% 8%;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            z-index: 1;
            transition: opacity .55s ease;
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 2;
        }

        .bg-pastel {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-pastel::before,
        .bg-pastel::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(20px);
            pointer-events: none;
        }

        .bg-pastel::before {
            width: 48%;
            height: 48%;
            top: -10%;
            left: -12%;
            animation: bgDriftA 10s ease-in-out infinite;
        }

        .bg-pastel::after {
            width: 40%;
            height: 40%;
            bottom: -9%;
            right: -10%;
            animation: bgDriftB 12.5s ease-in-out infinite;
        }

        .bg-pink-soft {
            background: radial-gradient(100% 100% at 50% 35%, #fff, var(--pink-150) 60%, var(--mint-200) 100%);
        }

        .bg-pink-soft::before {
            background: var(--lav-400);
            opacity: .25;
        }

        .bg-pink-soft::after {
            background: var(--peach-200);
            opacity: .35;
        }

        .content {
            position: relative;
            z-index: 2;
        }

        /* ===== PLACEHOLDER CONTENT STYLING ===== */
        .placeholder-text {
            font-family: var(--font-script);
            font-size: clamp(22px, 6vw, 28px);
            color: var(--pink-700);
            opacity: 0.8;
            animation: popIn 0.55s cubic-bezier(.34, 1.56, .64, 1) .2s forwards;
            transform: scale(.3) translateY(16px);
        }

        /* ===== CONTROLS ===== */
        .controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 3%;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .dots {
            display: flex;
            gap: 2px;
        }

        .dot {
            width: 26px;
            height: 26px;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            position: relative;
            display: inline-block;
        }

        .dot::after {
            content: '';
            position: absolute;
            inset: 9px;
            border-radius: 50%;
            background: rgba(214, 49, 138, .32);
            transition: background .2s, transform .2s;
        }

        .dot.active::after {
            background: var(--pink-600);
            transform: scale(1.15);
        }

        .control-buttons {
            display: flex;
            gap: 10px;
        }

        .control-buttons button {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, .85);
            box-shadow: 0 4px 10px rgba(240, 71, 156, .25);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, .85);
            box-shadow: 0 6px 14px rgba(240, 71, 156, .28);
            color: var(--pink-600);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 6;
        }

        .nav-arrow.prev {
            left: 3%;
        }

        .nav-arrow.next {
            right: 3%;
        }

        .nav-arrow:active {
            transform: translateY(-50%) scale(.9);
        }

        /* keyframes */
        @keyframes popIn {
            0% {
                transform: scale(.3) translateY(16px);
                opacity: 0;
            }
            65% {
                transform: scale(1.1) translateY(-3px);
                opacity: 1;
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        @keyframes bgDriftA {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(6%, 8%) scale(1.15);
            }
        }

        @keyframes bgDriftB {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(-7%, -6%) scale(1.1);
            }
        }

        @media (prefers-reduced-motion:reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="viewport">
            <canvas class="ambient-canvas" id="ambientCanvas"></canvas>

            <!-- PAGE 4 : YOUR NEW BLANK PAGE -->
            <section class="page page4 active">
                <div class="bg-pastel bg-pink-soft"></div>
                <!-- Replace everything inside this content area with your own design -->
                <div class="content placeholder-text">✨ Your content here ✨</div>
            </section>
        </div>

        <button type="button" class="nav-arrow prev" id="prevBtn" aria-label="Previous page">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <button type="button" class="nav-arrow next" id="nextBtn" aria-label="Next page">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 5 L16 12 L9 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>

        <div class="controls">
            <div class="control-buttons">
                <button type="button" id="muteBtn" aria-label="Mute or unmute music">🔊</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.9.9/Tone.js"></script>
    <script>
        (function() {
            /* ---- utils ---- */
            var REDUCED_MOTION = !!(window.matchMedia && window.matchMedia(
                '(prefers-reduced-motion: reduce)').matches);
            var COLORS = ['#ff87c2', '#ffb4d8', '#aef0dc', '#cbaeff', '#ffe3cf', '#fff2bf', '#ffffff'];

            function rand(a, b) { return Math.random() * (b - a) + a; }

            function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

            /* ---- canvas particle drawing ---- */
            function drawHeartPath(ctx, s) {
                ctx.beginPath();
                ctx.moveTo(0, s * 0.35);
                ctx.bezierCurveTo(-s * 0.1, s * 0.05, -s * 0.5, s * 0.05, -s * 0.5, -s * 0.25);
                ctx.bezierCurveTo(-s * 0.5, -s * 0.55, -s * 0.15, -s * 0.6, 0, -s * 0.3);
                ctx.bezierCurveTo(s * 0.15, -s * 0.6, s * 0.5, -s * 0.55, s * 0.5, -s * 0.25);
                ctx.bezierCurveTo(s * 0.5, s * 0.05, s * 0.1, s * 0.05, 0, s * 0.35);
                ctx.closePath();
            }

            function drawStarPath(ctx, s) {
                var spikes = 5,
                    outerR = s / 2,
                    innerR = outerR * 0.42,
                    rot = -Math.PI / 2,
                    step = Math.PI / spikes;
                ctx.beginPath();
                ctx.moveTo(0, -outerR);
                for (var i = 0; i < spikes; i++) {
                    rot += step;
                    ctx.lineTo(Math.cos(rot) * innerR, Math.sin(rot) * innerR);
                    rot += step;
                    ctx.lineTo(Math.cos(rot) * outerR, Math.sin(rot) * outerR);
                }
                ctx.closePath();
            }

            function drawParticle(ctx, p) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, Math.min(1, p.life)) * (p.fade !== undefined ? p.fade : 1);
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.fillStyle = p.color;
                if (p.kind === 'confetti') {
                    ctx.fillRect(-p.size / 2, -p.size * 0.18, p.size, p.size * 0.36);
                } else if (p.kind === 'heart') {
                    drawHeartPath(ctx, p.size);
                    ctx.fill();
                } else if (p.kind === 'star') {
                    var tw = 0.55 + 0.45 * Math.sin(p.twinklePhase || 0);
                    ctx.globalAlpha *= tw;
                    drawStarPath(ctx, p.size);
                    ctx.fill();
                } else if (p.kind === 'ribbon') {
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = p.size * 0.22;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(-p.size * 0.6, 0);
                    ctx.quadraticCurveTo(0, -p.size * 0.55, p.size * 0.6, 0);
                    ctx.stroke();
                } else if (p.kind === 'dot') {
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size / 2, 0, 6.2832);
                    ctx.fill();
                }
                ctx.restore();
            }

            function makeField(canvas, opts) {
                var ctx = canvas.getContext('2d');
                var dpr = Math.max(1, window.devicePixelRatio || 1);
                var fadeMul = (opts && opts.fade) || 1;
                var W = 0,
                    H = 0,
                    particles = [],
                    running = false,
                    rafId = null,
                    lastT = null;

                function resize() {
                    var r = canvas.getBoundingClientRect();
                    W = r.width;
                    H = r.height;
                    canvas.width = Math.max(1, Math.round(W * dpr));
                    canvas.height = Math.max(1, Math.round(H * dpr));
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                }
                resize();

                function spawnAmbient(kind) {
                    var p = {
                        kind: kind,
                        color: pick(COLORS),
                        rot: rand(0, 6.28),
                        rotSpeed: rand(-2, 2),
                        wobble: rand(6, 16),
                        wobbleSpeed: rand(0.8, 2.2),
                        wobblePhase: rand(0, 6.28),
                        life: 1,
                        decay: 0,
                        fade: fadeMul
                    };
                    if (kind === 'confetti') {
                        p.size = rand(7, 14);
                        p.x = rand(0, W);
                        p.y = rand(-H * 0.4, 0);
                        p.vx = rand(-10, 10);
                        p.vy = rand(28, 50);
                        p.gravity = rand(14, 22);
                        p.drag = 0.35;
                    } else if (kind === 'heart') {
                        p.size = rand(10, 17);
                        p.x = rand(0, W);
                        p.y = H + rand(0, H * 0.3);
                        p.vx = rand(-6, 6);
                        p.vy = -rand(16, 26);
                        p.gravity = -rand(1, 4);
                        p.drag = 0.2;
                    } else if (kind === 'star') {
                        p.size = rand(6, 11);
                        p.x = rand(0, W);
                        p.y = rand(0, H);
                        p.vx = 0;
                        p.vy = 0;
                        p.gravity = 0;
                        p.drag = 0;
                        p.twinklePhase = rand(0, 6.28);
                        p.twinkleSpeed = rand(1.2, 2.4);
                    } else if (kind === 'ribbon') {
                        p.size = rand(20, 32);
                        p.x = rand(0, W);
                        p.y = rand(-H * 0.3, H * 0.5);
                        p.vx = rand(-4, 4);
                        p.vy = rand(6, 14);
                        p.gravity = rand(2, 6);
                        p.drag = 0.3;
                    }
                    return p;
                }

                function seedAmbient(kinds, countEach) {
                    particles = [];
                    kinds.forEach(function(k) { for (var i = 0; i < countEach; i++) particles.push(
                            spawnAmbient(k)); });
                }

                function update(p, dt) {
                    p.vy += p.gravity * dt;
                    if (p.drag) { p.vx -= p.vx * p.drag * dt;
                        p.vy -= (p.vy * p.drag * 0.3) * dt; }
                    var wob = p.wobble ? Math.sin((p.wobblePhase || 0) + performance.now() * 0.001 * (p
                        .wobbleSpeed || 1)) * p.wobble * dt : 0;
                    p.x += (p.vx || 0) * dt + wob;
                    p.y += (p.vy || 0) * dt;
                    p.rot += (p.rotSpeed || 0) * dt;
                    if (p.kind === 'star') p.twinklePhase = (p.twinklePhase || 0) + (p.twinkleSpeed || 1.5) *
                        dt;
                    if (p.decay) p.life -= p.decay * dt;
                }

                function loop(t) {
                    if (!running) return;
                    if (lastT === null) lastT = t;
                    var dt = Math.min(0.05, (t - lastT) / 1000);
                    lastT = t;
                    ctx.clearRect(0, 0, W, H);
                    for (var i = particles.length - 1; i >= 0; i--) {
                        var p = particles[i];
                        update(p, dt);
                        if (p.decay && p.life <= 0) { particles.splice(i, 1); continue; }
                        var offBottom = p.y > H + 40 && (p.vy || 0) > 0;
                        var offTop = p.y < -40 && (p.vy || 0) < 0;
                        if (!p.decay && (offBottom || offTop)) { particles[i] = spawnAmbient(p.kind); continue; }
                        drawParticle(ctx, p);
                    }
                    rafId = requestAnimationFrame(loop);
                }
                return {
                    start: function() {
                        if (running) return;
                        running = true;
                        lastT = null;
                        rafId = requestAnimationFrame(loop);
                    },
                    stop: function() {
                        running = false;
                        if (rafId) cancelAnimationFrame(rafId);
                        ctx.clearRect(0, 0, W, H);
                    },
                    seedAmbient: seedAmbient,
                    resize: resize,
                    getDimensions: function() { return { W: W, H: H }; }
                };
            }

            /* ---- DOM refs ---- */
            var stage = document.getElementById('stage');
            var ambientCanvas = document.getElementById('ambientCanvas');

            /* ---- ambient field ---- */
            var ambientField = makeField(ambientCanvas, { fade: 0.28 });

            if (!REDUCED_MOTION) {
                ambientField.seedAmbient(['star', 'dot'], 6);
                ambientField.start();
            }

            /* ---- audio chime (optional, for consistency) ---- */
            var chimeSynth = null;
            var muted = false;

            function initAudio() {
                if (!window.Tone) return Promise.resolve();
                return Tone.start().then(function() {
                    if (Tone.context.state !== 'running') return Tone.context.resume();
                }).then(function() {
                    if (!chimeSynth) {
                        chimeSynth = new Tone.Synth({ oscillator: { type: 'sine' },
                            envelope: { attack: 0.005, decay: 0.25, sustain: 0, release: 0.25 } })
                            .toDestination();
                        chimeSynth.volume.value = -14;
                    }
                }).catch(function() {});
            }

            function playChime() {
                if (muted || !chimeSynth) return;
                try {
                    chimeSynth.triggerAttackRelease('C6', '16n');
                    setTimeout(function() { try { chimeSynth.triggerAttackRelease('E6', '16n'); } catch (
                        e) {} }, 100);
                } catch (e) {}
            }

            document.getElementById('muteBtn').addEventListener('click', function() {
                muted = !muted;
                this.textContent = muted ? '🔇' : '🔊';
                if (chimeSynth) chimeSynth.volume.value = muted ? -100 : -14;
            });

            /* initialize audio on first user interaction */
            document.body.addEventListener('click', function initAudioOnce() {
                initAudio();
                document.body.removeEventListener('click', initAudioOnce);
            }, { once: true });

            /* ---- navigation ---- */
            function goTo(url) { window.location.href = url; }
            document.getElementById('prevBtn').addEventListener('click', function() { goTo('3.html'); });
            document.getElementById('nextBtn').addEventListener('click', function() { goTo('4.html'); });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowLeft') goTo('3.html');
                if (e.key === 'ArrowRight') goTo('4.html');
            });

            /* swipe navigation */
            var touchStartX = 0,
                touchStartY = 0,
                touchActive = false;
            stage.addEventListener('touchstart', function(e) {
                if (e.touches.length !== 1) return;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchActive = true;
            }, { passive: true });
            stage.addEventListener('touchend', function(e) {
                if (!touchActive) return;
                touchActive = false;
                var dx = e.changedTouches[0].clientX - touchStartX;
                var dy = e.changedTouches[0].clientY - touchStartY;
                if (Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy) * 1.4) {
                    if (dx < 0) goTo('4.html');
                    else goTo('3.html');
                }
            }, { passive: true });

            /* resize handler */
            window.addEventListener('resize', function() {
                ambientField.resize();
            });

        })();
    </script>
</body>
</html>
