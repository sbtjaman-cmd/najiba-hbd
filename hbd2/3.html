<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>💌 A Letter for You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Pacifico&family=Quicksand:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink-50:#fff6fa; --pink-100:#ffe6f1; --pink-150:#ffdcec; --pink-200:#ffc7e3;
  --pink-300:#ffa9d4; --pink-400:#ff87c2; --pink-500:#ff66af; --pink-600:#f0479c; --pink-700:#d6318a;
  --mint-200:#d3f8ec; --mint-300:#aef0dc; --mint-400:#7fe3c4; --mint-600:#2f9c7c;
  --lav-200:#ede1ff; --lav-400:#cbaeff;
  --peach-200:#ffe3cf; --butter-200:#fff2bf; --sky-200:#d7ecff; --blush-300:#ffcfe1;
  --ink:#6b2f4c; --white:#ffffff;
  --accent-1:#7fe3c4; --accent-2:#cbaeff;
  --font-display:'Luckiest Guy', cursive, sans-serif;
  --font-script:'Pacifico', cursive, sans-serif;
  --font-body:'Quicksand', sans-serif;
  --font-cartoon-display:'Baloo 2', cursive, sans-serif;
  --font-cartoon-body:'Fredoka', sans-serif;
}
*,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  min-height:100vh; min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg,var(--pink-50),var(--pink-100) 55%,var(--pink-200));
  font-family:var(--font-body); font-weight:500; color:var(--ink);
  padding:18px; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button{ font-family:inherit; touch-action:manipulation; }
button:focus-visible{ outline:3px solid var(--pink-600); outline-offset:2px; }

/* ===== STAGE ===== */
.stage{
  position:relative;
  width:min(92vw, 420px, calc((100vh - 36px) * 5 / 7));
  width:min(92vw, 420px, calc((100dvh - 36px) * 5 / 7));
  aspect-ratio:5/7;
  border-radius:32px;
  overflow:hidden;
  background:linear-gradient(160deg,var(--pink-50),var(--pink-200));
  box-shadow:0 26px 60px -14px rgba(240,71,156,.45), 0 6px 18px rgba(240,71,156,.22);
  touch-action:pan-y;
}
@media (max-width:380px){ .stage{ border-radius:24px; } }
.viewport{ position:absolute; inset:0; overflow:hidden; border-radius:inherit; }
.ambient-canvas{ position:absolute; inset:0; z-index:3; pointer-events:none; }

.page{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:7% 8%; text-align:center;
  opacity:0; pointer-events:none; z-index:1;
  transition:opacity .55s ease;
}
.page.active{ opacity:1; pointer-events:auto; z-index:2; }

.bg-pastel{ position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.bg-pastel::before,.bg-pastel::after{ content:''; position:absolute; border-radius:50%; filter:blur(20px); pointer-events:none; }
.bg-pastel::before{ width:48%; height:48%; top:-10%; left:-12%; animation:bgDriftA 10s ease-in-out infinite; }
.bg-pastel::after{ width:40%; height:40%; bottom:-9%; right:-10%; animation:bgDriftB 12.5s ease-in-out infinite; }
.bg-pink-glow{ background:radial-gradient(90% 70% at 50% 28%, #fff, var(--pink-150) 60%, var(--pink-200) 100%); }
.bg-pink-glow::before{ background:var(--mint-300); opacity:.3; }
.bg-pink-glow::after{ background:var(--peach-200); opacity:.4; }

.content{ position:relative; z-index:2; }

/* ===== PAGE 3 : THE BIRTHDAY WISH ===== */
.page3-canvas{ position:absolute; inset:0; z-index:1; pointer-events:none; }
.wish-accent{ position:absolute; font-size:clamp(20px,5.6vw,26px); pointer-events:none; }
.wish-accent-a{ top:6%; left:8%; animation:quoteFloat 3.6s ease-in-out infinite; }
.wish-accent-b{ top:9%; right:9%; animation:quoteFloat 4.1s ease-in-out .5s infinite; }
.wish-card{
  position:relative; width:100%; max-width:320px; max-height:80%;
  background:linear-gradient(165deg,#fff,var(--pink-50) 130%);
  border:1px solid var(--pink-150); border-radius:22px; padding:8% 7%;
  box-shadow:0 14px 30px rgba(240,71,156,.22);
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  opacity:0; transform:translateY(14px) scale(.96);
}
.page3.active .wish-card{ animation:popIn .6s cubic-bezier(.34,1.56,.64,1) .1s forwards, cardBreathe 3.4s ease-in-out .9s infinite; }
.wish-letter{ display:flex; flex-direction:column; gap:14px; filter:blur(9px); opacity:.5; transition:filter .8s ease, opacity .8s ease; }
.wish-letter.revealed{ filter:blur(0); opacity:1; }
.wish-title{ font-family:var(--font-script); font-size:clamp(19px,5.6vw,23px); color:var(--pink-700); margin:0; text-align:center; }
.wish-body{ display:flex; flex-direction:column; gap:13px; }
.wish-paragraph{ margin:0; font-family:var(--font-body); font-weight:600; font-size:clamp(14px,3.9vw,16px); line-height:1.7; color:var(--ink); text-align:left; }
.wish-signature-wrap{ position:relative; display:inline-block; align-self:flex-end; margin-top:6px; }
.wish-signature{ font-family:var(--font-script); font-size:clamp(15px,4.2vw,18px); color:var(--pink-600); margin:0; }
.love-float{
  position:absolute; top:-14px; right:-18px;
  font-size:clamp(14px,4vw,17px);
  animation: loveFloat 2.8s ease-in-out infinite;
  pointer-events:none;
}
.wish-seal-wrap{ position:absolute; z-index:6; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:8px; opacity:0; }
.page3.active .wish-seal-wrap{ animation:popIn .55s cubic-bezier(.34,1.56,.64,1) .5s forwards; }
.wish-seal-wrap.opened{ pointer-events:none; }
.wish-seal-wrap.opened .wish-seal-hint{ opacity:0; }
.wish-seal{ position:relative; width:clamp(60px,20vw,82px); height:clamp(60px,20vw,82px); border:none; background:none; padding:0; cursor:pointer; filter:drop-shadow(0 10px 18px rgba(120,20,60,.4)); animation:sealPulse 2.4s ease-in-out infinite; }
.wish-seal::after{ content:''; position:absolute; top:16%; left:20%; width:32%; height:22%; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.6), rgba(255,255,255,0) 70%); pointer-events:none; }
.wish-seal-svg{ position:absolute; inset:0; width:100%; height:100%; display:block; transition:transform .5s cubic-bezier(.4,0,.2,1), opacity .45s ease; }
.wish-seal-half-left{ clip-path:inset(0 50% 0 0); }
.wish-seal-half-right{ clip-path:inset(0 0 0 50%); }
.wish-seal-icon{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:clamp(22px,7vw,28px); transition:opacity .35s ease .05s, transform .4s ease; }
.wish-seal.cracked{ animation:none; pointer-events:none; }
.wish-seal.cracked .wish-seal-half-left{ transform:translateX(-16px) rotate(-26deg); opacity:0; }
.wish-seal.cracked .wish-seal-half-right{ transform:translateX(16px) rotate(26deg); opacity:0; }
.wish-seal.cracked .wish-seal-icon{ opacity:0; transform:scale(.6) translateY(-4px); }
.wish-seal-hint{ margin:0; font-size:clamp(10.5px,3vw,11.5px); font-weight:700; color:var(--pink-700); background:#fff; padding:5px 12px; border-radius:999px; box-shadow:0 6px 14px rgba(240,71,156,.22); transition:opacity .4s ease; }

/* ===== CONTROLS ===== */
.controls{ position:absolute; left:0; right:0; bottom:3%; z-index:5; display:flex; flex-direction:column; align-items:center; gap:8px; }
.dots{ display:flex; gap:2px; }
.dot{ width:26px; height:26px; padding:0; border:none; background:transparent; cursor:pointer; position:relative; display:inline-block; }
.dot::after{ content:''; position:absolute; inset:9px; border-radius:50%; background:rgba(214,49,138,.32); transition:background .2s, transform .2s; }
.dot.active::after{ background:var(--pink-600); transform:scale(1.15); }
.control-buttons{ display:flex; gap:10px; }
.control-buttons button{ width:42px; height:42px; border-radius:50%; border:none; background:rgba(255,255,255,.85); box-shadow:0 4px 10px rgba(240,71,156,.25); cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; }

.nav-arrow{ position:absolute; top:50%; transform:translateY(-50%); width:40px; height:40px; border-radius:50%; border:none; background:rgba(255,255,255,.85); box-shadow:0 6px 14px rgba(240,71,156,.28); color:var(--pink-600); cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:6; }
.nav-arrow.prev{ left:3%; }
.nav-arrow.next{ right:3%; }
.nav-arrow:active{ transform:translateY(-50%) scale(.9); }

/* keyframes */
@keyframes popIn{ 0%{ transform:scale(.3) translateY(16px); opacity:0; } 65%{ transform:scale(1.1) translateY(-3px); opacity:1; } 100%{ transform:scale(1) translateY(0); opacity:1; } }
@keyframes cardBreathe{
  0%,100%{ box-shadow:0 14px 30px rgba(240,71,156,.22), 0 0 0 0 rgba(255,214,235,0); }
  50%{ box-shadow:0 16px 40px rgba(240,71,156,.36), 0 0 34px 8px rgba(255,214,235,.55); }
}
@keyframes quoteFloat{ 0%,100%{ transform:translateY(0) rotate(-3deg); } 50%{ transform:translateY(-6px) rotate(-1deg); } }
@keyframes sealPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.07); } }
@keyframes loveFloat{ 0%,100%{ transform:translateY(0) rotate(-5deg) scale(1); } 50%{ transform:translateY(-8px) rotate(5deg) scale(1.18); } }
@keyframes bgDriftA{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(6%,8%) scale(1.15); } }
@keyframes bgDriftB{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-7%,-6%) scale(1.1); } }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="viewport">
    <canvas class="ambient-canvas" id="ambientCanvas"></canvas>

    <!-- PAGE 3 : THE BIRTHDAY WISH -->
    <section class="page page3 active">
      <div class="bg-pastel bg-pink-glow"></div>
      <canvas class="page3-canvas" id="page3Canvas"></canvas>
      <span class="wish-accent wish-accent-a content" aria-hidden="true">🌸</span>
      <span class="wish-accent wish-accent-b content" aria-hidden="true">✨</span>
      <div class="wish-card content" id="wishCard">
        <div class="wish-letter" id="wishLetter">
          <p class="wish-title" id="wishTitle"></p>
          <div class="wish-body" id="wishBody"></div>
          <div class="wish-signature-wrap">
            <p class="wish-signature" id="wishSignature"></p>
            <span class="love-float" aria-hidden="true">❤️</span>
          </div>
        </div>
      </div>
      <div class="wish-seal-wrap" id="wishSealWrap">
        <button type="button" class="wish-seal" id="wishSeal" aria-label="Tap to break the seal and open the letter">
          <svg viewBox="0 0 100 100" class="wish-seal-svg wish-seal-half-left" aria-hidden="true">
            <g fill="#a8225f">
              <circle cx="50" cy="50" r="27"/><circle cx="79" cy="50" r="16"/><circle cx="70.5" cy="70.5" r="16"/>
              <circle cx="50" cy="79" r="16"/><circle cx="29.5" cy="70.5" r="16"/><circle cx="21" cy="50" r="16"/>
              <circle cx="29.5" cy="29.5" r="16"/><circle cx="50" cy="21" r="16"/><circle cx="70.5" cy="29.5" r="16"/>
            </g>
          </svg>
          <svg viewBox="0 0 100 100" class="wish-seal-svg wish-seal-half-right" aria-hidden="true">
            <g fill="#a8225f">
              <circle cx="50" cy="50" r="27"/><circle cx="79" cy="50" r="16"/><circle cx="70.5" cy="70.5" r="16"/>
              <circle cx="50" cy="79" r="16"/><circle cx="29.5" cy="70.5" r="16"/><circle cx="21" cy="50" r="16"/>
              <circle cx="29.5" cy="29.5" r="16"/><circle cx="50" cy="21" r="16"/><circle cx="70.5" cy="29.5" r="16"/>
            </g>
          </svg>
          <span class="wish-seal-icon" aria-hidden="true">💌</span>
        </button>
        <p class="wish-seal-hint">tap the seal to open</p>
      </div>
    </section>
  </div>

  <button type="button" class="nav-arrow prev" id="prevBtn" aria-label="Previous page">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button type="button" class="nav-arrow next" id="nextBtn" aria-label="Next page">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 5 L16 12 L9 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div class="controls">
    <div class="dots" id="dots">
      <a href="1.html" class="dot" aria-label="Page 1"></a>
      <a href="2.html" class="dot" aria-label="Page 2"></a>
      <a href="3.html" class="dot active" aria-label="Page 3"></a>
      <a href="4.html" class="dot" aria-label="Page 4"></a>
      <a href="5.html" class="dot" aria-label="Page 5"></a>
      <a href="6.html" class="dot" aria-label="Page 6"></a>
      <a href="7.html" class="dot" aria-label="Page 7"></a>
    </div>
    <div class="control-buttons">
      <button type="button" id="muteBtn" aria-label="Mute or unmute music">🔊</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.9.9/Tone.js"></script>
<script>
(function(){
  /* ================================================================
     ✏️  EDIT YOUR CARD HERE
     ================================================================ */
  var CONFIG = {
    wish: {
      title: "To Someone Very Special",
      text:
        "On your birthday, my only wish is that life gives you endless reasons to smile. I hope every new day brings you happiness, peace, good health, and beautiful moments that stay with you forever. I just hope your life is filled with the same happiness and warmth that you bring into my life without even knowing.\n\n" +
        "Always remember, no matter what life brings or how difficult the days become, there will always be someone whose heart quietly wishes for your happiness above everything else. Someone who finds comfort in you, who silently prays that your days are gentle, and who hopes those mayabi eyes never lose their sparkle. Maybe one day, you'll realize who that someone is.\n\n" +
        "You truly deserve a life full of love, kindness, and everything that makes your heart happy. Happy Birthday once again, Najiba. Stay happy, stay safe, and keep smiling... because your smile means more to me than you will ever know. ❤️",
      signature: "With Love"
    }
  };

  /* ---- utils ---- */
  var REDUCED_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var COLORS = ['#ff87c2','#ffb4d8','#aef0dc','#cbaeff','#ffe3cf','#fff2bf','#ffffff'];
  function rand(a,b){ return Math.random()*(b-a)+a; }
  function pick(arr){ return arr[(Math.random()*arr.length)|0]; }

  /* ---- canvas particle drawing ---- */
  function drawHeartPath(ctx,s){
    ctx.beginPath();
    ctx.moveTo(0, s*0.35);
    ctx.bezierCurveTo(-s*0.1, s*0.05, -s*0.5, s*0.05, -s*0.5, -s*0.25);
    ctx.bezierCurveTo(-s*0.5, -s*0.55, -s*0.15, -s*0.6, 0, -s*0.3);
    ctx.bezierCurveTo(s*0.15, -s*0.6, s*0.5, -s*0.55, s*0.5, -s*0.25);
    ctx.bezierCurveTo(s*0.5, s*0.05, s*0.1, s*0.05, 0, s*0.35);
    ctx.closePath();
  }
  function drawStarPath(ctx,s){
    var spikes=5, outerR=s/2, innerR=outerR*0.42, rot=-Math.PI/2, step=Math.PI/spikes;
    ctx.beginPath();
    ctx.moveTo(0,-outerR);
    for(var i=0;i<spikes;i++){
      rot += step; ctx.lineTo(Math.cos(rot)*innerR, Math.sin(rot)*innerR);
      rot += step; ctx.lineTo(Math.cos(rot)*outerR, Math.sin(rot)*outerR);
    }
    ctx.closePath();
  }
  function drawParticle(ctx,p){
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life)) * (p.fade!==undefined ? p.fade : 1);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    if(p.kind === 'confetti'){
      ctx.fillRect(-p.size/2, -p.size*0.18, p.size, p.size*0.36);
    } else if(p.kind === 'heart'){
      drawHeartPath(ctx,p.size); ctx.fill();
    } else if(p.kind === 'star'){
      var tw = 0.55 + 0.45*Math.sin(p.twinklePhase||0);
      ctx.globalAlpha *= tw;
      drawStarPath(ctx,p.size); ctx.fill();
    } else if(p.kind === 'ribbon'){
      ctx.strokeStyle = p.color; ctx.lineWidth = p.size*0.22; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-p.size*0.6,0);
      ctx.quadraticCurveTo(0,-p.size*0.55, p.size*0.6, 0);
      ctx.stroke();
    } else if(p.kind === 'dot'){
      ctx.beginPath(); ctx.arc(0,0,p.size/2,0,6.2832); ctx.fill();
    }
    ctx.restore();
  }

  function makeField(canvas, opts){
    var ctx = canvas.getContext('2d');
    var dpr = Math.max(1, window.devicePixelRatio || 1);
    var fadeMul = (opts && opts.fade) || 1;
    var W=0, H=0, particles=[], running=false, rafId=null, lastT=null;

    function resize(){
      var r = canvas.getBoundingClientRect();
      W = r.width; H = r.height;
      canvas.width = Math.max(1, Math.round(W*dpr));
      canvas.height = Math.max(1, Math.round(H*dpr));
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    resize();

    function spawnAmbient(kind){
      var p = { kind:kind, color:pick(COLORS), rot:rand(0,6.28), rotSpeed:rand(-2,2),
        wobble:rand(6,16), wobbleSpeed:rand(0.8,2.2), wobblePhase:rand(0,6.28), life:1, decay:0, fade:fadeMul };
      if(kind==='confetti'){
        p.size=rand(7,14); p.x=rand(0,W); p.y=rand(-H*0.4,0); p.vx=rand(-10,10); p.vy=rand(28,50); p.gravity=rand(14,22); p.drag=0.35;
      } else if(kind==='heart'){
        p.size=rand(10,17); p.x=rand(0,W); p.y=H+rand(0,H*0.3); p.vx=rand(-6,6); p.vy=-rand(16,26); p.gravity=-rand(1,4); p.drag=0.2;
      } else if(kind==='star'){
        p.size=rand(6,11); p.x=rand(0,W); p.y=rand(0,H); p.vx=0; p.vy=0; p.gravity=0; p.drag=0; p.twinklePhase=rand(0,6.28); p.twinkleSpeed=rand(1.2,2.4);
      } else if(kind==='ribbon'){
        p.size=rand(20,32); p.x=rand(0,W); p.y=rand(-H*0.3,H*0.5); p.vx=rand(-4,4); p.vy=rand(6,14); p.gravity=rand(2,6); p.drag=0.3;
      }
      return p;
    }
    function seedAmbient(kinds, countEach){
      particles = [];
      kinds.forEach(function(k){ for(var i=0;i<countEach;i++) particles.push(spawnAmbient(k)); });
    }
    function burst(x,y,count){
      for(var i=0;i<count;i++){
        var isHeart = i % 4 === 0;
        var angle = rand(0,6.28), speed = rand(70,230);
        particles.push({
          kind: isHeart ? 'heart' : (i % 2 ? 'confetti' : 'dot'),
          color: pick(COLORS), size: isHeart ? rand(10,15) : rand(6,12),
          x:x, y:y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed-70,
          gravity:170, drag:0.4, rot:rand(0,6.28), rotSpeed:rand(-7,7),
          wobble:0, wobbleSpeed:0, wobblePhase:0, life:1, decay:rand(0.5,0.85), fade:1
        });
      }
    }
    function update(p,dt){
      p.vy += p.gravity*dt;
      if(p.drag){ p.vx -= p.vx*p.drag*dt; p.vy -= (p.vy*p.drag*0.3)*dt; }
      var wob = p.wobble ? Math.sin((p.wobblePhase||0)+performance.now()*0.001*(p.wobbleSpeed||1))*p.wobble*dt : 0;
      p.x += (p.vx||0)*dt + wob;
      p.y += (p.vy||0)*dt;
      p.rot += (p.rotSpeed||0)*dt;
      if(p.kind==='star') p.twinklePhase = (p.twinklePhase||0) + (p.twinkleSpeed||1.5)*dt;
      if(p.decay) p.life -= p.decay*dt;
    }
    function loop(t){
      if(!running) return;
      if(lastT===null) lastT=t;
      var dt = Math.min(0.05,(t-lastT)/1000);
      lastT = t;
      ctx.clearRect(0,0,W,H);
      for(var i=particles.length-1;i>=0;i--){
        var p = particles[i];
        update(p,dt);
        if(p.decay && p.life<=0){ particles.splice(i,1); continue; }
        var offBottom = p.y > H+40 && (p.vy||0) > 0;
        var offTop = p.y < -40 && (p.vy||0) < 0;
        if(!p.decay && (offBottom||offTop)){ particles[i] = spawnAmbient(p.kind); continue; }
        drawParticle(ctx,p);
      }
      rafId = requestAnimationFrame(loop);
    }
    return {
      start: function(){ if(running) return; running=true; lastT=null; rafId=requestAnimationFrame(loop); },
      stop: function(){ running=false; if(rafId) cancelAnimationFrame(rafId); ctx.clearRect(0,0,W,H); },
      seedAmbient: seedAmbient,
      burst: burst,
      resize: resize,
      getDimensions: function(){ return {W:W, H:H}; }
    };
  }

  /* ---- DOM refs ---- */
  var stage = document.getElementById('stage');
  var ambientCanvas = document.getElementById('ambientCanvas');
  var page3Canvas = document.getElementById('page3Canvas');

  /* ---- ambient & page3 fields ---- */
  var ambientField = makeField(ambientCanvas, { fade:0.28 });
  var page3Field = makeField(page3Canvas);
  var page3Seeded = false;

  if(!REDUCED_MOTION){
    ambientField.seedAmbient(['star','dot'], 6);
    ambientField.start();
    page3Field.seedAmbient(['heart','star','ribbon'], 3);
    page3Field.start();
    page3Seeded = true;
  }

  /* ---- build wish content ---- */
  function buildWishPage(){
    var titleEl = document.getElementById('wishTitle');
    var bodyEl = document.getElementById('wishBody');
    var sigEl = document.getElementById('wishSignature');
    if(titleEl) titleEl.textContent = CONFIG.wish.title;
    if(bodyEl){
      bodyEl.innerHTML = '';
      CONFIG.wish.text.split(/\n\s*\n/).forEach(function(para){
        para = para.trim();
        if(!para) return;
        var p = document.createElement('p');
        p.className = 'wish-paragraph';
        p.textContent = para;
        bodyEl.appendChild(p);
      });
    }
    if(sigEl) sigEl.textContent = CONFIG.wish.signature;
  }
  buildWishPage();

  /* ---- crack the wax seal ---- */
  var wishSealEl = document.getElementById('wishSeal');
  var wishSealWrapEl = document.getElementById('wishSealWrap');
  var wishLetterEl = document.getElementById('wishLetter');

  if(wishSealEl){
    wishSealEl.addEventListener('click', function(){
      if(wishSealEl.classList.contains('cracked')) return;
      wishSealEl.classList.add('cracked');
      if(wishSealWrapEl) wishSealWrapEl.classList.add('opened');
      if(wishLetterEl) wishLetterEl.classList.add('revealed');
      var r = page3Canvas.getBoundingClientRect();
      var br = wishSealEl.getBoundingClientRect();
      page3Field.burst(br.left + br.width/2 - r.left, br.top + br.height/2 - r.top, 22);
      playChime();
    });
  }

  /* ---- audio chime ---- */
  var chimeSynth = null;
  var muted = false;
  function initAudio(){
    if(!window.Tone) return Promise.resolve();
    return Tone.start().then(function(){
      if(Tone.context.state !== 'running') return Tone.context.resume();
    }).then(function(){
      if(!chimeSynth){
        chimeSynth = new Tone.Synth({ oscillator:{type:'sine'}, envelope:{attack:0.005,decay:0.25,sustain:0,release:0.25} }).toDestination();
        chimeSynth.volume.value = -14;
      }
    }).catch(function(){});
  }
  function playChime(){
    if(muted || !chimeSynth) return;
    try{
      chimeSynth.triggerAttackRelease('C6','16n');
      setTimeout(function(){ try{ chimeSynth.triggerAttackRelease('E6','16n'); }catch(e){} }, 100);
    }catch(e){}
  }

  document.getElementById('muteBtn').addEventListener('click', function(){
    muted = !muted;
    this.textContent = muted ? '🔇' : '🔊';
    if(chimeSynth) chimeSynth.volume.value = muted ? -100 : -14;
  });

  /* initialize audio on first user interaction */
  document.body.addEventListener('click', function initAudioOnce(){
    initAudio();
    document.body.removeEventListener('click', initAudioOnce);
  }, { once: true });

  /* ---- navigation ---- */
  function goTo(url){ window.location.href = url; }
  document.getElementById('prevBtn').addEventListener('click', function(){ goTo('2.html'); });
  document.getElementById('nextBtn').addEventListener('click', function(){ goTo('4.html'); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowLeft') goTo('2.html');
    if(e.key === 'ArrowRight') goTo('4.html');
  });

  /* swipe navigation */
  var touchStartX=0, touchStartY=0, touchActive=false;
  stage.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchActive = true;
  }, { passive:true });
  stage.addEventListener('touchend', function(e){
    if(!touchActive) return;
    touchActive = false;
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy) * 1.4){
      if(dx < 0) goTo('4.html'); else goTo('2.html');
    }
  }, { passive:true });

  /* resize handler */
  window.addEventListener('resize', function(){
    ambientField.resize();
    page3Field.resize();
  });

})();
</script>
</body>
</html>
