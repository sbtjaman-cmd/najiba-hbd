<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🌙 Prettier than any moonlit night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Pacifico&family=Quicksand:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink-50:#fff6fa; --pink-100:#ffe6f1; --pink-150:#ffdcec; --pink-200:#ffc7e3;
  --pink-300:#ffa9d4; --pink-400:#ff87c2; --pink-500:#ff66af; --pink-600:#f0479c; --pink-700:#d6318a;
  --mint-200:#d3f8ec; --mint-300:#aef0dc; --mint-400:#7fe3c4; --mint-600:#2f9c7c;
  --lav-200:#ede1ff; --lav-400:#cbaeff;
  --peach-200:#ffe3cf; --butter-200:#fff2bf; --sky-200:#d7ecff; --blush-300:#ffcfe1;
  --ink:#6b2f4c; --white:#ffffff;
  --accent-1:#7fe3c4; --accent-2:#cbaeff;
  --font-display:'Luckiest Guy', cursive, sans-serif;
  --font-script:'Pacifico', cursive, sans-serif;
  --font-body:'Quicksand', sans-serif;
  --font-cartoon-display:'Baloo 2', cursive, sans-serif;
  --font-cartoon-body:'Fredoka', sans-serif;
}
*,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  min-height:100vh; min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg,var(--pink-50),var(--pink-100) 55%,var(--pink-200));
  font-family:var(--font-body); font-weight:500; color:var(--ink);
  padding:18px; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button{ font-family:inherit; touch-action:manipulation; }
button:focus-visible{ outline:3px solid var(--pink-600); outline-offset:2px; }

/* ===== STAGE ===== */
.stage{
  position:relative;
  width:min(92vw, 420px, calc((100vh - 36px) * 5 / 7));
  width:min(92vw, 420px, calc((100dvh - 36px) * 5 / 7));
  aspect-ratio:5/7;
  border-radius:32px;
  overflow:hidden;
  background:linear-gradient(160deg,var(--pink-50),var(--pink-200));
  box-shadow:0 26px 60px -14px rgba(240,71,156,.45), 0 6px 18px rgba(240,71,156,.22);
  touch-action:pan-y;
}
@media (max-width:380px){ .stage{ border-radius:24px; } }

.viewport{ position:absolute; inset:0; overflow:hidden; border-radius:inherit; }

.ambient-canvas{ position:absolute; inset:0; z-index:3; pointer-events:none; }

.page{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:7% 8%; text-align:center;
  opacity:0; pointer-events:none; z-index:1;
  transition:opacity .55s ease, transform .55s cubic-bezier(.34,1.56,.64,1);
  backface-visibility:hidden;
  transform-style:preserve-3d;
}
.page.active{ opacity:1; pointer-events:auto; z-index:2; transform:none; }

.bg-pastel{ position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.bg-pastel::before,.bg-pastel::after{ content:''; position:absolute; border-radius:50%; filter:blur(20px); pointer-events:none; }
.bg-pastel::before{ width:48%; height:48%; top:-10%; left:-12%; animation:bgDriftA 10s ease-in-out infinite; }
.bg-pastel::after{ width:40%; height:40%; bottom:-9%; right:-10%; animation:bgDriftB 12.5s ease-in-out infinite; }
.bg-pink-soft{ background:radial-gradient(120% 100% at 50% 0%, var(--pink-100), var(--pink-200)); }
.bg-pink-soft::before{ background:var(--mint-300); opacity:.4; }
.bg-pink-soft::after{ background:var(--lav-400); opacity:.35; }

.content{ position:relative; z-index:2; }

/* ===== PAGE 1: collage (legacy grid rules kept intact, no longer used by the markup below) ===== */
.page1{ padding-top:6%; padding-bottom:24%; justify-content:flex-start; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain; -webkit-transform-style:flat; transform-style:flat; will-change:scroll-position; }
.page1-canvas{ position:absolute; inset:0; z-index:1; pointer-events:none; }
.collage-title{ font-family:var(--font-script); font-size:clamp(15px,4.6vw,19px); color:var(--pink-700); margin:0 0 3.6vw; opacity:0; }
.page1.active .collage-title{ animation:popIn .55s cubic-bezier(.34,1.56,.64,1) .05s forwards; }
.collage-grid{ display:grid; grid-template-columns:1fr 1fr; gap:3.6vw; width:100%; max-width:310px; margin:0 auto; }
.frame{
  position:relative; background:var(--white); border-radius:12px; padding:7% 7% 15%;
  box-shadow:0 10px 20px rgba(240,71,156,.28), inset 0 0 0 2px rgba(255,255,255,.95), 0 0 0 3px var(--pink-200);
  aspect-ratio:1/1; opacity:0;
}
.page1.active .frame{ animation:popIn .6s cubic-bezier(.34,1.56,.64,1) forwards; animation-delay:calc(var(--i,0) * .09s + .12s); }
.frame::before{
  content:'🎀'; position:absolute; top:calc(-11% + 3px); left:50%; z-index:2;
  font-size:clamp(20px,5.6vw,27px); line-height:1;
  transform:translateX(-50%) rotate(var(--tape, -6deg));
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.18));
}
.frame::after{
  content:'✨'; position:absolute; z-index:2; top:5%; right:5%; font-size:clamp(11px,3vw,14px);
  animation:sprinkleTwinkle 2.2s ease-in-out infinite; animation-delay:var(--sd,0s);
}
.frame-tilt{
  width:100%; height:100%; display:block;
  transform:rotate(var(--r,0deg));
  animation:frameFloat 5s ease-in-out infinite;
  animation-delay:var(--d,0s);
  transition:transform .18s ease-out;
}
.frame-tilt:active{ animation-play-state:paused; transform:rotate(0deg) scale(1.1) !important; }
.frame-media{ width:100%; height:100%; border-radius:6px; overflow:hidden; display:block; }
.frame-media img{ width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in; -webkit-user-drag:none; animation:photoBreathe 7s ease-in-out infinite; animation-delay:var(--bd,0s); transform-origin:center; }
.frame-tag{ position:absolute; left:50%; bottom:3.4%; transform:translateX(-50%); font-family:var(--font-script); font-size:clamp(8px,2.3vw,10.5px); color:var(--pink-600); white-space:nowrap; pointer-events:none; letter-spacing:.02em; z-index:2; }
.collage-caption{
  margin-top:4vw; font-family:var(--font-script); font-size:clamp(13px,3.8vw,16px); color:var(--pink-700);
  background:var(--white); padding:2vw 5vw; border-radius:999px; box-shadow:0 6px 14px rgba(240,71,156,.2);
  max-width:88%; box-sizing:border-box; text-align:center; line-height:1.35;
  opacity:0;
}
.page1.active .collage-caption{ animation:popIn .55s cubic-bezier(.34,1.56,.64,1) .78s forwards; }

.photo-placeholder{ width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; border:2px dashed var(--pink-300); border-radius:8px; background:var(--pink-50); color:var(--pink-600); font-weight:700; text-align:center; padding:7%; }
.photo-placeholder .ph-icon{ font-size:20px; }
.photo-placeholder .ph-label{ font-size:10px; line-height:1.3; }
.photo-placeholder .ph-debug{ font-size:8px; font-weight:600; opacity:.75; word-break:break-all; }

/* ===== NEW: PAGE 1 PREMIUM SCRAPBOOK ===== */
.scrapbook-content{
  position:relative; width:100%; z-index:2;
  display:flex; flex-direction:column; align-items:center;
  padding-top:9vw;
}

/* paper grain */
.paper-grain{ position:absolute; inset:0; width:100%; height:100%; z-index:1; pointer-events:none; opacity:.15; mix-blend-mode:multiply; }

/* fairy light garland */
.fairy-lights-svg{ position:absolute; top:0; left:-3%; width:106%; height:9vw; min-height:30px; max-height:42px; z-index:4; overflow:visible; pointer-events:none; opacity:0; }
.page1.active .fairy-lights-svg{ animation:fairyDropIn .8s cubic-bezier(.34,1.56,.64,1) .05s forwards; }
@keyframes fairyDropIn{ 0%{ opacity:0; transform:translateY(-9px); } 100%{ opacity:1; transform:translateY(0); } }
#fairyWire{ opacity:.85; }
.fairy-bulb{ animation:bulbFlicker 2.6s ease-in-out infinite; animation-delay:var(--fd,0s); transform-origin:center; filter:drop-shadow(0 0 2.2px rgba(255,255,255,.85)); }
@keyframes bulbFlicker{ 0%,100%{ opacity:1; } 42%{ opacity:.72; } 50%{ opacity:1; } 74%{ opacity:.86; } }

/* hand-drawn doodles */
.scrap-doodles{ position:absolute; inset:0; width:100%; height:100%; z-index:3; pointer-events:none; overflow:visible; }
.scrap-doodles .doodle{ opacity:0; transform-origin:center; }
.scrap-doodles .doodle *{ fill:none; stroke:var(--pink-400); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.page1.active .scrap-doodles .doodle{
  animation:
    doodleFadeIn .6s ease forwards calc(var(--di,0) * .14s + .9s),
    doodleWiggle 4.4s ease-in-out infinite calc(var(--di,0) * .14s + 1.6s);
}
@keyframes doodleFadeIn{ from{ opacity:0; } to{ opacity:.85; } }
@keyframes doodleWiggle{ 0%,100%{ transform:rotate(0deg) translateY(0); } 50%{ transform:rotate(5deg) translateY(-2px); } }

/* hero */
.scrap-hero-area{ position:relative; z-index:2; width:75%; max-width:280px; margin:0 auto 6vw; }
.hero-glow{ position:absolute; z-index:0; inset:-14% -10% -6%; background:radial-gradient(closest-side, rgba(255,199,227,.6), rgba(255,199,227,0) 72%); filter:blur(7px); pointer-events:none; }

/* shared mat */
.photo-mat{ position:relative; background:var(--white); box-shadow:0 12px 26px rgba(240,71,156,.3), 0 3px 9px rgba(107,47,76,.16); opacity:0; }
.page1.active .photo-mat{ animation:matPopIn .65s cubic-bezier(.34,1.56,.64,1) forwards; }
.page1.active .hero-mat{ animation-delay:.2s; }
.page1.active .scrap-support-grid .photo-mat{ animation-delay:calc(var(--i,0) * .3s + .5s); }
@keyframes matPopIn{ 0%{ opacity:0; transform:translateY(18px) scale(.9); } 65%{ opacity:1; transform:translateY(-3px) scale(1.04); } 100%{ opacity:1; transform:translateY(0) scale(1); } }

/* torn paper edge + thickness shadow */
.torn-mat{
  padding:7% 7% 13%;
  clip-path:polygon(
    0% 4%, 6% 0%, 12% 3%, 18% 0%, 24% 4%, 30% 0%, 36% 3%, 42% 0%, 48% 4%, 54% 0%, 60% 3%, 66% 0%, 72% 4%, 78% 0%, 84% 3%, 90% 0%, 96% 4%, 100% 0%,
    100% 100%,
    96% 96%, 90% 100%, 84% 97%, 78% 100%, 72% 96%, 66% 100%, 60% 97%, 54% 100%, 48% 96%, 42% 100%, 36% 97%, 30% 100%, 24% 96%, 18% 100%, 12% 97%, 6% 100%, 0% 96%
  );
}
.torn-mat::after{
  content:'';
  position:absolute; left:3%; right:3%; bottom:2%; height:11%;
  background:linear-gradient(to bottom, rgba(107,47,76,0), rgba(107,47,76,.24));
  pointer-events:none;
}

/* vintage photo-corner accents */
.mat-corner{ position:absolute; width:15px; height:15px; z-index:2; pointer-events:none; }
.mat-corner.tl{ top:6%; left:6%; background:linear-gradient(135deg, rgba(255,255,255,.95), rgba(255,255,255,.3) 55%, transparent 60%); clip-path:polygon(0 0,100% 0,0 100%); box-shadow:1px 1px 2px rgba(107,47,76,.2); }
.mat-corner.br{ bottom:6%; right:6%; background:linear-gradient(-45deg, rgba(255,255,255,.95), rgba(255,255,255,.3) 55%, transparent 60%); clip-path:polygon(100% 100%,100% 0%,0% 100%); box-shadow:-1px -1px 2px rgba(107,47,76,.2); }

/* washi tape */
.tape{ position:absolute; width:44px; height:14px; border-radius:1px; opacity:.85; box-shadow:0 2px 5px rgba(107,47,76,.18); z-index:3; pointer-events:none; }
.tape::before{ content:''; position:absolute; inset:0; background:repeating-linear-gradient(115deg, rgba(255,255,255,.4) 0 2px, transparent 2px 6px); mix-blend-mode:overlay; }

/* image slot (new photos live here) */
.photo-slot{ width:100%; height:100%; aspect-ratio:1/1; border-radius:6px; overflow:hidden; display:block; background:var(--pink-50); }
.photo-slot img{ width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in; -webkit-user-drag:none; animation:photoBreathe 7s ease-in-out infinite; animation-delay:var(--bd,0s); transform-origin:center; }

/* supporting grid */
.scrap-support-grid{ position:relative; z-index:2; display:grid; grid-template-columns:repeat(3,1fr); gap:3.6vw; width:100%; max-width:300px; margin:0 auto; }

/* idle float fallback (touch devices with no orientation signal) */
.idle-float-hero{ animation:idleFloatA 6.2s ease-in-out infinite; }
.idle-float-grid{ animation:idleFloatB 7s ease-in-out infinite; }
@keyframes idleFloatA{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(3px,-4px); } }
@keyframes idleFloatB{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-3px,4px); } }

/* ===== LIGHTBOX ===== */
.lightbox{ position:absolute; inset:0; z-index:20; background:rgba(40,10,25,.72); display:flex; align-items:center; justify-content:center; padding:9%; opacity:0; pointer-events:none; transition:opacity .25s ease; }
.lightbox.show{ opacity:1; pointer-events:auto; }
.lightbox img{ max-width:100%; max-height:100%; border-radius:16px; box-shadow:0 20px 50px rgba(0,0,0,.45); transform:scale(.92); transition:transform .25s cubic-bezier(.34,1.56,.64,1); display:block; }
.lightbox.show img{ transform:scale(1); }

/* ===== CONTROLS ===== */
.controls{ position:absolute; left:0; right:0; bottom:3%; z-index:5; display:flex; flex-direction:column; align-items:center; gap:8px; }
.dots{ display:flex; gap:2px; }
.dot{ width:26px; height:26px; padding:0; border:none; background:transparent; cursor:pointer; position:relative; }
.dot::after{ content:''; position:absolute; inset:9px; border-radius:50%; background:rgba(214,49,138,.32); transition:background .2s, transform .2s; }
.dot.active::after{ background:var(--pink-600); transform:scale(1.15); }
.control-buttons{ display:flex; gap:10px; }
.control-buttons button{ width:42px; height:42px; border-radius:50%; border:none; background:rgba(255,255,255,.85); box-shadow:0 4px 10px rgba(240,71,156,.25); cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; }

.nav-arrow{ position:absolute; top:50%; transform:translateY(-50%); width:40px; height:40px; border-radius:50%; border:none; background:rgba(255,255,255,.85); box-shadow:0 6px 14px rgba(240,71,156,.28); color:var(--pink-600); cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:6; }
.nav-arrow.prev{ left:3%; }
.nav-arrow.next{ right:3%; }
.nav-arrow:active{ transform:translateY(-50%) scale(.9); }

/* keyframes */
@keyframes popIn{ 0%{ transform:scale(.3) translateY(16px); opacity:0; } 65%{ transform:scale(1.1) translateY(-3px); opacity:1; } 100%{ transform:scale(1) translateY(0); opacity:1; } }
@keyframes frameFloat{ 0%,100%{ transform:rotate(var(--r,0deg)) translateY(0); } 50%{ transform:rotate(var(--r,0deg)) translateY(-4%); } }
@keyframes photoBreathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.055); } }
@keyframes sprinkleTwinkle{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
@keyframes bgDriftA{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(6%,8%) scale(1.15); } }
@keyframes bgDriftB{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-7%,-6%) scale(1.1); } }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="viewport">
    <canvas class="ambient-canvas" id="ambientCanvas"></canvas>

    <!-- PAGE 1 : PREMIUM SCRAPBOOK -->
    <section class="page page1 active">
      <div class="bg-pastel bg-pink-soft"></div>
      <canvas class="page1-canvas" id="page1Canvas"></canvas>

      <div class="scrapbook-content content" id="scrapbookContent">

        <svg class="paper-grain" aria-hidden="true" focusable="false">
          <filter id="paperNoiseFilter" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"></feTurbulence>
            <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.18  0 0 0 0 0.3  0 0 0 0.9 0"></feColorMatrix>
          </filter>
          <rect width="100%" height="100%" filter="url(#paperNoiseFilter)"></rect>
        </svg>

        <svg class="fairy-lights-svg" id="fairyLightsSvg" viewBox="-8 -8 316 56" preserveAspectRatio="none" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="wireGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#d6b98a"></stop>
              <stop offset="0.5" stop-color="#f3e0ae"></stop>
              <stop offset="1" stop-color="#d6b98a"></stop>
            </linearGradient>
            <radialGradient id="bulbGrad0" cx="35%" cy="30%" r="70%">
              <stop offset="0" stop-color="#fff6fa"></stop><stop offset=".45" stop-color="#ff87c2"></stop><stop offset="1" stop-color="#d6318a"></stop>
            </radialGradient>
            <radialGradient id="bulbGrad1" cx="35%" cy="30%" r="70%">
              <stop offset="0" stop-color="#f2fffa"></stop><stop offset=".45" stop-color="#7fe3c4"></stop><stop offset="1" stop-color="#2f9c7c"></stop>
            </radialGradient>
            <radialGradient id="bulbGrad2" cx="35%" cy="30%" r="70%">
              <stop offset="0" stop-color="#faf5ff"></stop><stop offset=".45" stop-color="#cbaeff"></stop><stop offset="1" stop-color="#9a6ee8"></stop>
            </radialGradient>
            <radialGradient id="bulbGrad3" cx="35%" cy="30%" r="70%">
              <stop offset="0" stop-color="#fffdf2"></stop><stop offset=".45" stop-color="#ffe07a"></stop><stop offset="1" stop-color="#e8b93a"></stop>
            </radialGradient>
            <radialGradient id="bulbGrad4" cx="35%" cy="30%" r="70%">
              <stop offset="0" stop-color="#fff9f2"></stop><stop offset=".45" stop-color="#ffb37a"></stop><stop offset="1" stop-color="#e88a3a"></stop>
            </radialGradient>
          </defs>
          <path id="fairyWire" d="M-4,10 Q40,44 96,20 Q152,-6 208,20 Q256,42 304,10" fill="none" stroke="url(#wireGrad)" stroke-width="1.3" stroke-dasharray="1 3.4" stroke-linecap="round"></path>
          <g id="fairyBulbs"></g>
        </svg>

        <svg class="scrap-doodles" id="scrapDoodles" viewBox="0 0 300 460" preserveAspectRatio="none" aria-hidden="true" focusable="false">
          <g transform="translate(26,66) rotate(-8)"><g class="doodle" style="--di:0"><path d="M0,4.2C-1.1,1.4-4.4,1.1-4.6-2.2C-4.7-4.6-2.2-5.4,0-3.1C2.2-5.4,4.7-4.6,4.6-2.2C4.4,1.1,1.1,1.4,0,4.2Z"></path></g></g>
          <g transform="translate(272,58) rotate(10)"><g class="doodle" style="--di:1"><path d="M0,-5.4L1.3,-1.8L5,-1.6L2.1,0.9L3.1,4.7L0,2.5L-3.1,4.7L-2.1,0.9L-5,-1.6L-1.3,-1.8Z"></path></g></g>
          <g transform="translate(16,236) rotate(6)"><g class="doodle" style="--di:2"><path d="M-6,3 Q0,-7 6,3 M6,3 L2,1.6 M6,3 L3.4,6.2"></path></g></g>
          <g transform="translate(284,230) rotate(-14)"><g class="doodle" style="--di:3"><g><ellipse cx="0" cy="-4.2" rx="2.6" ry="4"></ellipse><ellipse cx="4" cy="-1.3" rx="2.6" ry="4" transform="rotate(72 4 -1.3)"></ellipse><ellipse cx="2.5" cy="3.8" rx="2.6" ry="4" transform="rotate(144 2.5 3.8)"></ellipse><ellipse cx="-2.5" cy="3.8" rx="2.6" ry="4" transform="rotate(216 -2.5 3.8)"></ellipse><ellipse cx="-4" cy="-1.3" rx="2.6" ry="4" transform="rotate(288 -4 -1.3)"></ellipse><circle r="1.4"></circle></g></g></g>
          <g transform="translate(150,398) rotate(4)"><g class="doodle" style="--di:4"><path d="M0,4.2C-1.1,1.4-4.4,1.1-4.6-2.2C-4.7-4.6-2.2-5.4,0-3.1C2.2-5.4,4.7-4.6,4.6-2.2C4.4,1.1,1.1,1.4,0,4.2Z"></path></g></g>
          <g transform="translate(38,412) rotate(-10)"><g class="doodle" style="--di:5"><path d="M0,-5.4L1.3,-1.8L5,-1.6L2.1,0.9L3.1,4.7L0,2.5L-3.1,4.7L-2.1,0.9L-5,-1.6L-1.3,-1.8Z"></path></g></g>
          <g transform="translate(258,404) rotate(12)"><g class="doodle" style="--di:6"><path d="M-6,3 Q0,-7 6,3 M6,3 L2,1.6 M6,3 L3.4,6.2"></path></g></g>
        </svg>

        <p class="collage-title content">🌙 prettier than any moonlit night</p>

        <div class="scrap-hero-area" id="scrapHeroArea">
          <div class="hero-glow"></div>
          <div class="photo-mat torn-mat hero-mat" id="heroMat"></div>
        </div>

        <div class="scrap-support-grid" id="scrapSupportGrid"></div>

        <p class="collage-caption content"><span id="nameSlot">Friend</span>, you bloom brighter than every flower 🌸</p>
      </div>
    </section>
  </div>

  <button type="button" class="nav-arrow prev" id="prevBtn" aria-label="Previous page">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button type="button" class="nav-arrow next" id="nextBtn" aria-label="Next page">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 5 L16 12 L9 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div class="controls">
    <div class="control-buttons">
      <button type="button" id="muteBtn" aria-label="Mute or unmute music">🔊</button>
    </div>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-label="Photo preview, tap to close">
    <img id="lightboxImg" src="" alt="Enlarged memory photo">
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.9.9/Tone.js"></script>
<script>
(function(){
  /* ================================================================
     ✏️  EDIT YOUR CARD HERE
     ================================================================ */
  var CONFIG = {
    name: "Najiba",
    collagePhotos: [
      "images/1.jpeg",
      "images/2.jpeg",
      "images/3.jpeg",
      "images/4.jpeg",
      "images/5.jpeg",
      "images/6.jpeg"
    ],
    collageTags: ["My Rose 🌹", "My Lily 🌸", "My Daisy 🌼", "My Tulip 🌷", "My Jasmine 🌿", "My Lotus 🪷"]
  };

  /* ---- utils ---- */
  var REDUCED_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var COLORS = ['#ff87c2','#ffb4d8','#aef0dc','#cbaeff','#ffe3cf','#fff2bf','#ffffff'];
  function rand(a,b){ return Math.random()*(b-a)+a; }
  function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
  function clampNum(v,a,b){ return Math.max(a, Math.min(b, v)); }

  /* ---- canvas particle drawing ---- */
  function drawHeartPath(ctx,s){
    ctx.beginPath();
    ctx.moveTo(0, s*0.35);
    ctx.bezierCurveTo(-s*0.1, s*0.05, -s*0.5, s*0.05, -s*0.5, -s*0.25);
    ctx.bezierCurveTo(-s*0.5, -s*0.55, -s*0.15, -s*0.6, 0, -s*0.3);
    ctx.bezierCurveTo(s*0.15, -s*0.6, s*0.5, -s*0.55, s*0.5, -s*0.25);
    ctx.bezierCurveTo(s*0.5, s*0.05, s*0.1, s*0.05, 0, s*0.35);
    ctx.closePath();
  }
  function drawStarPath(ctx,s){
    var spikes=5, outerR=s/2, innerR=outerR*0.42, rot=-Math.PI/2, step=Math.PI/spikes;
    ctx.beginPath();
    ctx.moveTo(0,-outerR);
    for(var i=0;i<spikes;i++){
      rot += step; ctx.lineTo(Math.cos(rot)*innerR, Math.sin(rot)*innerR);
      rot += step; ctx.lineTo(Math.cos(rot)*outerR, Math.sin(rot)*outerR);
    }
    ctx.closePath();
  }
  function drawParticle(ctx,p){
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life)) * (p.fade!==undefined ? p.fade : 1);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    if(p.kind === 'confetti'){
      ctx.fillRect(-p.size/2, -p.size*0.18, p.size, p.size*0.36);
    } else if(p.kind === 'heart'){
      drawHeartPath(ctx,p.size); ctx.fill();
    } else if(p.kind === 'star'){
      var tw = 0.55 + 0.45*Math.sin(p.twinklePhase||0);
      ctx.globalAlpha *= tw;
      drawStarPath(ctx,p.size); ctx.fill();
    } else if(p.kind === 'dot'){
      ctx.beginPath(); ctx.arc(0,0,p.size/2,0,6.2832); ctx.fill();
    }
    ctx.restore();
  }

  function makeField(canvas, opts){
    var ctx = canvas.getContext('2d');
    var dpr = Math.max(1, window.devicePixelRatio || 1);
    var fadeMul = (opts && opts.fade) || 1;
    var W=0, H=0, particles=[], running=false, rafId=null, lastT=null;

    function resize(){
      var r = canvas.getBoundingClientRect();
      W = r.width; H = r.height;
      canvas.width = Math.max(1, Math.round(W*dpr));
      canvas.height = Math.max(1, Math.round(H*dpr));
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    resize();

    function spawnAmbient(kind){
      var p = { kind:kind, color:pick(COLORS), rot:rand(0,6.28), rotSpeed:rand(-2,2),
        wobble:rand(6,16), wobbleSpeed:rand(0.8,2.2), wobblePhase:rand(0,6.28), life:1, decay:0, fade:fadeMul };
      if(kind==='confetti'){
        p.size=rand(7,14); p.x=rand(0,W); p.y=rand(-H*0.4,0); p.vx=rand(-10,10); p.vy=rand(28,50); p.gravity=rand(14,22); p.drag=0.35;
      } else if(kind==='heart'){
        p.size=rand(10,17); p.x=rand(0,W); p.y=H+rand(0,H*0.3); p.vx=rand(-6,6); p.vy=-rand(16,26); p.gravity=-rand(1,4); p.drag=0.2;
      } else if(kind==='star'){
        p.size=rand(6,11); p.x=rand(0,W); p.y=rand(0,H); p.vx=0; p.vy=0; p.gravity=0; p.drag=0; p.twinklePhase=rand(0,6.28); p.twinkleSpeed=rand(1.2,2.4);
      } else if(kind==='ribbon'){
        p.size=rand(20,32); p.x=rand(0,W); p.y=rand(-H*0.3,H*0.5); p.vx=rand(-4,4); p.vy=rand(6,14); p.gravity=rand(2,6); p.drag=0.3;
      }
      return p;
    }
    function seedAmbient(kinds, countEach){
      particles = [];
      kinds.forEach(function(k){ for(var i=0;i<countEach;i++) particles.push(spawnAmbient(k)); });
    }
    function addAmbient(kinds, countEach){
      kinds.forEach(function(k){ for(var i=0;i<countEach;i++) particles.push(spawnAmbient(k)); });
    }
    function burst(x,y,count){
      for(var i=0;i<count;i++){
        var isHeart = i % 4 === 0;
        var angle = rand(0,6.28), speed = rand(70,230);
        particles.push({
          kind: isHeart ? 'heart' : (i % 2 ? 'confetti' : 'dot'),
          color: pick(COLORS), size: isHeart ? rand(10,15) : rand(6,12),
          x:x, y:y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed-70,
          gravity:170, drag:0.4, rot:rand(0,6.28), rotSpeed:rand(-7,7),
          wobble:0, wobbleSpeed:0, wobblePhase:0, life:1, decay:rand(0.5,0.85), fade:1
        });
      }
    }
    function sparkleBurst(x,y,count,kinds){
      kinds = (kinds && kinds.length) ? kinds : ['heart','star'];
      for(var i=0;i<count;i++){
        var kind = kinds[i % kinds.length];
        var angle = rand(-Math.PI*0.92, -Math.PI*0.08);
        var speed = rand(14,42);
        particles.push({
          kind:kind, color:pick(COLORS), size: kind==='heart' ? rand(5,8.5) : rand(4,7),
          x:x+rand(-8,8), y:y+rand(-6,6),
          vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
          gravity:-9, drag:0.5, rot:rand(-0.3,0.3), rotSpeed:rand(-1.5,1.5),
          wobble:rand(5,11), wobbleSpeed:rand(1,2.3), wobblePhase:rand(0,6.28),
          life:1, decay:rand(0.34,0.52), fade:1,
          twinklePhase:rand(0,6.28), twinkleSpeed:rand(2,3.4)
        });
      }
    }
    function update(p,dt){
      p.vy += p.gravity*dt;
      if(p.drag){ p.vx -= p.vx*p.drag*dt; p.vy -= (p.vy*p.drag*0.3)*dt; }
      var wob = p.wobble ? Math.sin((p.wobblePhase||0)+performance.now()*0.001*(p.wobbleSpeed||1))*p.wobble*dt : 0;
      p.x += (p.vx||0)*dt + wob;
      p.y += (p.vy||0)*dt;
      p.rot += (p.rotSpeed||0)*dt;
      if(p.kind==='star') p.twinklePhase = (p.twinklePhase||0) + (p.twinkleSpeed||1.5)*dt;
      if(p.decay) p.life -= p.decay*dt;
    }
    function loop(t){
      if(!running) return;
      if(lastT===null) lastT=t;
      var dt = Math.min(0.05,(t-lastT)/1000);
      lastT = t;
      ctx.clearRect(0,0,W,H);
      for(var i=particles.length-1;i>=0;i--){
        var p = particles[i];
        update(p,dt);
        if(p.decay && p.life<=0){ particles.splice(i,1); continue; }
        var offBottom = p.y > H+40 && (p.vy||0) > 0;
        var offTop = p.y < -40 && (p.vy||0) < 0;
        if(!p.decay && (offBottom||offTop)){ particles[i] = spawnAmbient(p.kind); continue; }
        drawParticle(ctx,p);
      }
      rafId = requestAnimationFrame(loop);
    }
    return {
      start: function(){ if(running) return; running=true; lastT=null; rafId=requestAnimationFrame(loop); },
      stop: function(){ running=false; if(rafId) cancelAnimationFrame(rafId); ctx.clearRect(0,0,W,H); },
      seedAmbient: seedAmbient,
      addAmbient: addAmbient,
      burst: burst,
      sparkleBurst: sparkleBurst,
      resize: resize,
      getDimensions: function(){ return {W:W, H:H}; }
    };
  }

  /* ---- DOM refs ---- */
  var stage = document.getElementById('stage');
  var ambientCanvas = document.getElementById('ambientCanvas');
  var page1Canvas = document.getElementById('page1Canvas');
  var scrapHeroArea = document.getElementById('scrapHeroArea');
  var heroMat = document.getElementById('heroMat');
  var scrapSupportGrid = document.getElementById('scrapSupportGrid');
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightboxImg');

  /* ---- ambient field ---- */
  var ambientField = makeField(ambientCanvas, { fade:0.28 });
  var page1Field = makeField(page1Canvas);
  var page1Seeded = false;

  if(!REDUCED_MOTION){
    ambientField.seedAmbient(['star','dot'], 6);
    ambientField.start();
    page1Field.seedAmbient(['heart','star'], 5);
    page1Field.start();
    page1Seeded = true;
  }

  /* ---- name ---- */
  document.getElementById('nameSlot').textContent = CONFIG.name || 'Friend';
  document.title = (CONFIG.name || 'Friend') + "'s Birthday 🎉";

  /* ---- scrapbook build ---- */
  var SUPPORT_ROTATIONS = [-6, 4, -3, 5, -4, 6];
  var SUPPORT_TILT_DELAYS = [0, .9, .4, 1.6, .7, 1.1];
  var SUPPORT_BREATHE_DELAYS = [.2, 1.4, .6, 2.0, 1.0, .3];
  var TAPE_COLORS = ['var(--pink-300)', 'var(--peach-200)', 'var(--lav-400)', 'var(--butter-200)'];
  var TAPE_SPOTS = [
    { top:'-5%', left:'14%', rot:-9 },
    { top:'-4%', left:'82%', rot:7 },
    { bottom:'-4%', left:'20%', rot:6 },
    { bottom:'-5%', left:'78%', rot:-7 }
  ];

  function placeholderTile(label, debug){
    var d = document.createElement('div');
    d.className = 'photo-placeholder';
    d.innerHTML = '<span class="ph-icon">🖼️</span><span class="ph-label">' + label + '</span>' +
      (debug ? '<span class="ph-debug">' + debug + '</span>' : '');
    return d;
  }

  function loadPhotoInto(container, src, label, onReady){
    if(!src){
      container.innerHTML = '';
      container.appendChild(placeholderTile(label));
      return;
    }
    var img = new Image();
    img.alt = label;
    img.onload = function(){
      container.innerHTML = '';
      container.appendChild(img);
      if(onReady) onReady(img);
    };
    img.onerror = function(){
      container.innerHTML = '';
      container.appendChild(placeholderTile('couldn\u2019t load photo', src));
    };
    img.src = src;
  }

  function addMatCorners(mat){
    ['tl','br'].forEach(function(pos){
      var c = document.createElement('span');
      c.className = 'mat-corner ' + pos;
      mat.appendChild(c);
    });
  }

  function addTapes(mat, count){
    var spots = TAPE_SPOTS.slice().sort(function(){ return Math.random() - 0.5; });
    var n = Math.max(2, Math.min(4, count));
    for(var i=0;i<n;i++){
      var spot = spots[i % spots.length];
      var t = document.createElement('span');
      t.className = 'tape';
      if(spot.top) t.style.top = spot.top;
      if(spot.bottom) t.style.bottom = spot.bottom;
      t.style.left = spot.left;
      t.style.background = pick(TAPE_COLORS);
      t.style.transform = 'translateX(-50%) rotate(' + (spot.rot + rand(-4,4)).toFixed(1) + 'deg)';
      mat.appendChild(t);
    }
  }

  function attachScrapLightbox(img){
    img.addEventListener('click', function(){
      var cRect = page1Canvas.getBoundingClientRect();
      var iRect = img.getBoundingClientRect();
      var cx = iRect.left + iRect.width/2 - cRect.left;
      var cy = iRect.top + iRect.height/2 - cRect.top;
      page1Field.sparkleBurst(cx, cy, 20, ['heart','star']);
      playChime();
      setTimeout(function(){ openLightbox(img.src); }, 180);
    });
  }

  function buildScrapbook(){
    var photos = (CONFIG.collagePhotos || []).slice();
    var tags = CONFIG.collageTags || [];
    var heroSrc = photos[0];
    var supportSrcs = photos.slice(1);

    /* hero */
    heroMat.innerHTML = '';
    addMatCorners(heroMat);
    addTapes(heroMat, 4);
    var heroTilt = document.createElement('div');
    heroTilt.className = 'frame-tilt';
    heroTilt.style.setProperty('--r', '-2deg');
    heroTilt.style.setProperty('--d', '0s');
    var heroSlot = document.createElement('div');
    heroSlot.className = 'photo-slot';
    heroSlot.style.setProperty('--bd', '0s');
    heroTilt.appendChild(heroSlot);
    heroMat.appendChild(heroTilt);
    if(tags[0]){
      var heroTag = document.createElement('span');
      heroTag.className = 'frame-tag';
      heroTag.textContent = tags[0];
      heroMat.appendChild(heroTag);
    }
    loadPhotoInto(heroSlot, heroSrc, 'Hero photo', function(img){
      attachScrapLightbox(img);
    });

    /* supporting grid */
    scrapSupportGrid.innerHTML = '';
    supportSrcs.forEach(function(src, i){
      var mat = document.createElement('div');
      mat.className = 'photo-mat torn-mat';
      mat.style.setProperty('--i', i);
      var tilt = document.createElement('div');
      tilt.className = 'frame-tilt';
      tilt.style.setProperty('--r', SUPPORT_ROTATIONS[i % SUPPORT_ROTATIONS.length] + 'deg');
      tilt.style.setProperty('--d', SUPPORT_TILT_DELAYS[i % SUPPORT_TILT_DELAYS.length] + 's');
      var slot = document.createElement('div');
      slot.className = 'photo-slot';
      slot.style.setProperty('--bd', SUPPORT_BREATHE_DELAYS[i % SUPPORT_BREATHE_DELAYS.length] + 's');
      tilt.appendChild(slot);
      addMatCorners(mat);
      addTapes(mat, 2 + (i % 3));
      mat.appendChild(tilt);
      if(tags[i+1]){
        var tag = document.createElement('span');
        tag.className = 'frame-tag';
        tag.textContent = tags[i+1];
        mat.appendChild(tag);
      }
      scrapSupportGrid.appendChild(mat);
      loadPhotoInto(slot, src, 'Photo ' + (i+2), function(img){
        attachScrapLightbox(img);
      });
    });
  }

  function buildFairyLights(){
    var wire = document.getElementById('fairyWire');
    var bulbsGroup = document.getElementById('fairyBulbs');
    if(!wire || !bulbsGroup || !wire.getTotalLength) return;
    bulbsGroup.innerHTML = '';
    var len = wire.getTotalLength();
    var count = 10;
    var grads = ['bulbGrad0','bulbGrad1','bulbGrad2','bulbGrad3','bulbGrad4'];
    var svgNS = 'http://www.w3.org/2000/svg';
    for(var i=0;i<count;i++){
      var t = (i+0.5)/count * len;
      var pt = wire.getPointAtLength(t);
      var g = document.createElementNS(svgNS,'g');
      g.setAttribute('class','fairy-bulb');
      g.setAttribute('transform','translate(' + pt.x.toFixed(2) + ',' + pt.y.toFixed(2) + ')');
      g.style.setProperty('--fd', rand(0,2.4).toFixed(2) + 's');
      var path = document.createElementNS(svgNS,'path');
      path.setAttribute('d','M0,-4.6C2.6,-4.6 4.3,-2.4 4.3,0.3C4.3,3.1 2.4,5.4 0,7.6C-2.4,5.4 -4.3,3.1 -4.3,0.3C-4.3,-2.4 -2.6,-4.6 0,-4.6Z');
      path.setAttribute('fill','url(#' + grads[i % grads.length] + ')');
      var hi = document.createElementNS(svgNS,'circle');
      hi.setAttribute('r','0.9'); hi.setAttribute('cy','-1.3'); hi.setAttribute('fill','#fff'); hi.setAttribute('opacity','.85');
      g.appendChild(path);
      g.appendChild(hi);
      bulbsGroup.appendChild(g);
    }
  }

  /* ---- parallax / interactive depth ---- */
  function applyParallax(dx, dy){
    var max = 5;
    var hx = clampNum(dx*max, -max, max);
    var hy = clampNum(dy*max, -max, max);
    if(scrapHeroArea) scrapHeroArea.style.transform = 'translate(' + hx.toFixed(2) + 'px,' + hy.toFixed(2) + 'px)';
    if(scrapSupportGrid) scrapSupportGrid.style.transform = 'translate(' + (-hx*0.6).toFixed(2) + 'px,' + (-hy*0.6).toFixed(2) + 'px)';
  }
  function onParallaxMouse(e){
    var rect = stage.getBoundingClientRect();
    var dx = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
    var dy = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
    applyParallax(dx, dy);
  }
  function onParallaxReset(){
    if(scrapHeroArea) scrapHeroArea.style.transform = '';
    if(scrapSupportGrid) scrapSupportGrid.style.transform = '';
  }
  function initParallax(){
    if(REDUCED_MOTION) return;
    var finePointer = !!(window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches);
    if(finePointer){
      stage.addEventListener('mousemove', onParallaxMouse);
      stage.addEventListener('mouseleave', onParallaxReset);
      return;
    }
    var gotOrientation = false;
    function onOrient(e){
      if(e.beta===null && e.gamma===null) return;
      if(!gotOrientation){
        gotOrientation = true;
        if(scrapHeroArea) scrapHeroArea.classList.remove('idle-float-hero');
        if(scrapSupportGrid) scrapSupportGrid.classList.remove('idle-float-grid');
      }
      var gx = clampNum((e.gamma||0)/24, -1, 1);
      var gy = clampNum(((e.beta||0)-45)/24, -1, 1);
      applyParallax(gx, gy);
    }
    if(window.DeviceOrientationEvent){
      window.addEventListener('deviceorientation', onOrient);
    }
    setTimeout(function(){
      if(!gotOrientation){
        if(window.DeviceOrientationEvent) window.removeEventListener('deviceorientation', onOrient);
        if(scrapHeroArea) scrapHeroArea.classList.add('idle-float-hero');
        if(scrapSupportGrid) scrapSupportGrid.classList.add('idle-float-grid');
      }
    }, 1000);
  }

  /* ---- lightbox ---- */
  function openLightbox(src){
    if(!src) return;
    lightboxImg.src = src;
    lightbox.classList.add('show');
  }
  function closeLightbox(){
    lightbox.classList.remove('show');
  }
  lightbox.addEventListener('click', closeLightbox);

  /* ---- audio chime ---- */
  var chimeSynth = null;
  var muted = false;
  function initAudio(){
    if(!window.Tone) return Promise.resolve();
    return Tone.start().then(function(){
      if(Tone.context.state !== 'running') return Tone.context.resume();
    }).then(function(){
      if(!chimeSynth){
        chimeSynth = new Tone.Synth({ oscillator:{type:'sine'}, envelope:{attack:0.005,decay:0.25,sustain:0,release:0.25} }).toDestination();
        chimeSynth.volume.value = -14;
      }
    }).catch(function(){});
  }
  function playChime(){
    if(muted || !chimeSynth) return;
    try{
      chimeSynth.triggerAttackRelease('C6','16n');
      setTimeout(function(){ try{ chimeSynth.triggerAttackRelease('E6','16n'); }catch(e){} }, 100);
    }catch(e){}
  }

  document.getElementById('muteBtn').addEventListener('click', function(){
    muted = !muted;
    this.textContent = muted ? '🔇' : '🔊';
    if(chimeSynth) chimeSynth.volume.value = muted ? -100 : -14;
  });

  /* initialize audio on first user interaction */
  document.body.addEventListener('click', function initAudioOnce(){
    initAudio();
    document.body.removeEventListener('click', initAudioOnce);
  }, { once: true });

  /* ---- navigation ---- */
  function goTo(url){ window.location.href = url; }
  document.getElementById('prevBtn').addEventListener('click', function(){ goTo('index.html'); });
  document.getElementById('nextBtn').addEventListener('click', function(){ goTo('2.html'); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowLeft') goTo('index.html');
    if(e.key === 'ArrowRight') goTo('2.html');
  });

  /* swipe navigation */
  var touchStartX=0, touchStartY=0, touchActive=false;
  stage.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchActive = true;
  }, { passive:true });
  stage.addEventListener('touchend', function(e){
    if(!touchActive) return;
    touchActive = false;
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy) * 1.4){
      if(dx < 0) goTo('2.html'); else goTo('index.html');
    }
  }, { passive:true });

  /* resize handler */
  window.addEventListener('resize', function(){
    ambientField.resize();
    page1Field.resize();
  });

  /* start */
  buildScrapbook();
  buildFairyLights();
  initParallax();
})();
</script>
</body>
</html>
