<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🌙 Prettier than any moonlit night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  /* ivory & cream paper, blush, rose ink, champagne gold — the index page's palette */
  --ivory:#fffdf8;
  --cream-50:#fbf3e7;
  --cream-100:#f6ead9;
  --blush-100:#f7e3e2;
  --blush-200:#efd1d3;
  --rose-900:#3f1826;
  --rose-800:#5c2438;
  --rose-700:#7a2f47;
  --rose-600:#93395a;
  --rose-500:#a9506e;
  --rose-300:#cf93a5;
  --rose-100:#f0dbe0;
  --gold-200:#f2e3bd;
  --gold-300:#e6cb8f;
  --gold-500:#c9a05c;
  --gold-600:#b3894a;
  --gold-700:#8f6c37;

  --ink:var(--rose-800); --white:var(--ivory);

  /* the old candy names are kept as aliases onto the new palette, so any rule that
     still asks for "pink" or "mint" resolves to the matching warm tone */
  --pink-50:var(--ivory);      --pink-100:var(--cream-50);  --pink-150:var(--cream-100);
  --pink-200:var(--blush-100); --pink-300:var(--blush-200); --pink-400:var(--rose-300);
  --pink-500:var(--rose-500);  --pink-600:var(--rose-600);  --pink-700:var(--rose-700);
  --mint-200:var(--gold-200);  --mint-300:var(--gold-300);  --mint-400:var(--gold-300); --mint-600:var(--gold-700);
  --lav-200:var(--cream-100);  --lav-400:var(--gold-500);
  --peach-200:var(--blush-200); --butter-200:var(--gold-200); --sky-200:var(--cream-100); --blush-300:var(--blush-200);
  --accent-1:var(--gold-500); --accent-2:var(--rose-300);

  --font-elegant:'Playfair Display', Georgia, serif;
  --font-body:'Quicksand', sans-serif;
  --font-script:var(--font-elegant);
  --font-display:var(--font-elegant);
  --font-cartoon-display:var(--font-elegant);
  --font-cartoon-body:var(--font-body);
  --ease-soft:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  min-height:100vh; min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg, var(--ivory), var(--cream-50) 38%, var(--blush-100) 68%, var(--cream-100));
  background-size:180% 180%;
  animation:driftGradient 32s ease-in-out infinite;
  font-family:var(--font-body); font-weight:500; color:var(--ink);
  padding:18px; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button{ font-family:inherit; touch-action:manipulation; }
button:focus-visible{ outline:2px solid var(--rose-600); outline-offset:2px; }

/* ===== STAGE ===== */
.stage{
  position:relative;
  width:min(92vw, 420px, calc((100vh - 36px) * 5 / 7));
  width:min(92vw, 420px, calc((100dvh - 36px) * 5 / 7));
  aspect-ratio:5/7;
  border-radius:26px;
  overflow:hidden;
  background:linear-gradient(165deg, var(--ivory), var(--cream-50) 42%, var(--blush-100) 78%, var(--cream-100));
  background-size:180% 180%;
  animation:stageIn .85s var(--ease-soft) both, driftGradient 32s ease-in-out infinite;
  border:1px solid rgba(201,160,92,.4);
  box-shadow:0 30px 70px -22px rgba(63,24,38,.38), 0 10px 26px -12px rgba(122,47,71,.16), inset 0 0 0 1px rgba(255,255,255,.6);
  touch-action:pan-y;
}
/* the same fine gold frame that sits inside the cover card */
.stage::after{
  content:''; position:absolute; inset:10px; z-index:7; pointer-events:none;
  border:1px solid rgba(201,160,92,.34); border-radius:17px;
}
@media (max-width:380px){ .stage{ border-radius:22px; } .stage::after{ inset:8px; border-radius:15px; } }

.viewport{ position:absolute; inset:0; overflow:hidden; border-radius:inherit; }

.ambient-canvas{ position:absolute; inset:0; z-index:3; pointer-events:none; }

.page{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:7% 8%; text-align:center;
  opacity:0; pointer-events:none; z-index:1;
  transition:opacity .55s ease, transform .55s cubic-bezier(.34,1.56,.64,1);
  backface-visibility:hidden;
  transform-style:preserve-3d;
}
.page.active{ opacity:1; pointer-events:auto; z-index:2; transform:none; }

.bg-pastel{ position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.bg-pastel::before,.bg-pastel::after{ content:''; position:absolute; border-radius:50%; filter:blur(20px); pointer-events:none; }
.bg-pastel::before{ width:48%; height:48%; top:-10%; left:-12%; animation:bgDriftA 10s ease-in-out infinite; }
.bg-pastel::after{ width:40%; height:40%; bottom:-9%; right:-10%; animation:bgDriftB 12.5s ease-in-out infinite; }
.bg-pink-soft{ background:radial-gradient(120% 100% at 50% 0%, var(--ivory), var(--cream-50) 55%, var(--blush-100)); }
.bg-pink-soft::before{ background:var(--gold-200); opacity:.3; }
.bg-pink-soft::after{ background:var(--blush-200); opacity:.3; }

.content{ position:relative; z-index:2; }

/* ===== PAGE 1: title, caption, and the shared frame-tilt/frame-tag classes reused by the scrapbook mats below ===== */
.page1{ padding-top:6%; padding-bottom:16%; justify-content:flex-start; }
.page1-canvas{ position:absolute; inset:0; z-index:1; pointer-events:none; }
.collage-title{
  font-family:var(--font-elegant); font-style:italic; font-weight:600;
  font-size:clamp(14px,4.2vw,18px); color:var(--rose-800);
  letter-spacing:.2px; line-height:1.34; max-width:86%; margin:0 auto 1.4vw;
  opacity:0; text-shadow:0 2px 12px rgba(63,24,38,.1);
}
.collage-title .title-emoji{ font-style:normal; margin-right:.42em; }
.page1.active .collage-title{ animation:popIn .55s cubic-bezier(.34,1.56,.64,1) .05s forwards; }
.title-flourish{ width:88px; height:auto; margin:0 0 3.6vw; opacity:0; }
.page1.active .title-flourish{ animation:popIn .5s cubic-bezier(.34,1.56,.64,1) .16s forwards; }
.frame-tilt{
  width:100%; height:100%; display:block;
  transform:rotate(var(--r,0deg));
  animation:frameFloat 5s ease-in-out infinite;
  animation-delay:var(--d,0s);
  transition:transform .18s ease-out;
}
.frame-tilt:active{ animation-play-state:paused; transform:rotate(0deg) scale(1.1) !important; }
.frame-tag{ position:absolute; left:50%; bottom:3.2%; transform:translateX(-50%); font-family:var(--font-elegant); font-style:italic; font-size:clamp(8px,2.3vw,10.5px); color:var(--rose-700); white-space:nowrap; pointer-events:none; letter-spacing:.02em; z-index:2; }
/* scrapbook mats: the tag is normal-flow content stacked BELOW the photo (not an absolute overlay),
   so it can never sit on top of the image. white-space:normal (not nowrap) so a longer name wraps
   instead of forcing its grid column wider than its track — that track-blowout was pushing the
   3rd photo in each row past the card edge. */
.photo-mat .frame-tag{
  position:static; transform:none; margin:0;
  font-size:clamp(9px,2.6vw,11px); white-space:normal; line-height:1.25; max-width:100%;
  color:var(--rose-700); letter-spacing:.01em;
}
.collage-caption{
  margin-top:calc(3vw - 2px); font-family:var(--font-elegant); font-style:italic; font-weight:500; font-size:clamp(13.5px,3.9vw,16.5px); color:var(--rose-800);
  max-width:88%; text-align:center; line-height:1.35;
  opacity:0;
}
.collage-caption::before, .collage-caption::after{
  content:'✦'; display:inline-block; color:var(--gold-500); font-size:.62em; vertical-align:middle;
  animation:captionTwinkle 2.6s ease-in-out infinite;
}
.collage-caption::before{ margin-right:.5em; animation-delay:.1s; }
.collage-caption::after{ margin-left:.5em; animation-delay:1.3s; }
@keyframes captionTwinkle{ 0%,100%{ opacity:.45; transform:scale(.8); } 50%{ opacity:1; transform:scale(1.15); } }
.page1.active .collage-caption{ animation:popIn .55s cubic-bezier(.34,1.56,.64,1) .78s forwards; }

.photo-placeholder{ width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; border:1.5px dashed rgba(201,160,92,.6); border-radius:8px; background:var(--cream-50); color:var(--rose-600); font-weight:700; text-align:center; padding:7%; }
.photo-placeholder .ph-icon{ font-size:20px; }
.photo-placeholder .ph-label{ font-size:10px; line-height:1.3; }
.photo-placeholder .ph-debug{ font-size:8px; font-weight:600; opacity:.75; word-break:break-all; }

/* ===== NEW: PAGE 1 PREMIUM SCRAPBOOK ===== */
/* scrapbook-scroll is the only thing that scrolls; it always fills page1's fixed box,
   so bg-pastel/page1-canvas (page1's direct children) stay full-coverage backdrops that
   never scroll out of view, no matter how tall the scrapbook content grows. */
.scrapbook-scroll{
  position:relative; z-index:2; width:100%; height:100%;
  overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain;
  -webkit-transform-style:flat; transform-style:flat; will-change:scroll-position;
}
.scrapbook-content{
  position:relative; width:100%;
  display:flex; flex-direction:column; align-items:center;
  padding-top:9vw;
}

/* soft cue that the card scrolls — fades away once the caption is actually reached
   (toggled by the same scroll listener that fires the end-of-scrapbook sparkle) */
.scroll-hint-fade{
  position:absolute; left:0; right:0; bottom:0; height:13%; min-height:34px; z-index:3;
  pointer-events:none; opacity:0;
  background:linear-gradient(to bottom, rgba(246,234,217,0), var(--cream-100) 88%);
  transition:opacity .7s ease .6s;
}
.page1.active .scroll-hint-fade{ opacity:.8; }
.scroll-hint-fade.at-end{ opacity:0 !important; transition-delay:0s; }

/* paper grain */
.paper-grain{ position:absolute; inset:0; width:100%; height:100%; z-index:1; pointer-events:none; opacity:.06; mix-blend-mode:multiply; }

/* fairy light garland */
.fairy-lights-svg{ position:absolute; top:0; left:-3%; width:106%; height:9vw; min-height:30px; max-height:42px; z-index:4; overflow:visible; pointer-events:none; opacity:0; }
.page1.active .fairy-lights-svg{ animation:fairyDropIn .8s cubic-bezier(.34,1.56,.64,1) .05s forwards; }
@keyframes fairyDropIn{ 0%{ opacity:0; transform:translateY(-9px); } 100%{ opacity:1; transform:translateY(0); } }
#fairyWire{ opacity:.85; }
.fairy-bulb{ animation:bulbFlicker 2.6s ease-in-out infinite; animation-delay:var(--fd,0s); transform-origin:center; filter:drop-shadow(0 0 2.4px rgba(242,227,189,.9)); }
@keyframes bulbFlicker{ 0%,100%{ opacity:1; } 42%{ opacity:.72; } 50%{ opacity:1; } 74%{ opacity:.86; } }

/* hand-drawn doodles */
.scrap-doodles{ position:absolute; inset:0; width:100%; height:100%; z-index:3; pointer-events:none; overflow:visible; }
.scrap-doodles .doodle{ opacity:0; transform-origin:center; }
.scrap-doodles .doodle *{ fill:none; stroke:var(--gold-500); stroke-width:1.3; stroke-linecap:round; stroke-linejoin:round; }
.page1.active .scrap-doodles .doodle{
  animation:
    doodleFadeIn .6s ease forwards calc(var(--di,0) * .14s + .9s),
    doodleWiggle 4.4s ease-in-out infinite calc(var(--di,0) * .14s + 1.6s);
}
@keyframes doodleFadeIn{ from{ opacity:0; } to{ opacity:.78; } }
@keyframes doodleWiggle{ 0%,100%{ transform:rotate(0deg) translateY(0); } 50%{ transform:rotate(5deg) translateY(-2px); } }
.scrap-doodles .tiny-star{ opacity:0; }
.page1.active .scrap-doodles .tiny-star{
  animation:
    doodleFadeIn .5s ease forwards calc(var(--tsi,0) * .2s + 1.1s),
    tinyStarTwinkle 2.4s ease-in-out infinite calc(var(--tsi,0) * .2s + 1.8s);
}
@keyframes tinyStarTwinkle{ 0%,100%{ opacity:.3; } 50%{ opacity:.85; } }

/* hero */
.scrap-hero-area{ position:relative; z-index:2; width:78%; max-width:300px; margin:0 auto 6vw; }
.scrap-hero-area::before, .scrap-hero-area::after{
  content:'✦'; position:absolute; color:var(--gold-500); pointer-events:none; z-index:3; opacity:0;
}
.scrap-hero-area::before{ top:-3%; left:-5%; font-size:15px; }
.scrap-hero-area::after{ bottom:4%; right:-4%; font-size:11px; }
.page1.active .scrap-hero-area::before{ animation:heroSparkIn .5s ease forwards .55s, captionTwinkle 2.6s ease-in-out infinite 1.1s; }
.page1.active .scrap-hero-area::after{ animation:heroSparkIn .5s ease forwards .75s, captionTwinkle 2.6s ease-in-out infinite 1.7s; }
@keyframes heroSparkIn{ from{ opacity:0; } to{ opacity:1; } }
.hero-glow{ position:absolute; z-index:0; inset:-17% -12% -8%; background:radial-gradient(closest-side, rgba(239,209,211,.75), rgba(239,209,211,0) 72%); filter:blur(9px); pointer-events:none; }
.hero-glow::after{ content:''; position:absolute; inset:-40% -30% -20%; background:radial-gradient(closest-side, rgba(201,160,92,.24), rgba(201,160,92,0) 75%); filter:blur(16px); pointer-events:none; z-index:-1; }

/* shared mat — warm cardstock tone instead of flat white; the visible shadow now lives on
   .torn-mat via filter:drop-shadow, which (unlike box-shadow) follows the torn clip-path
   silhouette instead of casting a rectangular shadow behind a jagged card. Flex column stacks
   the photo then the tag in normal document flow, so the tag can never sit on top of the photo. */
.photo-mat{ position:relative; background:linear-gradient(165deg,#fffdf8,#fbf5ec 55%,#f6ece1); opacity:0; display:flex; flex-direction:column; align-items:center; gap:1.1vw; min-width:0; }
.page1.active .photo-mat{ animation:matPopIn .65s cubic-bezier(.34,1.56,.64,1) forwards; }
.page1.active .hero-mat{ animation-delay:.2s; }
.page1.active .scrap-support-grid .photo-mat{ animation-delay:calc(var(--i,0) * .22s + .5s); }
@keyframes matPopIn{ 0%{ opacity:0; transform:translateY(18px) scale(.9); } 65%{ opacity:1; transform:translateY(-3px) scale(1.04); } 100%{ opacity:1; transform:translateY(0) scale(1); } }

/* torn paper edge + thickness shadow */
.torn-mat{
  padding:7% 7% 7.5%;
  filter:
    drop-shadow(0 2px 3px rgba(63,24,38,.26))
    drop-shadow(0 14px 24px rgba(122,47,71,.24))
    drop-shadow(0 5px 11px rgba(63,24,38,.14));
  clip-path:polygon(
    0% 4%, 6% 0%, 12% 3%, 18% 0%, 24% 4%, 30% 0%, 36% 3%, 42% 0%, 48% 4%, 54% 0%, 60% 3%, 66% 0%, 72% 4%, 78% 0%, 84% 3%, 90% 0%, 96% 4%, 100% 0%,
    100% 100%,
    96% 96%, 90% 100%, 84% 97%, 78% 100%, 72% 96%, 66% 100%, 60% 97%, 54% 100%, 48% 96%, 42% 100%, 36% 97%, 30% 100%, 24% 96%, 18% 100%, 12% 97%, 6% 100%, 0% 96%
  );
}
.torn-mat::after{
  content:'';
  position:absolute; left:3%; right:3%; bottom:1%; height:5.5%;
  background:linear-gradient(to bottom, rgba(63,24,38,0), rgba(63,24,38,.26));
  pointer-events:none;
}

/* vintage photo-corner accents */
.mat-corner{ position:absolute; width:18px; height:18px; z-index:2; pointer-events:none; }
.mat-corner.tl{ top:6%; left:6%; background:linear-gradient(135deg, rgba(255,253,248,.98) 0%, rgba(255,253,248,.85) 42%, rgba(201,160,92,.3) 60%, transparent 65%); clip-path:polygon(0 0,100% 0,0 100%); filter:drop-shadow(1px 1px 2px rgba(63,24,38,.26)); }
.mat-corner.br{ bottom:6%; right:6%; background:linear-gradient(-45deg, rgba(255,253,248,.98) 0%, rgba(255,253,248,.85) 42%, rgba(201,160,92,.3) 60%, transparent 65%); clip-path:polygon(100% 100%,100% 0%,0% 100%); filter:drop-shadow(-1px -1px 2px rgba(63,24,38,.26)); }

/* washi tape — torn short edges (clip-path), layered sheen, drop-shadow so it visibly lifts off the mat */
.tape{ position:absolute; width:46px; height:15px; opacity:.9; z-index:3; pointer-events:none;
  clip-path:polygon(0% 0%,100% 0%,97% 22%,100% 44%,96% 66%,100% 88%,98% 100%,0% 100%,3% 85%,0% 65%,4% 42%,0% 20%);
  filter:drop-shadow(0 2px 4px rgba(63,24,38,.2));
}
.tape::before{ content:''; position:absolute; inset:0; background:repeating-linear-gradient(115deg, rgba(255,255,255,.45) 0 2px, transparent 2px 6px); mix-blend-mode:overlay; }
.tape::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,255,255,.55), transparent 45%, transparent 60%, rgba(0,0,0,.07)); pointer-events:none; }

/* image slot (new photos live here) */
.photo-slot{ width:100%; height:100%; aspect-ratio:1/1; border-radius:6px; overflow:hidden; display:block; background:var(--cream-50); box-shadow:inset 0 0 0 1px rgba(63,24,38,.1); }
.photo-slot img{ width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in; -webkit-user-drag:none; animation:photoBreathe 7s ease-in-out infinite; animation-delay:var(--bd,0s); transform-origin:center; }

/* supporting grid — a plain flex column of [wire, 3-photo-row, wire, 3-photo-row]. Narrowed to
   90%/312px (was 100%/336px) so the outer photo in each row sits clear of the card edge instead
   of crowding it, matching the breathing room the hero photo already has. */
.scrap-support-grid{ position:relative; z-index:2; display:flex; flex-direction:column; width:90%; max-width:312px; margin:0 auto; }

/* each row's 3 photos live in their own small grid — minmax(0,1fr), not bare 1fr: a plain 1fr
   track has an invisible default minimum equal to its content's natural (unshrinkable) width,
   which is exactly what let a long nowrap tag push a column past the card edge before. */
.hang-photos-row{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:3.2vw; width:100%; margin-top:-12.5px; margin-bottom:calc(5vw + 12.5px); }
/* the last row has nothing after it but the caption — no wire position to preserve here,
   so its bottom margin can just be small and clean instead of matching the between-rows gap */
.hang-photos-row:last-child{ margin-bottom:1.5vw; }

/* hanging wire, sat directly above its photo row with zero gap between them (plain sibling in
   normal flow — no grid `gap` fighting a margin here). The peg is drawn long enough to visibly
   overlap into the photo row via overflow:visible, so it reads as gripping the photo rather than
   floating above it. */
.hang-wire-row{ width:100%; height:20px; position:relative; pointer-events:none; opacity:0; }
.hang-wire-row svg{ width:100%; height:100%; display:block; overflow:visible; }
.page1.active .hang-wire-row{ animation:hangWireIn .6s cubic-bezier(.34,1.56,.64,1) forwards; animation-delay:calc(var(--wi,0) * .66s + .3s); }
@keyframes hangWireIn{ 0%{ opacity:0; transform:translateY(-6px); } 100%{ opacity:1; transform:translateY(0); } }
.hang-peg{ opacity:0; transform-origin:center top; }
.page1.active .hang-wire-row .hang-peg{
  animation:
    pegPopIn .5s cubic-bezier(.34,1.56,.64,1) forwards calc(var(--wi,0) * .66s + .5s + var(--pd,0s)),
    pegSway 3.6s ease-in-out infinite calc(var(--wi,0) * .66s + 1.2s + var(--pd,0s));
}
@keyframes pegPopIn{ 0%{ opacity:0; transform:scale(.4) translateY(-4px); } 100%{ opacity:1; transform:scale(1) translateY(0); } }
@keyframes pegSway{ 0%,100%{ transform:rotate(0deg); } 50%{ transform:rotate(3deg); } }

/* idle float fallback (touch devices with no orientation signal) */
.idle-float-hero{ animation:idleFloatA 6.2s ease-in-out infinite; }
.idle-float-grid{ animation:idleFloatB 7s ease-in-out infinite; }
@keyframes idleFloatA{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(3px,-4px); } }
@keyframes idleFloatB{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-3px,4px); } }

/* ===== LIGHTBOX ===== */
.lightbox{ position:absolute; inset:0; z-index:20; background:rgba(45,18,28,.78); display:flex; align-items:center; justify-content:center; padding:9%; opacity:0; pointer-events:none; transition:opacity .25s ease; }
.lightbox::before{ content:''; position:absolute; inset:0; background:radial-gradient(closest-side, rgba(242,227,189,.2), rgba(242,227,189,0) 70%); pointer-events:none; }
.lightbox.show{ opacity:1; pointer-events:auto; }
.lightbox img{ max-width:100%; max-height:100%; border-radius:8px; border:7px solid var(--ivory); box-shadow:0 20px 50px rgba(63,24,38,.5), 0 0 0 1px rgba(201,160,92,.45); transform:scale(.92); transition:transform .25s cubic-bezier(.34,1.56,.64,1); display:block; box-sizing:border-box; }
.lightbox.show img{ transform:scale(1); }

/* ===== CONTROLS ===== */
.controls{ position:absolute; left:0; right:0; bottom:5%; z-index:8; display:flex; flex-direction:column; align-items:center; gap:8px; }
.control-buttons{ display:flex; gap:10px; }
.control-buttons button{
  width:38px; height:38px; border-radius:50%; padding:0;
  border:1px solid rgba(201,160,92,.45);
  background:rgba(255,253,248,.62);
  -webkit-backdrop-filter:blur(9px) saturate(130%); backdrop-filter:blur(9px) saturate(130%);
  box-shadow:0 8px 18px -8px rgba(63,24,38,.35), inset 0 1px 0 rgba(255,255,255,.6);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:transform .22s cubic-bezier(.3,1.2,.4,1), background .25s ease;
}
.control-buttons button svg{ width:16px; height:16px; display:block; }
.control-buttons button:active{ transform:scale(.9); }

.nav-arrow{
  position:absolute; top:50%; transform:translateY(-50%);
  width:38px; height:38px; border-radius:50%; padding:0;
  border:1px solid rgba(201,160,92,.45);
  background:rgba(255,253,248,.62);
  -webkit-backdrop-filter:blur(9px) saturate(130%); backdrop-filter:blur(9px) saturate(130%);
  box-shadow:0 8px 18px -8px rgba(63,24,38,.35), inset 0 1px 0 rgba(255,255,255,.6);
  color:var(--rose-700); cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:8;
  transition:background .25s ease;
}
.nav-arrow.prev{ left:3.5%; }
.nav-arrow.next{ right:3.5%; }
.nav-arrow:active{ transform:translateY(-50%) scale(.9); }
@media (hover:hover) and (pointer:fine){
  .nav-arrow:hover, .control-buttons button:hover{ background:rgba(255,253,248,.85); }
}

/* keyframes */
@keyframes popIn{ 0%{ transform:scale(.3) translateY(16px); opacity:0; } 65%{ transform:scale(1.1) translateY(-3px); opacity:1; } 100%{ transform:scale(1) translateY(0); opacity:1; } }
@keyframes frameFloat{ 0%,100%{ transform:rotate(var(--r,0deg)) translateY(0); } 50%{ transform:rotate(var(--r,0deg)) translateY(-4%); } }
@keyframes photoBreathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.055); } }
@keyframes stageIn{ from{ opacity:0; transform:translateY(12px) scale(.988); } to{ opacity:1; transform:translateY(0) scale(1); } }
@keyframes driftGradient{ 0%,100%{ background-position:0% 20%; } 50%{ background-position:100% 80%; } }
@keyframes bgDriftA{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(6%,8%) scale(1.15); } }
@keyframes bgDriftB{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-7%,-6%) scale(1.1); } }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.9.9/Tone.js"></script>
<script>
(function(){
  /* ================================================================
     ✏️  EDIT YOUR CARD HERE
     Background music file expected at: audio/hbd.mp3
     ================================================================ */
  var CONFIG = {
    name: "Najiba",
    collagePhotos: [
      "images/1.jpeg",
      "images/2.jpeg",
      "images/3.jpeg",
      "images/4.jpeg",
      "images/5.jpeg",
      "images/6.jpeg",
      "images/7.jpeg"
    ],
    collageTags: ["Rose 🌹", "Lily 🌸", "Daisy 🌼", "Tulip 🌷", "Jasmine 🌿", "Lotus 🪷", "Sunflower 🌻"]
  };

  /* ---- utils ---- */
  var REDUCED_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var COLORS = ['#c9a05c','#e6cb8f','#a9506e','#cf93a5','#fffdf8','#8f6c37'];
  var HEART_COLORS = ['#cf93a5','#a9506e','#efd1d3','#c9a05c'];
  function rand(a,b){ return Math.random()*(b-a)+a; }
  function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
  function clampNum(v,a,b){ return Math.max(a, Math.min(b, v)); }

  /* ---- canvas particle drawing ---- */
  function drawHeartPath(ctx,s){
    ctx.beginPath();
    ctx.moveTo(0, s*0.35);
    ctx.bezierCurveTo(-s*0.1, s*0.05, -s*0.5, s*0.05, -s*0.5, -s*0.25);
    ctx.bezierCurveTo(-s*0.5, -s*0.55, -s*0.15, -s*0.6, 0, -s*0.3);
    ctx.bezierCurveTo(s*0.15, -s*0.6, s*0.5, -s*0.55, s*0.5, -s*0.25);
    ctx.bezierCurveTo(s*0.5, s*0.05, s*0.1, s*0.05, 0, s*0.35);
    ctx.closePath();
  }
  function drawStarPath(ctx,s){
    var spikes=5, outerR=s/2, innerR=outerR*0.42, rot=-Math.PI/2, step=Math.PI/spikes;
    ctx.beginPath();
    ctx.moveTo(0,-outerR);
    for(var i=0;i<spikes;i++){
      rot += step; ctx.lineTo(Math.cos(rot)*innerR, Math.sin(rot)*innerR);
      rot += step; ctx.lineTo(Math.cos(rot)*outerR, Math.sin(rot)*outerR);
    }
    ctx.closePath();
  }
  function drawParticle(ctx,p){
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life)) * (p.fade!==undefined ? p.fade : 1);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    if(p.kind === 'confetti'){
      ctx.fillRect(-p.size/2, -p.size*0.18, p.size, p.size*0.36);
    } else if(p.kind === 'heart'){
      drawHeartPath(ctx,p.size); ctx.fill();
    } else if(p.kind === 'star'){
      var tw = 0.55 + 0.45*Math.sin(p.twinklePhase||0);
      ctx.globalAlpha *= tw;
      drawStarPath(ctx,p.size); ctx.fill();
    } else if(p.kind === 'dot'){
      ctx.beginPath(); ctx.arc(0,0,p.size/2,0,6.2832); ctx.fill();
    }
    ctx.restore();
  }

  function makeField(canvas, opts){
    var ctx = canvas.getContext('2d');
    var dpr = Math.max(1, window.devicePixelRatio || 1);
    var fadeMul = (opts && opts.fade) || 1;
    var W=0, H=0, particles=[], running=false, rafId=null, lastT=null;

    function resize(){
      var r = canvas.getBoundingClientRect();
      W = r.width; H = r.height;
      canvas.width = Math.max(1, Math.round(W*dpr));
      canvas.height = Math.max(1, Math.round(H*dpr));
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    resize();

    function spawnAmbient(kind){
      var p = { kind:kind, color:pick(kind==='heart' ? HEART_COLORS : COLORS), rot:rand(0,6.28), rotSpeed:rand(-2,2),
        wobble:rand(6,16), wobbleSpeed:rand(0.8,2.2), wobblePhase:rand(0,6.28), life:1, decay:0, fade:fadeMul };
      if(kind==='confetti'){
        p.size=rand(7,14); p.x=rand(0,W); p.y=rand(-H*0.4,0); p.vx=rand(-10,10); p.vy=rand(28,50); p.gravity=rand(14,22); p.drag=0.35;
      } else if(kind==='heart'){
        p.size=rand(10,17); p.x=rand(0,W); p.y=H+rand(0,H*0.3); p.vx=rand(-6,6); p.vy=-rand(16,26); p.gravity=-rand(1,4); p.drag=0.2;
      } else if(kind==='star'){
        p.size=rand(6,11); p.x=rand(0,W); p.y=rand(0,H); p.vx=0; p.vy=0; p.gravity=0; p.drag=0; p.twinklePhase=rand(0,6.28); p.twinkleSpeed=rand(1.2,2.4);
      } else if(kind==='ribbon'){
        p.size=rand(20,32); p.x=rand(0,W); p.y=rand(-H*0.3,H*0.5); p.vx=rand(-4,4); p.vy=rand(6,14); p.gravity=rand(2,6); p.drag=0.3;
      }
      return p;
    }
    function seedAmbient(kinds, countEach){
      particles = [];
      kinds.forEach(function(k){ for(var i=0;i<countEach;i++) particles.push(spawnAmbient(k)); });
    }
    function addAmbient(kinds, countEach){
      kinds.forEach(function(k){ for(var i=0;i<countEach;i++) particles.push(spawnAmbient(k)); });
    }
    function burst(x,y,count){
      for(var i=0;i<count;i++){
        var isHeart = i % 4 === 0;
        var angle = rand(0,6.28), speed = rand(70,230);
        particles.push({
          kind: isHeart ? 'heart' : (i % 2 ? 'confetti' : 'dot'),
          color: pick(COLORS), size: isHeart ? rand(10,15) : rand(6,12),
          x:x, y:y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed-70,
          gravity:170, drag:0.4, rot:rand(0,6.28), rotSpeed:rand(-7,7),
          wobble:0, wobbleSpeed:0, wobblePhase:0, life:1, decay:rand(0.5,0.85), fade:1
        });
      }
    }
    function sparkleBurst(x,y,count,kinds){
      kinds = (kinds && kinds.length) ? kinds : ['heart','star'];
      for(var i=0;i<count;i++){
        var kind = kinds[i % kinds.length];
        var angle = rand(-Math.PI*0.92, -Math.PI*0.08);
        var speed = rand(14,42);
        particles.push({
          kind:kind, color:pick(COLORS), size: kind==='heart' ? rand(5,8.5) : rand(4,7),
          x:x+rand(-8,8), y:y+rand(-6,6),
          vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
          gravity:-9, drag:0.5, rot:rand(-0.3,0.3), rotSpeed:rand(-1.5,1.5),
          wobble:rand(5,11), wobbleSpeed:rand(1,2.3), wobblePhase:rand(0,6.28),
          life:1, decay:rand(0.34,0.52), fade:1,
          twinklePhase:rand(0,6.28), twinkleSpeed:rand(2,3.4)
        });
      }
    }
    function update(p,dt){
      p.vy += p.gravity*dt;
      if(p.drag){ p.vx -= p.vx*p.drag*dt; p.vy -= (p.vy*p.drag*0.3)*dt; }
      var wob = p.wobble ? Math.sin((p.wobblePhase||0)+performance.now()*0.001*(p.wobbleSpeed||1))*p.wobble*dt : 0;
      p.x += (p.vx||0)*dt + wob;
      p.y += (p.vy||0)*dt;
      p.rot += (p.rotSpeed||0)*dt;
      if(p.kind==='star') p.twinklePhase = (p.twinklePhase||0) + (p.twinkleSpeed||1.5)*dt;
      if(p.decay) p.life -= p.decay*dt;
    }
    function loop(t){
      if(!running) return;
      if(lastT===null) lastT=t;
      var dt = Math.min(0.05,(t-lastT)/1000);
      lastT = t;
      ctx.clearRect(0,0,W,H);
      for(var i=particles.length-1;i>=0;i--){
        var p = particles[i];
        update(p,dt);
        if(p.decay && p.life<=0){ particles.splice(i,1); continue; }
        var offBottom = p.y > H+40 && (p.vy||0) > 0;
        var offTop = p.y < -40 && (p.vy||0) < 0;
        if(!p.decay && (offBottom||offTop)){ particles[i] = spawnAmbient(p.kind); continue; }
        drawParticle(ctx,p);
      }
      rafId = requestAnimationFrame(loop);
    }
    return {
      start: function(){ if(running) return; running=true; lastT=null; rafId=requestAnimationFrame(loop); },
      stop: function(){ running=false; if(rafId) cancelAnimationFrame(rafId); ctx.clearRect(0,0,W,H); },
      seedAmbient: seedAmbient,
      addAmbient: addAmbient,
      burst: burst,
      sparkleBurst: sparkleBurst,
      resize: resize,
      getDimensions: function(){ return {W:W, H:H}; }
    };
  }

  /* ---- DOM refs ---- */
  var stage = document.getElementById('stage');
  var ambientCanvas = document.getElementById('ambientCanvas');
  var page1Canvas = document.getElementById('page1Canvas');
  var scrapHeroArea = document.getElementById('scrapHeroArea');
  var heroMat = document.getElementById('heroMat');
  var scrapSupportGrid = document.getElementById('scrapSupportGrid');
  var scrapbookScroll = document.getElementById('scrapbookScroll');
  var collageCaption = document.getElementById('collageCaption');
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightboxImg');

  /* ---- ambient field ---- */
  var ambientField = makeField(ambientCanvas, { fade:0.28 });
  var page1Field = makeField(page1Canvas);
  var page1Seeded = false;

  if(!REDUCED_MOTION){
    ambientField.seedAmbient(['star','dot'], 6);
    ambientField.start();
    page1Field.seedAmbient(['heart','star'], 5);
    page1Field.start();
    page1Seeded = true;
  }

  /* ---- name ---- */
  document.getElementById('nameSlot').textContent = CONFIG.name || 'Friend';
  document.title = (CONFIG.name || 'Friend') + "'s Birthday 🎉";

  /* ---- scrapbook build ---- */
  var SUPPORT_ROTATIONS = [-6, 4, -3, 5, -4, 6];
  var SUPPORT_TILT_DELAYS = [0, .9, .4, 1.6, .7, 1.1];
  var SUPPORT_BREATHE_DELAYS = [.2, 1.4, .6, 2.0, 1.0, .3];
  var TAPE_COLORS = ['var(--gold-200)', 'var(--cream-100)', 'var(--blush-100)', 'var(--gold-300)'];
  var TAPE_SPOTS = [
    { top:'-5%', left:'12%', rot:-9 },
    { top:'-3%', left:'37%', rot:4 },
    { top:'-4%', left:'63%', rot:-3 },
    { top:'-5%', left:'88%', rot:8 }
  ];

  function placeholderTile(label, debug){
    var d = document.createElement('div');
    d.className = 'photo-placeholder';
    d.innerHTML = '<span class="ph-icon">🖼️</span><span class="ph-label">' + label + '</span>' +
      (debug ? '<span class="ph-debug">' + debug + '</span>' : '');
    return d;
  }

  function loadPhotoInto(container, src, label, onReady){
    if(!src){
      container.innerHTML = '';
      container.appendChild(placeholderTile(label));
      return;
    }
    var img = new Image();
    img.alt = label;
    img.onload = function(){
      container.innerHTML = '';
      container.appendChild(img);
      if(onReady) onReady(img);
    };
    img.onerror = function(){
      container.innerHTML = '';
      container.appendChild(placeholderTile('couldn\u2019t load photo', src));
    };
    img.src = src;
  }

  function addMatCorners(mat){
    ['tl','br'].forEach(function(pos){
      var c = document.createElement('span');
      c.className = 'mat-corner ' + pos;
      mat.appendChild(c);
    });
  }

  function addTapes(mat, count){
    var spots = TAPE_SPOTS.slice().sort(function(){ return Math.random() - 0.5; });
    var n = Math.max(2, Math.min(4, count));
    for(var i=0;i<n;i++){
      var spot = spots[i % spots.length];
      var t = document.createElement('span');
      t.className = 'tape';
      if(spot.top) t.style.top = spot.top;
      if(spot.bottom) t.style.bottom = spot.bottom;
      t.style.left = spot.left;
      t.style.background = pick(TAPE_COLORS);
      t.style.transform = 'translateX(-50%) rotate(' + (spot.rot + rand(-4,4)).toFixed(1) + 'deg)';
      mat.appendChild(t);
    }
  }

  function attachScrapLightbox(img){
    img.addEventListener('click', function(){
      var cRect = page1Canvas.getBoundingClientRect();
      var iRect = img.getBoundingClientRect();
      var cx = iRect.left + iRect.width/2 - cRect.left;
      var cy = iRect.top + iRect.height/2 - cRect.top;
      page1Field.sparkleBurst(cx, cy, 20, ['heart','star']);
      playChime();
      setTimeout(function(){ openLightbox(img.src); }, 180);
    });
  }

  function buildScrapbook(){
    var photos = (CONFIG.collagePhotos || []).slice();
    var tags = CONFIG.collageTags || [];
    var heroSrc = photos[0];
    var supportSrcs = photos.slice(1);

    /* hero */
    heroMat.innerHTML = '';
    addMatCorners(heroMat);
    addTapes(heroMat, 4);
    var heroTilt = document.createElement('div');
    heroTilt.className = 'frame-tilt';
    heroTilt.style.setProperty('--r', '-2deg');
    heroTilt.style.setProperty('--d', '0s');
    var heroSlot = document.createElement('div');
    heroSlot.className = 'photo-slot';
    heroSlot.style.setProperty('--bd', '0s');
    heroTilt.appendChild(heroSlot);
    heroMat.appendChild(heroTilt);
    if(tags[0]){
      var heroTag = document.createElement('span');
      heroTag.className = 'frame-tag';
      heroTag.textContent = tags[0];
      heroMat.appendChild(heroTag);
    }
    loadPhotoInto(heroSlot, heroSrc, 'Hero photo', function(img){
      attachScrapLightbox(img);
    });

    /* supporting grid — 2 rows of 3, each row hanging from its own wire.
       Each row is built as [wire] then [photos-row] so the wire sits directly against
       its row in normal document flow, with nothing else able to insert a gap between them. */
    scrapSupportGrid.innerHTML = '';
    var currentPhotosRow = null;
    supportSrcs.forEach(function(src, i){
      if(i % 3 === 0){
        scrapSupportGrid.appendChild(makeHangWireRow(Math.floor(i/3)));
        currentPhotosRow = document.createElement('div');
        currentPhotosRow.className = 'hang-photos-row';
        scrapSupportGrid.appendChild(currentPhotosRow);
      }
      var mat = document.createElement('div');
      mat.className = 'photo-mat torn-mat';
      mat.style.setProperty('--i', i);
      var tilt = document.createElement('div');
      tilt.className = 'frame-tilt';
      tilt.style.setProperty('--r', SUPPORT_ROTATIONS[i % SUPPORT_ROTATIONS.length] + 'deg');
      tilt.style.setProperty('--d', SUPPORT_TILT_DELAYS[i % SUPPORT_TILT_DELAYS.length] + 's');
      var slot = document.createElement('div');
      slot.className = 'photo-slot';
      slot.style.setProperty('--bd', SUPPORT_BREATHE_DELAYS[i % SUPPORT_BREATHE_DELAYS.length] + 's');
      tilt.appendChild(slot);
      addMatCorners(mat);
      addTapes(mat, 2 + (i % 3));
      mat.appendChild(tilt);
      if(tags[i+1]){
        var tag = document.createElement('span');
        tag.className = 'frame-tag';
        tag.textContent = tags[i+1];
        mat.appendChild(tag);
      }
      currentPhotosRow.appendChild(mat);
      loadPhotoInto(slot, src, 'Photo ' + (i+2), function(img){
        attachScrapLightbox(img);
      });
    });
  }

  function makeHangWireRow(rowIndex){
    var svgNS = 'http://www.w3.org/2000/svg';
    var wrap = document.createElement('div');
    wrap.className = 'hang-wire-row';
    wrap.style.setProperty('--wi', rowIndex);

    var svg = document.createElementNS(svgNS,'svg');
    svg.setAttribute('viewBox','0 0 300 20');
    svg.setAttribute('preserveAspectRatio','none');
    svg.setAttribute('aria-hidden','true');
    svg.setAttribute('focusable','false');

    /* the wire is drawn as three layered strands (shadow beneath, coloured cord, dashed
       highlight riding the top) rather than one flat stroke — a single stroke, however
       nicely gradiented, still reads as "a line" rather than a cord with actual roundness */
    var wireShadow = document.createElementNS(svgNS,'path');
    wireShadow.setAttribute('d','M4,7.7 Q150,13.7 296,7.7');
    wireShadow.setAttribute('fill','none');
    wireShadow.setAttribute('stroke','rgba(90,62,38,.42)');
    wireShadow.setAttribute('stroke-width','2.6');
    wireShadow.setAttribute('stroke-linecap','round');
    svg.appendChild(wireShadow);

    var wire = document.createElementNS(svgNS,'path');
    wire.setAttribute('d','M4,7 Q150,13 296,7');
    wire.setAttribute('fill','none');
    wire.setAttribute('stroke','url(#wireGrad)');
    wire.setAttribute('stroke-width','2');
    wire.setAttribute('stroke-linecap','round');
    svg.appendChild(wire);

    var wireHighlight = document.createElementNS(svgNS,'path');
    wireHighlight.setAttribute('d','M4,6.4 Q150,12.4 296,6.4');
    wireHighlight.setAttribute('fill','none');
    wireHighlight.setAttribute('stroke','#f2e3bd');
    wireHighlight.setAttribute('stroke-width','.75');
    wireHighlight.setAttribute('stroke-dasharray','2.4 2.6');
    wireHighlight.setAttribute('stroke-linecap','round');
    wireHighlight.setAttribute('opacity','.85');
    svg.appendChild(wireHighlight);

    /* 3 pegs, positioned analytically along the same quadratic curve as the wire so each one
       lands above the centre of its column without needing a DOM measurement. The curve is kept
       nearly flat on purpose so all three pegs hang at close to the same depth — with the earlier,
       deeper sag the two outer pegs sat visibly higher than the centre one and only the centre
       peg actually reached the photo. Peg body is long enough to overflow past this row's own
       20px box (via overflow:visible) straight into the photo row directly beneath it, with zero
       margin gap in between — that's what makes it read as gripping the photo instead of floating. */
    var p0={x:4,y:7}, p1={x:150,y:13}, p2={x:296,y:7};
    var pegFills = ['url(#pegGradPink)','url(#pegGradMint)','url(#pegGradLav)'];
    [0.17,0.5,0.83].forEach(function(t,i){
      var mt = 1-t;
      var x = mt*mt*p0.x + 2*mt*t*p1.x + t*t*p2.x;
      var y = mt*mt*p0.y + 2*mt*t*p1.y + t*t*p2.y;
      var g = document.createElementNS(svgNS,'g');
      g.setAttribute('class','hang-peg');
      g.setAttribute('transform','translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ')');
      g.style.setProperty('--pd', (i*0.15).toFixed(2) + 's');
      var ring = document.createElementNS(svgNS,'circle');
      ring.setAttribute('cy','-1'); ring.setAttribute('r','1.7');
      ring.setAttribute('fill','none'); ring.setAttribute('stroke','rgba(63,24,38,.42)'); ring.setAttribute('stroke-width','1');
      var body = document.createElementNS(svgNS,'rect');
      body.setAttribute('x','-3.3'); body.setAttribute('y','0'); body.setAttribute('width','6.6'); body.setAttribute('height','19');
      body.setAttribute('rx','2.1'); body.setAttribute('fill', pegFills[(rowIndex+i) % pegFills.length]);
      var seam = document.createElementNS(svgNS,'line');
      seam.setAttribute('x1','-3.3'); seam.setAttribute('y1','9.4'); seam.setAttribute('x2','3.3'); seam.setAttribute('y2','9.4');
      seam.setAttribute('stroke','rgba(63,24,38,.26)'); seam.setAttribute('stroke-width','.8');
      g.appendChild(ring); g.appendChild(body); g.appendChild(seam);
      svg.appendChild(g);
    });

    wrap.appendChild(svg);
    return wrap;
  }

  function buildFairyLights(){
    var wire = document.getElementById('fairyWire');
    var bulbsGroup = document.getElementById('fairyBulbs');
    if(!wire || !bulbsGroup || !wire.getTotalLength) return;
    bulbsGroup.innerHTML = '';
    var len = wire.getTotalLength();
    var count = 10;
    var grads = ['bulbGrad0','bulbGrad1','bulbGrad2','bulbGrad3','bulbGrad4'];
    var svgNS = 'http://www.w3.org/2000/svg';
    for(var i=0;i<count;i++){
      var t = (i+0.5)/count * len;
      var pt = wire.getPointAtLength(t);
      var g = document.createElementNS(svgNS,'g');
      g.setAttribute('class','fairy-bulb');
      g.setAttribute('transform','translate(' + pt.x.toFixed(2) + ',' + pt.y.toFixed(2) + ')');
      g.style.setProperty('--fd', rand(0,2.4).toFixed(2) + 's');
      var path = document.createElementNS(svgNS,'path');
      path.setAttribute('d','M0,-4.6C2.6,-4.6 4.3,-2.4 4.3,0.3C4.3,3.1 2.4,5.4 0,7.6C-2.4,5.4 -4.3,3.1 -4.3,0.3C-4.3,-2.4 -2.6,-4.6 0,-4.6Z');
      path.setAttribute('fill','url(#' + grads[i % grads.length] + ')');
      var hi = document.createElementNS(svgNS,'circle');
      hi.setAttribute('r','0.9'); hi.setAttribute('cy','-1.3'); hi.setAttribute('fill','#fffdf8'); hi.setAttribute('opacity','.9');
      g.appendChild(path);
      g.appendChild(hi);
      bulbsGroup.appendChild(g);
    }
  }

  /* ---- parallax / interactive depth ---- */
  function applyParallax(dx, dy){
    var max = 5;
    var hx = clampNum(dx*max, -max, max);
    var hy = clampNum(dy*max, -max, max);
    if(scrapHeroArea) scrapHeroArea.style.transform = 'translate(' + hx.toFixed(2) + 'px,' + hy.toFixed(2) + 'px)';
    if(scrapSupportGrid) scrapSupportGrid.style.transform = 'translate(' + (-hx*0.6).toFixed(2) + 'px,' + (-hy*0.6).toFixed(2) + 'px)';
  }
  function onParallaxMouse(e){
    var rect = stage.getBoundingClientRect();
    var dx = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
    var dy = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
    applyParallax(dx, dy);
  }
  function onParallaxReset(){
    if(scrapHeroArea) scrapHeroArea.style.transform = '';
    if(scrapSupportGrid) scrapSupportGrid.style.transform = '';
  }
  function initParallax(){
    if(REDUCED_MOTION) return;
    var finePointer = !!(window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches);
    if(finePointer){
      stage.addEventListener('mousemove', onParallaxMouse);
      stage.addEventListener('mouseleave', onParallaxReset);
      return;
    }
    var gotOrientation = false;
    function onOrient(e){
      if(e.beta===null && e.gamma===null) return;
      if(!gotOrientation){
        gotOrientation = true;
        if(scrapHeroArea) scrapHeroArea.classList.remove('idle-float-hero');
        if(scrapSupportGrid) scrapSupportGrid.classList.remove('idle-float-grid');
      }
      var gx = clampNum((e.gamma||0)/24, -1, 1);
      var gy = clampNum(((e.beta||0)-45)/24, -1, 1);
      applyParallax(gx, gy);
    }
    if(window.DeviceOrientationEvent){
      window.addEventListener('deviceorientation', onOrient);
    }
    setTimeout(function(){
      if(!gotOrientation){
        if(window.DeviceOrientationEvent) window.removeEventListener('deviceorientation', onOrient);
        if(scrapHeroArea) scrapHeroArea.classList.add('idle-float-hero');
        if(scrapSupportGrid) scrapSupportGrid.classList.add('idle-float-grid');
      }
    }, 1000);
  }

  /* ---- reaching the end of the scrapbook gets a small reward ---- */
  function initEndOfScrollCelebration(){
    if(!scrapbookScroll || !collageCaption) return;
    var fired = false;
    var ticking = false;
    var hintFade = document.getElementById('scrollHintFade');
    function check(){
      ticking = false;
      if(fired) return;
      var el = scrapbookScroll;
      var nearBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 40;
      if(!nearBottom) return;
      fired = true;
      if(hintFade) hintFade.classList.add('at-end');
      if(!REDUCED_MOTION){
        var capRect = collageCaption.getBoundingClientRect();
        var canvasRect = page1Canvas.getBoundingClientRect();
        var cx = capRect.left + capRect.width / 2 - canvasRect.left;
        var cy = capRect.top - canvasRect.top;
        page1Field.sparkleBurst(cx, cy, 14, ['heart', 'star']);
      }
      scrapbookScroll.removeEventListener('scroll', onScroll);
    }
    function onScroll(){
      if(ticking || fired) return;
      ticking = true;
      requestAnimationFrame(check);
    }
    scrapbookScroll.addEventListener('scroll', onScroll, { passive:true });
  }

  /* ---- lightbox ---- */
  function openLightbox(src){
    if(!src) return;
    lightboxImg.src = src;
    lightbox.classList.add('show');
  }
  function closeLightbox(){
    lightbox.classList.remove('show');
  }
  lightbox.addEventListener('click', closeLightbox);

  /* ---- audio: chime + background music ---- */
  var chimeSynth = null;
  var muted = false;
  var bgMusic = document.getElementById('bgMusic');
  if(bgMusic) bgMusic.volume = 0.55;

  function tryPlayMusic(){
    if(!bgMusic || muted) return;
    var p = bgMusic.play();
    /* browsers block unmuted autoplay until the page has a user gesture — this attempt
       will simply succeed silently where the browser allows it (e.g. same-origin gesture
       already granted from index.html), and fail silently everywhere else, where the
       first-interaction fallback below picks it up instead */
    if(p && p.catch) p.catch(function(){});
  }
  tryPlayMusic();

  function initAudio(){
    if(!window.Tone) return Promise.resolve();
    return Tone.start().then(function(){
      if(Tone.context.state !== 'running') return Tone.context.resume();
    }).then(function(){
      if(!chimeSynth){
        chimeSynth = new Tone.Synth({ oscillator:{type:'sine'}, envelope:{attack:0.005,decay:0.25,sustain:0,release:0.25} }).toDestination();
        chimeSynth.volume.value = -14;
      }
    }).catch(function(){});
  }
  function playChime(){
    if(muted || !chimeSynth) return;
    try{
      chimeSynth.triggerAttackRelease('C6','16n');
      setTimeout(function(){ try{ chimeSynth.triggerAttackRelease('E6','16n'); }catch(e){} }, 100);
    }catch(e){}
  }

  document.getElementById('muteBtn').addEventListener('click', function(){
    muted = !muted;
    var onIcon = document.getElementById('muteIconOn');
    var offIcon = document.getElementById('muteIconOff');
    if(onIcon) onIcon.style.display = muted ? 'none' : 'block';
    if(offIcon) offIcon.style.display = muted ? 'block' : 'none';
    this.setAttribute('aria-pressed', muted ? 'false' : 'true');
    if(chimeSynth) chimeSynth.volume.value = muted ? -100 : -14;
    if(bgMusic){
      if(muted) bgMusic.pause(); else tryPlayMusic();
    }
  });

  /* initialize audio on first user interaction — same hook the chime already relied on,
     now also used to start the background music on any browser that blocked the
     immediate autoplay attempt above */
  document.body.addEventListener('click', function initAudioOnce(){
    initAudio();
    tryPlayMusic();
    document.body.removeEventListener('click', initAudioOnce);
  }, { once: true });

  /* ---- navigation ---- */
  function goTo(url){ window.location.href = url; }
  document.getElementById('prevBtn').addEventListener('click', function(){ goTo('index.html'); });
  document.getElementById('nextBtn').addEventListener('click', function(){ goTo('2.html'); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowLeft') goTo('index.html');
    if(e.key === 'ArrowRight') goTo('2.html');
  });

  /* swipe navigation */
  var touchStartX=0, touchStartY=0, touchActive=false;
  stage.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchActive = true;
  }, { passive:true });
  stage.addEventListener('touchend', function(e){
    if(!touchActive) return;
    touchActive = false;
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy) * 1.4){
      if(dx < 0) goTo('2.html'); else goTo('index.html');
    }
  }, { passive:true });

  /* resize handler */
  window.addEventListener('resize', function(){
    ambientField.resize();
    page1Field.resize();
  });

  /* start */
  buildScrapbook();
  buildFairyLights();
  initParallax();
  initEndOfScrollCelebration();
})();
</script>
</body>
