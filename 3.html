<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>💌 A Letter for You</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Pacifico&family=Quicksand:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-50: #fff6fa;
            --pink-100: #ffe6f1;
            --pink-150: #ffdcec;
            --pink-200: #ffc7e3;
            --pink-300: #ffa9d4;
            --pink-400: #ff87c2;
            --pink-500: #ff66af;
            --pink-600: #f0479c;
            --pink-700: #d6318a;
            --mint-200: #d3f8ec;
            --mint-300: #aef0dc;
            --mint-400: #7fe3c4;
            --mint-600: #2f9c7c;
            --lav-200: #ede1ff;
            --lav-400: #cbaeff;
            --peach-200: #ffe3cf;
            --butter-200: #fff2bf;
            --sky-200: #d7ecff;
            --blush-300: #ffcfe1;
            --ink: #6b2f4c;
            --white: #ffffff;
            --accent-1: #7fe3c4;
            --accent-2: #cbaeff;
            --rose-800: #8a2456;
            --font-display: 'Luckiest Guy', cursive, sans-serif;
            --font-script: 'Pacifico', cursive, sans-serif;
            --font-body: 'Quicksand', sans-serif;
            --font-cartoon-display: 'Baloo 2', cursive, sans-serif;
            --font-cartoon-body: 'Fredoka', sans-serif;
            --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, var(--pink-50), var(--pink-100) 55%, var(--pink-200));
            font-family: var(--font-body);
            font-weight: 500;
            color: var(--ink);
            padding: 18px;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        button {
            font-family: inherit;
            touch-action: manipulation;
        }

        button:focus-visible {
            outline: 3px solid var(--pink-600);
            outline-offset: 2px;
        }

        /* ===== STAGE ===== */
        .stage {
            position: relative;
            width: min(92vw, 420px, calc((100vh - 36px) * 5 / 7));
            width: min(92vw, 420px, calc((100dvh - 36px) * 5 / 7));
            aspect-ratio: 5/7;
            border-radius: 32px;
            overflow: hidden;
            background: linear-gradient(160deg, var(--pink-50), var(--pink-200));
            box-shadow: 0 30px 70px -18px rgba(107, 47, 76, .4), 0 12px 30px -10px rgba(214, 49, 138, .26), inset 0 0 0 1px rgba(255, 255, 255, .5);
            touch-action: pan-y;
        }

        @media (max-width:380px) {
            .stage {
                border-radius: 24px;
            }
        }

        .viewport {
            position: absolute;
            inset: 0;
            overflow: hidden;
            border-radius: inherit;
        }

        .ambient-canvas {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }

        .page {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 7% 8%;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            z-index: 1;
            transition: opacity .55s ease;
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 2;
        }

        .bg-pastel {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-pastel::before,
        .bg-pastel::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(20px);
            pointer-events: none;
        }

        .bg-pastel::before {
            width: 48%;
            height: 48%;
            top: -10%;
            left: -12%;
            animation: bgDriftA 10s ease-in-out infinite;
        }

        .bg-pastel::after {
            width: 40%;
            height: 40%;
            bottom: -9%;
            right: -10%;
            animation: bgDriftB 12.5s ease-in-out infinite;
        }

        .bg-pink-glow {
            background: radial-gradient(90% 70% at 50% 28%, #fff, var(--pink-150) 60%, var(--pink-200) 100%);
        }

        .bg-pink-glow::before {
            background: var(--mint-300);
            opacity: .3;
        }

        .bg-pink-glow::after {
            background: var(--peach-200);
            opacity: .4;
        }

        .content {
            position: relative;
            z-index: 2;
        }

        /* ===== PAGE 3 : THE BIRTHDAY WISH ===== */
        .page3-canvas {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        .wish-accent {
            position: absolute;
            font-size: clamp(20px, 5.6vw, 26px);
            pointer-events: none;
            opacity: 0;
        }

        .wish-accent-a {
            top: 14%;
            left: 8%;
        }

        .wish-accent-b {
            top: 15%;
            right: 9%;
        }

        .page3.active .wish-accent-a {
            animation: accentIn .5s var(--ease-spring) .3s both, quoteFloat 3.6s ease-in-out 1s infinite forwards;
        }

        .page3.active .wish-accent-b {
            animation: accentIn .5s var(--ease-spring) .45s both, quoteFloat 4.1s ease-in-out 1.2s infinite forwards;
        }

        /* ===== FAIRY LIGHT GARLAND (professional, perfect) ===== */
        .fairy-garland {
            position: absolute;
            top: 1%;
            left: 3%;
            right: 3%;
            height: clamp(42px, 11vw, 60px);
            z-index: 3;
            pointer-events: none;
            animation: garlandSwing 9s ease-in-out infinite;
            transform-origin: center top;
        }

        .garland-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        @keyframes garlandSwing {
            0%,
            100% {
                transform: rotate(0deg) translateY(0);
            }
            25% {
                transform: rotate(0.2deg) translateY(-1px);
            }
            75% {
                transform: rotate(-0.2deg) translateY(1px);
            }
        }

        /* ===== WISH CARD (LETTER PAPER) ===== */
        .wish-card {
            position: relative;
            width: 100%;
            max-width: 320px;
            max-height: 80%;
            background:
                repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2.5px,
                    rgba(185, 160, 150, 0.025) 2.5px,
                    rgba(185, 160, 150, 0.025) 3px),
                repeating-linear-gradient(90deg,
                    transparent,
                    transparent 3.5px,
                    rgba(175, 150, 140, 0.018) 3.5px,
                    rgba(175, 150, 140, 0.018) 4px),
                linear-gradient(166deg, #fffdf8 0%, #fef9f2 28%, #fdf5ec 62%, #fef7f3 100%);
            border: 1px solid rgba(215, 180, 195, 0.45);
            border-radius: 22px;
            padding: 8% 7%;
            box-shadow:
                0 1px 2px rgba(175, 135, 150, 0.08),
                0 3px 8px rgba(190, 145, 160, 0.09),
                0 7px 18px rgba(200, 150, 168, 0.1),
                0 14px 34px rgba(210, 155, 172, 0.1),
                0 0 0 0 rgba(255, 200, 180, 0);
            overflow: visible;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(14px) scale(.96);
        }

        .page3.active .wish-card {
            animation: popIn .6s var(--ease-spring) .1s forwards, cardBreathe 3.4s ease-in-out .9s infinite;
        }

        .page3.active .wish-card:has(.wish-letter.revealed) {
            animation: popIn .6s var(--ease-spring) .1s forwards, cardBreathe 6.5s ease-in-out .9s infinite;
        }

        /* Ambient glow behind the card */
        .wish-card::before {
            content: '';
            position: absolute;
            inset: -22px;
            background: radial-gradient(ellipse at center,
                    rgba(255, 215, 195, 0.38) 0%,
                    rgba(255, 200, 180, 0.14) 35%,
                    transparent 68%);
            border-radius: 38px;
            z-index: -1;
            pointer-events: none;
            animation: glowBreathe 3.8s ease-in-out infinite;
        }

        @keyframes glowBreathe {
            0%,
            100% {
                opacity: 0.75;
            }
            50% {
                opacity: 1;
            }
        }

        /* ===== FLORAL CORNER DECORATIONS ===== */
        .floral-corner {
            position: absolute;
            width: clamp(44px, 12.5vw, 68px);
            height: clamp(44px, 12.5vw, 68px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.85;
        }

        .floral-corner svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .floral-tl {
            top: 3px;
            left: 3px;
        }

        .floral-tr {
            top: 3px;
            right: 3px;
            transform: scaleX(-1);
        }

        .floral-bl {
            bottom: 3px;
            left: 3px;
            transform: scaleY(-1);
        }

        .floral-br {
            bottom: 3px;
            right: 3px;
            transform: scale(-1, -1);
        }

        /* ===== WISH LETTER CONTENT ===== */
        .wish-letter {
            display: flex;
            flex-direction: column;
            gap: 15px;
            filter: blur(9px);
            opacity: .5;
            transition: filter .8s ease, opacity .8s ease;
            position: relative;
            z-index: 1;
            overflow-y: auto;
            overflow-x: hidden;
            word-wrap: break-word;
            flex: 1;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
            padding-right: 2px;
            scrollbar-width: thin;
            scrollbar-color: rgba(214, 49, 138, .3) transparent;
        }

        .wish-letter.revealed {
            filter: blur(0);
            opacity: 1;
        }

        .wish-letter::-webkit-scrollbar {
            width: 5px;
        }

        .wish-letter::-webkit-scrollbar-track {
            background: transparent;
        }

        .wish-letter::-webkit-scrollbar-thumb {
            background: rgba(214, 49, 138, .25);
            border-radius: 999px;
        }

        .wish-letter::-webkit-scrollbar-thumb:hover {
            background: rgba(214, 49, 138, .4);
        }

        .wish-title {
            font-family: var(--font-script);
            font-size: clamp(19px, 5.6vw, 23px);
            color: var(--pink-700);
            margin: 0;
            text-align: center;
            line-height: 1.35;
            word-break: break-word;
            max-width: 100%;
            text-wrap: balance;
        }

        .wish-body {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 100%;
        }

        .wish-paragraph {
            margin: 0;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: clamp(14px, 3.9vw, 16px);
            line-height: 1.75;
            color: var(--ink);
            text-align: left;
            word-break: break-word;
            max-width: 100%;
        }

        .wish-signature-wrap {
            position: relative;
            display: inline-block;
            align-self: flex-end;
            margin-top: 8px;
            max-width: 100%;
        }

        .wish-signature {
            font-family: var(--font-script);
            font-size: clamp(15px, 4.2vw, 18px);
            color: var(--rose-800);
            margin: 0;
            word-break: break-word;
        }

        .love-float {
            position: absolute;
            top: -10px;
            right: 0;
            font-size: clamp(14px, 4vw, 17px);
            animation: loveFloat 2.8s ease-in-out infinite;
            pointer-events: none;
        }

        /* ===== SEAL ===== */
        .wish-seal-wrap {
            position: absolute;
            z-index: 6;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            opacity: 0;
        }

        .page3.active .wish-seal-wrap {
            animation: popIn .55s var(--ease-spring) .5s forwards;
        }

        .wish-seal-wrap.opened {
            pointer-events: none;
        }

        .wish-seal-wrap.opened .wish-seal-hint {
            opacity: 0;
        }

        .wish-seal {
            position: relative;
            width: clamp(60px, 20vw, 82px);
            height: clamp(60px, 20vw, 82px);
            border: none;
            background: none;
            padding: 0;
            cursor: pointer;
            filter: drop-shadow(0 10px 18px rgba(120, 20, 60, .4));
            animation: sealPulse 2.4s ease-in-out infinite;
        }

        .wish-seal::after {
            content: '';
            position: absolute;
            top: 16%;
            left: 20%;
            width: 32%;
            height: 22%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, .6), rgba(255, 255, 255, 0) 70%);
            pointer-events: none;
            transition: opacity .35s ease;
        }

        .wish-seal.cracked::after {
            opacity: 0;
        }

        .wish-seal-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            transition: transform .5s cubic-bezier(.4, 0, .2, 1), opacity .45s ease;
        }

        .wish-seal-half-left {
            clip-path: inset(0 50% 0 0);
        }

        .wish-seal-half-right {
            clip-path: inset(0 0 0 50%);
        }

        .wish-seal-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(22px, 7vw, 28px);
            transition: opacity .35s ease .05s, transform .4s ease;
        }

        .wish-seal.cracked {
            animation: none;
            pointer-events: none;
        }

        .wish-seal.cracked .wish-seal-half-left {
            transform: translateX(-16px) rotate(-26deg);
            opacity: 0;
        }

        .wish-seal.cracked .wish-seal-half-right {
            transform: translateX(16px) rotate(26deg);
            opacity: 0;
        }

        .wish-seal.cracked .wish-seal-icon {
            opacity: 0;
            transform: scale(.6) translateY(-4px);
        }

        .wish-seal-hint {
            margin: 0;
            font-size: clamp(10.5px, 3vw, 11.5px);
            font-weight: 700;
            letter-spacing: .2px;
            color: var(--pink-700);
            background: linear-gradient(180deg, #ffffff, #fff5f9);
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, .8);
            box-shadow: 0 8px 16px -4px rgba(214, 49, 138, .28), inset 0 1px 0 rgba(255, 255, 255, .9);
            transition: opacity .4s ease;
        }

        /* ===== CONTROLS ===== */
        .controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 3%;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .dots {
            display: flex;
            gap: 2px;
        }

        .dot {
            width: 26px;
            height: 26px;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            position: relative;
            display: inline-block;
        }

        .dot::after {
            content: '';
            position: absolute;
            inset: 9px;
            border-radius: 50%;
            background: rgba(214, 49, 138, .32);
            transition: background .2s, transform .2s;
        }

        .dot.active::after {
            background: var(--pink-600);
            transform: scale(1.15);
        }

        .control-buttons {
            display: flex;
            gap: 10px;
        }

        .control-buttons button {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, .7);
            background: linear-gradient(180deg, #ffffff, #fff5f9);
            box-shadow: 0 8px 18px -6px rgba(214, 49, 138, .35), 0 2px 6px -2px rgba(214, 49, 138, .22), inset 0 1px 0 rgba(255, 255, 255, .9);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, .7);
            background: linear-gradient(180deg, #ffffff, #fff5f9);
            box-shadow: 0 10px 20px -6px rgba(214, 49, 138, .38), 0 2px 6px -2px rgba(214, 49, 138, .22);
            color: var(--pink-600);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 6;
        }

        .nav-arrow.prev {
            left: 3%;
        }

        .nav-arrow.next {
            right: 3%;
        }

        .nav-arrow:active {
            transform: translateY(-50%) scale(.9);
        }

        /* ===== MUSIC PLAY BUTTON (autoplay fallback) ===== */
        .music-play-btn {
            position: absolute;
            left: 4%;
            bottom: 4%;
            z-index: 7;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, .65);
            background: rgba(255, 255, 255, .28);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
            box-shadow: 0 8px 18px -6px rgba(214, 49, 138, .4), inset 0 1px 0 rgba(255, 255, 255, .6);
            color: var(--pink-600);
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            animation: musicBtnPulse 1.9s ease-in-out infinite;
        }

        .music-play-btn.show {
            display: flex;
        }

        .music-play-btn:active {
            transform: scale(.9);
        }

        @keyframes musicBtnPulse {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 8px 18px -6px rgba(214, 49, 138, .4), inset 0 1px 0 rgba(255, 255, 255, .6);
            }
            50% {
                transform: scale(1.09);
                box-shadow: 0 10px 24px -6px rgba(214, 49, 138, .55), inset 0 1px 0 rgba(255, 255, 255, .7);
            }
        }

        @media (hover:hover) and (pointer:fine) {
            .control-buttons button:hover {
                box-shadow: 0 10px 22px -6px rgba(214, 49, 138, .42), 0 3px 8px -2px rgba(214, 49, 138, .28), inset 0 1px 0 rgba(255, 255, 255, .95);
            }
            .nav-arrow:hover {
                box-shadow: 0 12px 24px -6px rgba(214, 49, 138, .44), 0 3px 8px -2px rgba(214, 49, 138, .28);
            }
            .wish-seal:hover {
                filter: drop-shadow(0 14px 22px rgba(120, 20, 60, .46));
            }
        }

        /* keyframes */
        @keyframes popIn {
            0% {
                transform: scale(.3) translateY(16px);
                opacity: 0;
            }
            65% {
                transform: scale(1.1) translateY(-3px);
                opacity: 1;
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        @keyframes cardBreathe {
            0%,
            100% {
                box-shadow:
                    0 1px 2px rgba(175, 135, 150, 0.08),
                    0 3px 8px rgba(190, 145, 160, 0.09),
                    0 7px 18px rgba(200, 150, 168, 0.1),
                    0 14px 34px rgba(210, 155, 172, 0.1),
                    0 0 0 0 rgba(255, 200, 180, 0);
            }
            50% {
                box-shadow:
                    0 1px 3px rgba(175, 135, 150, 0.13),
                    0 5px 14px rgba(190, 145, 160, 0.14),
                    0 10px 26px rgba(200, 150, 168, 0.16),
                    0 18px 44px rgba(210, 155, 172, 0.14),
                    0 0 38px 10px rgba(255, 200, 180, 0.22);
            }
        }

        @keyframes accentIn {
            from {
                opacity: 0;
                transform: scale(.4) rotate(-15deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        @keyframes quoteFloat {
            0%,
            100% {
                transform: translateY(0) rotate(-3deg);
            }
            50% {
                transform: translateY(-6px) rotate(-1deg);
            }
        }

        @keyframes sealPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.07);
            }
        }

        @keyframes loveFloat {
            0%,
            100% {
                transform: translateY(0) rotate(-5deg) scale(1);
            }
            50% {
                transform: translateY(-8px) rotate(5deg) scale(1.18);
            }
        }

        @keyframes bgDriftA {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(6%, 8%) scale(1.15);
            }
        }

        @keyframes bgDriftB {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(-7%, -6%) scale(1.1);
            }
        }

        @media (prefers-reduced-motion:reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="viewport">
            <canvas class="ambient-canvas" id="ambientCanvas"></canvas>

            <!-- PAGE 3 : THE BIRTHDAY WISH -->
            <section class="page page3 active">
                <div class="bg-pastel bg-pink-glow"></div>
                <canvas class="page3-canvas" id="page3Canvas"></canvas>

                <!-- Professional Fairy Light Garland -->
                <div class="fairy-garland" aria-hidden="true">
                    <svg class="garland-svg" viewBox="0 0 400 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <style>
                                @keyframes twinkleA { 0%,100%{ opacity:0.5; } 45%{ opacity:1; } 75%{ opacity:0.7; } }
                                @keyframes twinkleB { 0%,100%{ opacity:0.6; } 35%{ opacity:0.3; } 70%{ opacity:1; } }
                                @keyframes twinkleC { 0%,100%{ opacity:0.55; } 30%{ opacity:1; } 65%{ opacity:0.65; } }
                                @keyframes twinkleD { 0%,100%{ opacity:0.7; } 40%{ opacity:0.4; } 80%{ opacity:1; } }

    <script>
        (function() {
            /* ================================================================
               ✏️  EDIT YOUR CARD HERE
               ================================================================ */
            var CONFIG = {
                wish: {
                    title: "To Someone Very Special",
                    text: "On your birthday, my only wish is that life gives you endless reasons to smile. I hope every new day brings you happiness, peace, good health, and beautiful moments that stay with you forever. I just hope your life is filled with the same happiness and warmth that you bring into my life without even knowing.\n\n" +
                        "Always remember, no matter what life brings or how difficult the days become, there will always be someone whose heart quietly wishes for your happiness above everything else. Someone who finds comfort in you, who silently prays that your days are gentle, and who hopes those mayabi eyes never lose their sparkle. Maybe one day, you'll realize who that someone is.\n\n" +
                        "You truly deserve a life full of love, kindness, and everything that makes your heart happy. Happy Birthday once again, Najiba. Stay happy, stay safe, and keep smiling... because your smile means more to me than you will ever know. ❤️",
                    signature: "With Love"
                }
            };

            /* ---- utils ---- */
            var REDUCED_MOTION = !!(window.matchMedia && window.matchMedia(
                '(prefers-reduced-motion: reduce)').matches);
            var COLORS = ['#ff87c2', '#ffb4d8', '#aef0dc', '#cbaeff', '#ffe3cf', '#fff2bf', '#ffffff'];

            function rand(a, b) { return Math.random() * (b - a) + a; }

            function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

            /* ---- canvas particle drawing ---- */
            function drawHeartPath(ctx, s) {
                ctx.beginPath();
                ctx.moveTo(0, s * 0.35);
                ctx.bezierCurveTo(-s * 0.1, s * 0.05, -s * 0.5, s * 0.05, -s * 0.5, -s * 0.25);
                ctx.bezierCurveTo(-s * 0.5, -s * 0.55, -s * 0.15, -s * 0.6, 0, -s * 0.3);
                ctx.bezierCurveTo(s * 0.15, -s * 0.6, s * 0.5, -s * 0.55, s * 0.5, -s * 0.25);
                ctx.bezierCurveTo(s * 0.5, s * 0.05, s * 0.1, s * 0.05, 0, s * 0.35);
                ctx.closePath();
            }

            function drawStarPath(ctx, s) {
                var spikes = 5,
                    outerR = s / 2,
                    innerR = outerR * 0.42,
                    rot = -Math.PI / 2,
                    step = Math.PI / spikes;
                ctx.beginPath();
                ctx.moveTo(0, -outerR);
                for (var i = 0; i < spikes; i++) {
                    rot += step;
                    ctx.lineTo(Math.cos(rot) * innerR, Math.sin(rot) * innerR);
                    rot += step;
                    ctx.lineTo(Math.cos(rot) * outerR, Math.sin(rot) * outerR);
                }
                ctx.closePath();
            }

            function drawParticle(ctx, p) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, Math.min(1, p.life)) * (p.fade !== undefined ? p.fade : 1);
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.fillStyle = p.color;
                if (p.kind === 'confetti') {
                    ctx.fillRect(-p.size / 2, -p.size * 0.18, p.size, p.size * 0.36);
                } else if (p.kind === 'heart') {
                    drawHeartPath(ctx, p.size);
                    ctx.fill();
                } else if (p.kind === 'star') {
                    var tw = 0.55 + 0.45 * Math.sin(p.twinklePhase || 0);
                    ctx.globalAlpha *= tw;
                    drawStarPath(ctx, p.size);
                    ctx.fill();
                } else if (p.kind === 'ribbon') {
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = p.size * 0.22;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(-p.size * 0.6, 0);
                    ctx.quadraticCurveTo(0, -p.size * 0.55, p.size * 0.6, 0);
                    ctx.stroke();
                } else if (p.kind === 'dot') {
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size / 2, 0, 6.2832);
                    ctx.fill();
                }
                ctx.restore();
            }

            function makeField(canvas, opts) {
                var ctx = canvas.getContext('2d');
                var dpr = Math.max(1, window.devicePixelRatio || 1);
                var fadeMul = (opts && opts.fade) || 1;
                var W = 0,
                    H = 0,
                    particles = [],
                    running = false,
                    rafId = null,
                    lastT = null;

                function resize() {
                    var r = canvas.getBoundingClientRect();
                    W = r.width;
                    H = r.height;
                    canvas.width = Math.max(1, Math.round(W * dpr));
                    canvas.height = Math.max(1, Math.round(H * dpr));
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                }
                resize();

                function spawnAmbient(kind) {
                    var p = {
                        kind: kind,
                        color: pick(COLORS),
                        rot: rand(0, 6.28),
                        rotSpeed: rand(-2, 2),
                        wobble: rand(6, 16),
                        wobbleSpeed: rand(0.8, 2.2),
                        wobblePhase: rand(0, 6.28),
                        life: 1,
                        decay: 0,
                        fade: fadeMul
                    };
                    if (kind === 'confetti') {
                        p.size = rand(7, 14);
                        p.x = rand(0, W);
                        p.y = rand(-H * 0.4, 0);
                        p.vx = rand(-10, 10);
                        p.vy = rand(28, 50);
                        p.gravity = rand(14, 22);
                        p.drag = 0.35;
                    } else if (kind === 'heart') {
                        p.size = rand(10, 17);
                        p.x = rand(0, W);
                        p.y = H + rand(0, H * 0.3);
                        p.vx = rand(-6, 6);
                        p.vy = -rand(16, 26);
                        p.gravity = -rand(1, 4);
                        p.drag = 0.2;
                    } else if (kind === 'star') {
                        p.size = rand(6, 11);
                        p.x = rand(0, W);
                        p.y = rand(0, H);
                        p.vx = 0;
                        p.vy = 0;
                        p.gravity = 0;
                        p.drag = 0;
                        p.twinklePhase = rand(0, 6.28);
                        p.twinkleSpeed = rand(1.2, 2.4);
                    } else if (kind === 'ribbon') {
                        p.size = rand(20, 32);
                        p.x = rand(0, W);
                        p.y = rand(-H * 0.3, H * 0.5);
                        p.vx = rand(-4, 4);
                        p.vy = rand(6, 14);
                        p.gravity = rand(2, 6);
                        p.drag = 0.3;
                    }
                    return p;
                }

                function seedAmbient(kinds, countEach) {
                    particles = [];
                    kinds.forEach(function(k) { for (var i = 0; i < countEach; i++) particles.push(
                            spawnAmbient(k)); });
                }

                function burst(x, y, count) {
                    for (var i = 0; i < count; i++) {
                        var isHeart = i % 4 === 0;
                        var angle = rand(0, 6.28),
                            speed = rand(70, 230);
                        particles.push({
                            kind: isHeart ? 'heart' : (i % 2 ? 'confetti' : 'dot'),
                            color: pick(COLORS),
                            size: isHeart ? rand(10, 15) : rand(6, 12),
                            x: x,
                            y: y,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed - 70,
                            gravity: 170,
                            drag: 0.4,
                            rot: rand(0, 6.28),
                            rotSpeed: rand(-7, 7),
                            wobble: 0,
                            wobbleSpeed: 0,
                            wobblePhase: 0,
                            life: 1,
                            decay: rand(0.5, 0.85),
                            fade: 1
                        });
                    }
                }

                function update(p, dt) {
                    p.vy += p.gravity * dt;
                    if (p.drag) { p.vx -= p.vx * p.drag * dt;
                        p.vy -= (p.vy * p.drag * 0.3) * dt; }
                    var wob = p.wobble ? Math.sin((p.wobblePhase || 0) + performance.now() * 0.001 * (p
                        .wobbleSpeed || 1)) * p.wobble * dt : 0;
                    p.x += (p.vx || 0) * dt + wob;
                    p.y += (p.vy || 0) * dt;
                    p.rot += (p.rotSpeed || 0) * dt;
                    if (p.kind === 'star') p.twinklePhase = (p.twinklePhase || 0) + (p.twinkleSpeed || 1.5) *
                    dt;
                    if (p.decay) p.life -= p.decay * dt;
                }

                function loop(t) {
                    if (!running) return;
                    if (lastT === null) lastT = t;
                    var dt = Math.min(0.05, (t - lastT) / 1000);
                    lastT = t;
                    ctx.clearRect(0, 0, W, H);
                    for (var i = particles.length - 1; i >= 0; i--) {
                        var p = particles[i];
                        update(p, dt);
                        if (p.decay && p.life <= 0) { particles.splice(i, 1); continue; }
                        var offBottom = p.y > H + 40 && (p.vy || 0) > 0;
                        var offTop = p.y < -40 && (p.vy || 0) < 0;
                        if (!p.decay && (offBottom || offTop)) { particles[i] = spawnAmbient(p.kind); continue; }
                        drawParticle(ctx, p);
                    }
                    rafId = requestAnimationFrame(loop);
                }
                return {
                    start: function() {
                        if (running) return;
                        running = true;
                        lastT = null;
                        rafId = requestAnimationFrame(loop);
                    },
                    stop: function() {
                        running = false;
                        if (rafId) cancelAnimationFrame(rafId);
                        ctx.clearRect(0, 0, W, H);
                    },
                    seedAmbient: seedAmbient,
                    burst: burst,
                    resize: resize,
                    getDimensions: function() { return { W: W, H: H }; }
                };
            }

            /* ---- DOM refs ---- */
            var stage = document.getElementById('stage');
            var ambientCanvas = document.getElementById('ambientCanvas');
            var page3Canvas = document.getElementById('page3Canvas');

            /* ---- ambient & page3 fields ---- */
            var ambientField = makeField(ambientCanvas, { fade: 0.28 });
            var page3Field = makeField(page3Canvas);
            var page3Seeded = false;

            if (!REDUCED_MOTION) {
                ambientField.seedAmbient(['star', 'dot'], 6);
                ambientField.start();
                page3Field.seedAmbient(['heart', 'star', 'ribbon'], 3);
                page3Field.start();
                page3Seeded = true;
            }

            /* ---- build wish content ---- */
            function buildWishPage() {
                var titleEl = document.getElementById('wishTitle');
                var bodyEl = document.getElementById('wishBody');
                var sigEl = document.getElementById('wishSignature');
                if (titleEl) titleEl.textContent = CONFIG.wish.title;
                if (bodyEl) {
                    bodyEl.innerHTML = '';
                    CONFIG.wish.text.split(/\n\s*\n/).forEach(function(para) {
                        para = para.trim();
                        if (!para) return;
                        var p = document.createElement('p');
                        p.className = 'wish-paragraph';
                        p.textContent = para;
                        bodyEl.appendChild(p);
                    });
                }
                if (sigEl) sigEl.textContent = CONFIG.wish.signature;
            }
            buildWishPage();

            /* ---- crack the wax seal ---- */
            var wishSealEl = document.getElementById('wishSeal');
            var wishSealWrapEl = document.getElementById('wishSealWrap');
            var wishLetterEl = document.getElementById('wishLetter');

            if (wishSealEl) {
                wishSealEl.addEventListener('click', function() {
                    if (wishSealEl.classList.contains('cracked')) return;
                    wishSealEl.classList.add('cracked');
                    wishSealEl.setAttribute('aria-label', 'Letter opened');
                    wishSealEl.tabIndex = -1;
                    if (wishSealWrapEl) wishSealWrapEl.classList.add('opened');
                    if (wishLetterEl) wishLetterEl.classList.add('revealed');
                    var r = page3Canvas.getBoundingClientRect();
                    var br = wishSealEl.getBoundingClientRect();
                    page3Field.burst(br.left + br.width / 2 - r.left, br.top + br.height / 2 - r.top,
                        22);
                    playChime();
                });
            }

            /* ---- audio chime ---- */
            var chimeSynth = null;
            var muted = false;

            function initAudio() {
                if (!window.Tone) return Promise.resolve();
                return Tone.start().then(function() {
                    if (Tone.context.state !== 'running') return Tone.context.resume();
                }).then(function() {
                    if (!chimeSynth) {
                        chimeSynth = new Tone.Synth({ oscillator: { type: 'sine' },
                            envelope: { attack: 0.005, decay: 0.25, sustain: 0, release: 0.25 } })
                            .toDestination();
                        chimeSynth.volume.value = -14;
                    }
                }).catch(function() {});
            }

            function playChime() {
                if (muted || !chimeSynth) return;
                try {
                    chimeSynth.triggerAttackRelease('C6', '16n');
                    setTimeout(function() { try { chimeSynth.triggerAttackRelease('E6', '16n'); } catch (
                        e) {} }, 100);
                } catch (e) {}
            }

            document.getElementById('muteBtn').addEventListener('click', function() {
                muted = !muted;
                this.textContent = muted ? '🔇' : '🔊';
                if (chimeSynth) chimeSynth.volume.value = muted ? -100 : -14;
            });

            /* initialize audio on first user interaction */
            document.body.addEventListener('click', function initAudioOnce() {
                initAudio();
                document.body.removeEventListener('click', initAudioOnce);
            }, { once: true });

            /* ---- background music (auto-play with tap-to-play fallback) ---- */
            var bgMusic = document.getElementById('bgMusic');
            var musicPlayBtn = document.getElementById('musicPlayBtn');
            var musicPlayIcon = document.getElementById('musicPlayIcon');

            function showMusicBtn() {
                if (musicPlayBtn) musicPlayBtn.classList.add('show');
            }

            function hideMusicBtn() {
                if (musicPlayBtn) musicPlayBtn.classList.remove('show');
            }

            function startBgMusic() {
                if (!bgMusic) return;
                var playPromise = bgMusic.play();
                if (playPromise !== undefined) {
                    playPromise.then(function() {
                        hideMusicBtn();
                    }).catch(function() {
                        showMusicBtn();
                    });
                }
            }

            /* try to auto-play as soon as the page is ready */
            startBgMusic();

            if (musicPlayBtn) {
                musicPlayBtn.addEventListener('click', function() {
                    if (!bgMusic) return;
                    if (bgMusic.paused) {
                        bgMusic.play().then(function() {
                            hideMusicBtn();
                        }).catch(function() {
                            showMusicBtn();
                        });
                    } else {
                        bgMusic.pause();
                        showMusicBtn();
                    }
                });
            }

            /* also try starting music on the very first tap anywhere,
               in case the browser blocked the initial autoplay attempt */
            document.body.addEventListener('click', function initMusicOnce() {
                if (bgMusic && bgMusic.paused) {
                    bgMusic.play().then(function() {
                        hideMusicBtn();
                    }).catch(function() {});
                }
                document.body.removeEventListener('click', initMusicOnce);
            }, { once: true });

            /* ---- navigation ---- */
            function goTo(url) { window.location.href = url; }
            document.getElementById('prevBtn').addEventListener('click', function() { goTo('2.html'); });
            document.getElementById('nextBtn').addEventListener('click', function() { goTo('4_new.html'); });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowLeft') goTo('2.html');
                if (e.key === 'ArrowRight') goTo('4_new.html');
            });

            /* swipe navigation */
            var touchStartX = 0,
                touchStartY = 0,
                touchActive = false;
            stage.addEventListener('touchstart', function(e) {
                if (e.touches.length !== 1) return;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchActive = true;
            }, { passive: true });
            stage.addEventListener('touchend', function(e) {
                if (!touchActive) return;
                touchActive = false;
                var dx = e.changedTouches[0].clientX - touchStartX;
                var dy = e.changedTouches[0].clientY - touchStartY;
                if (Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy) * 1.4) {
                    if (dx < 0) goTo('4_new.html');
                    else goTo('2.html');
                }
            }, { passive: true });

            /* resize handler */
            window.addEventListener('resize', function() {
                ambientField.resize();
                page3Field.resize();
            });

        })();
    </script>
</body>
</html>
